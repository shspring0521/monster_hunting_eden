<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>몬스터 헌팅: 에덴</title>
<style>
  html, body { margin: 0; height: 100%; background: #03050b; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; left: 0; top: 0; display: block; cursor: crosshair; touch-action: none; }
  #rot { position: fixed; inset: 0; display: none; z-index: 5; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #03050b; color: #eaffff; font: 700 20px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif; text-align: center; }
  #rot .ph { width: 54px; height: 92px; border: 3px solid #5fe1ff; border-radius: 10px; box-shadow: 0 0 18px #5fe1ff; animation: rt 1.6s ease-in-out infinite; }
  #rot small { color: #8f9bb8; font-size: 14px; font-weight: 600; }
  @keyframes rt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  #nm {
    position: absolute; display: none; box-sizing: border-box; margin: 0; padding: 0 12px;
    background: transparent; border: none; outline: none; color: #fff; text-align: center;
    font-weight: 700; font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  #nm::placeholder { color: #55607c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div>화면을 가로로 돌려 주세요<small>몬스터 헌팅: 에덴은 가로 화면에서 플레이해요</small></div>
<input id="nm" maxlength="10" placeholder="생존자 이름" autocomplete="off" spellcheck="false">
<script>
'use strict';
// =============================================================================
// 몬스터 헌팅 — HTML5 Canvas 버전 (단일 파일, 외부 파일 없음)
// 원본(pygame)의 수치·규칙을 그대로 옮기고, 그리기/연출만 새로 만들었다.
// =============================================================================

// ---- 기본 상수 ---------------------------------------------------------------
let VW = 1280, VH = 720;            // 논리 화면 크기 (창 크기에 맞춰 비율 유지 확대) — HUD를 키울 때만 잠깐 바뀜 (withUi)
const BASE_W = 1280, BASE_H = 720;
let UI_K = 1;                        // 지금 그리는 UI의 확대 배율 (모바일 HUD)
const MAP_W = 5000, MAP_H = 5000;   // 월드 크기
const TAU = Math.PI * 2;
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Segoe UI",sans-serif';

// ---- 수학 헬퍼 ---------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const mod = (a, n) => ((a % n) + n) % n;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/** 점 (px,py)와 선분 (ax,ay)-(bx,by) 사이의 최단 거리 */
function segDist(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  if (l2 <= 1e-9) return Math.hypot(px - ax, py - ay);
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}
/** 두 각도(도) 차이의 절댓값 0~180 */
const adiff = (a, b) => Math.abs(mod(a - b + 180, 360) - 180);
/** 초 → 'MM:SS.s' */
function fmtTime(t) {
  const d = Math.floor(Math.max(0, t) * 10 + 1e-6);   // 0.1초 단위로 먼저 자름 (59.99초가 '00:60.0'으로 보이던 문제)
  const m = Math.floor(d / 600), s = (d % 600) / 10;
  return String(m).padStart(2, '0') + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
const lerp = (a, b, k) => a + (b - a) * k;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };   // 두 각도의 차 (-π~π)
let DMG_SINK = null;   // 지금 진행 중인 게임 (누적 데미지 기록용)
const fmtNum = n => Math.round(n).toLocaleString('en-US');

// ---- 저장 (브라우저에 보관. 막혀 있으면 조용히 건너뜀) -------------------------
function loadJSON(k, d) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }

// ---- 설정 --------------------------------------------------------------------
// flash : 화면 번쩍임 (광과민성 배려)   shake : 화면 흔들림 + 히트스톱
// sound : 효과음                      bloom : 빛 번짐 (끄면 가벼워짐)
// fxAlpha : 내 공격 효과의 진하기 (낮출수록 투명해져서 적 탄이 잘 보임)
const SET = Object.assign({ flash: true, shake: true, sound: true, bloom: true, fxAlpha: 0.6, mobile: false, btnScale: 1, btnAlpha: 0.6 }, loadJSON('mh_settings', {}));
const FX_ALPHAS = [1, 0.8, 0.6, 0.4];
const saveSettings = () => saveJSON('mh_settings', SET);

// ---- 색상 --------------------------------------------------------------------
const C = {
  bg: '#060913', white: '#ffffff', gray: '#8f9bb8', dim: '#55607c',
  player: '#5fe1ff', gold: '#ffd84a', red: '#ff4d6a',
  straight: '#ff3b5c', tracker: '#ff9a2e', ranged: '#2ef2c0', mini: '#ffe14a', boss: '#ff2e63',
  xp: '#b47bff', bandage: '#3dff7a', magnet: '#2f6bff',
  skill: '#58b8ff', buff: '#56e08a', fusion: '#ffaa5a',
  runeDef: '#5ab0ff', runeAtk: '#ff7a45',
  hp: '#3df58a', hpLow: '#ff5a5a',
};
const _hexCache = new Map();
function hexRGB(h) {
  let v = _hexCache.get(h);
  if (!v) { const n = parseInt(h.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _hexCache.set(h, v); }
  return v;
}
const rgba = (h, a) => { const c = hexRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

// ---- 캔버스 ------------------------------------------------------------------
const cv = document.getElementById('c');
let ctx = cv.getContext('2d', { alpha: false });   // 그리기 대상 (내 공격 효과는 잠깐 별도 층으로 바꿔 그림)
const MAIN_CTX = ctx;
let RS = 1;                 // 렌더 배율 (논리 좌표 → 캔버스 픽셀)
let CSS_S = 1, OFF_X = 0, OFF_Y = 0;
const B1 = document.createElement('canvas'), B2 = document.createElement('canvas');
const FXL = document.createElement('canvas'), FXL_CTX = FXL.getContext('2d');   // 내 공격 효과 전용 층
let _lastW = 0, _lastH = 0;
/** 창 크기가 바뀌었으면 다시 맞춤 — iOS는 화면을 돌린 직후 크기가 늦게 바뀌어서 매 프레임 확인 */
function checkResize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w !== _lastW || h !== _lastH) resize();
}
function resize() {
  const w = window.innerWidth || BASE_W, h = window.innerHeight || BASE_H;
  _lastW = window.innerWidth; _lastH = window.innerHeight;
  CSS_S = Math.min(w / BASE_W, h / BASE_H);
  RS = clamp(CSS_S * (window.devicePixelRatio || 1), 0.5, 1.5);   // 너무 큰 해상도는 1.5배로 제한
  cv.width = Math.round(BASE_W * RS); cv.height = Math.round(BASE_H * RS);
  cv.style.width = BASE_W * CSS_S + 'px'; cv.style.height = BASE_H * CSS_S + 'px';
  OFF_X = (w - BASE_W * CSS_S) / 2; OFF_Y = (h - BASE_H * CSS_S) / 2;
  cv.style.left = OFF_X + 'px'; cv.style.top = OFF_Y + 'px';
  FXL.width = cv.width; FXL.height = cv.height;
  B1.width = Math.max(1, cv.width >> 2); B1.height = Math.max(1, cv.height >> 2);
  B2.width = Math.max(1, cv.width >> 3); B2.height = Math.max(1, cv.height >> 3);
  if (typeof App !== 'undefined' && App.placeNameInput) App.placeNameInput();
  // 폰을 세로로 들고 있으면 '가로로 돌려 주세요' 안내 (게임은 자동 일시정지)
  //   폰(짧은 변 600px 미만)에서만 — 태블릿(아이패드)은 세로여도 그대로 플레이 가능
  const rot = document.getElementById('rot'), coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const phone = Math.min(screen.width || w, screen.height || h) < 600;
  const portrait = (SET.mobile || coarse) && phone && h > w * 1.05;
  if (rot) rot.style.display = portrait ? 'flex' : 'none';
  if (portrait && typeof App !== 'undefined' && App.game && App.scene === 'game' && !App.game.over) App.game.paused = true;
}
/**
 * 내 공격 효과를 별도 층에 그린 뒤 설정한 진하기(투명도)로 화면에 더한다.
 * 화면이 난잡해져도 적과 적 탄이 묻히지 않게 하기 위함.
 */
function drawMyFx(fn) {
  const a = SET.fxAlpha;
  if (a >= 0.999) { fn(); return; }
  const tr = MAIN_CTX.getTransform();
  FXL_CTX.setTransform(1, 0, 0, 1, 0, 0);
  FXL_CTX.clearRect(0, 0, FXL.width, FXL.height);
  FXL_CTX.setTransform(tr);
  FXL_CTX.globalCompositeOperation = 'lighter';
  FXL_CTX.globalAlpha = 1;
  ctx = FXL_CTX;
  try { fn(); } finally { ctx = MAIN_CTX; }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a;
  ctx.drawImage(FXL, 0, 0);
  ctx.restore();
}
/** 빛 번짐: 화면을 작게 줄였다가 다시 키워서 밝은 부분만 더한다 */
function bloomPass() {
  if (!SET.bloom) return;
  const g1 = B1.getContext('2d'), g2 = B2.getContext('2d');
  g1.globalCompositeOperation = 'copy';
  g1.drawImage(cv, 0, 0, B1.width, B1.height);
  g2.globalCompositeOperation = 'copy';
  g2.drawImage(B1, 0, 0, B2.width, B2.height);
  g2.globalCompositeOperation = 'multiply';          // 어두운 곳은 더 어둡게 → 밝은 빛만 남김
  g2.drawImage(B1, 0, 0, B2.width, B2.height);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.6;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(B2, 0, 0, cv.width, cv.height);
  ctx.restore();
}

// ---- 그리기 헬퍼 -------------------------------------------------------------
const _fontCache = new Map();
function font(size, weight = 600) {
  if (SET.mobile && size < 16) size += (16 - size) * 0.45;   // 모바일: 작은 글자를 조금 키움
  const k = size * 1000 + weight;
  let f = _fontCache.get(k);
  if (!f) { f = `${weight} ${size}px ${FONT}`; _fontCache.set(k, f); }
  return f;
}
function txt(g, s, x, y, size, col, align = 'left', weight = 600, base = 'middle') {
  g.font = font(size, weight); g.textAlign = align; g.textBaseline = base;
  g.fillStyle = col; g.fillText(s, x, y);
}
/** 빛나는 글자 (제목용) */
function glowTxt(g, s, x, y, size, col, align = 'center', weight = 800, blur = 18) {
  g.save();
  g.shadowColor = col; g.shadowBlur = blur;
  txt(g, s, x, y, size, col, align, weight);
  g.shadowBlur = 0;
  g.restore();
}
function textW(g, s, size, weight = 600) { g.font = font(size, weight); return g.measureText(s).width; }
function wrapText(g, s, size, maxW, weight = 600) {
  g.font = font(size, weight);
  const out = []; let cur = '';
  for (const w of String(s).split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (g.measureText(t).width <= maxW) cur = t;
    else { if (cur) out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r);
  g.closePath();
}
function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
}
/** 반투명 패널 (네온 테두리) */
function panel(g, x, y, w, h, col = '#6fa8ff', a = 0.82, r = 12) {
  rr(g, x, y, w, h, r);
  g.fillStyle = `rgba(8,12,26,${a})`; g.fill();
  g.strokeStyle = rgba(col, 0.55); g.lineWidth = 1.5; g.stroke();
}
/** 게이지 바 */
function bar(g, x, y, w, h, ratio, col, back = 'rgba(255,255,255,0.08)') {
  rr(g, x, y, w, h, h / 2); g.fillStyle = back; g.fill();
  ratio = clamp(ratio, 0, 1);
  if (ratio > 0) {
    g.save(); rr(g, x, y, w, h, h / 2); g.clip();
    g.fillStyle = col; g.fillRect(x, y, w * ratio, h);
    g.fillStyle = 'rgba(255,255,255,0.28)'; g.fillRect(x, y, w * ratio, h * 0.38);
    g.restore();
  }
}

// ---- 스프라이트 캐시 (빛 번짐이 들어간 그림을 한 번만 그려 두고 재사용) ---------
const SPR = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
/** half = 중심에서 가장자리까지 논리 크기. fn(g)는 원점이 중심인 좌표로 그린다. */
function sprite(key, half, fn) {
  if (SPR[key]) return SPR[key];
  const K = 2, c = mkCanvas(half * 2 * K, half * 2 * K), g = c.getContext('2d');
  g.scale(K, K); g.translate(half, half);
  fn(g);
  c._h = half;
  return (SPR[key] = c);
}
function whiteOf(key) {
  const wk = key + '#w';
  if (SPR[wk]) return SPR[wk];
  const s = SPR[key], c = mkCanvas(s.width, s.height), g = c.getContext('2d');
  g.drawImage(s, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  c._h = s._h;
  return (SPR[wk] = c);
}
function drawSpr(s, x, y, rot = 0, scale = 1) {
  const h = s._h * scale;
  if (rot) {
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.drawImage(s, -h, -h, h * 2, h * 2);
    ctx.rotate(-rot); ctx.translate(-x, -y);
  } else ctx.drawImage(s, x - h, y - h, h * 2, h * 2);
}
/** 부드러운 빛 덩어리 (색마다 한 장) */
function glow(col) {
  return sprite('glow' + col, 32, g => {
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 32);
    gr.addColorStop(0, rgba(col, 0.95)); gr.addColorStop(0.25, rgba(col, 0.45));
    gr.addColorStop(0.6, rgba(col, 0.12)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.fillRect(-32, -32, 64, 64);
  });
}
function drawGlow(col, x, y, r, a = 1) {
  ctx.globalAlpha = a;
  ctx.drawImage(glow(col), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
/** 장판용: 가운데는 옅고 테두리가 밝은 원 */
function zoneSpr(col) {
  return sprite('zone' + col, 128, g => {
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 124);
    gr.addColorStop(0, rgba(col, 0.10)); gr.addColorStop(0.7, rgba(col, 0.22));
    gr.addColorStop(0.93, rgba(col, 0.42)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 126, 0, TAU); g.fill();
    g.strokeStyle = rgba(col, 0.95); g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, 120, 0, TAU); g.stroke();
  });
}
function drawZone(col, x, y, r, a = 1) {
  if (a <= 0.004) return;
  const k = r * 128 / 120;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(zoneSpr(col), x - k, y - k, k * 2, k * 2);
  ctx.globalAlpha = 1;
}
/** 빛나는 선 (넓고 옅은 선 + 밝은 심) — 'lighter' 합성에서 사용 */
function glowLine(pts, col, w, a = 1, closed = false) {
  if (pts.length < 2 || a <= 0.004) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  poly(ctx, pts); if (closed) ctx.closePath();
  ctx.globalAlpha = 0.28 * a; ctx.strokeStyle = col; ctx.lineWidth = w * 2.4; ctx.stroke();
  ctx.globalAlpha = 0.9 * a; ctx.lineWidth = w; ctx.stroke();
  ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, w * 0.35); ctx.stroke();
  ctx.globalAlpha = 1;
}
function glowRing(x, y, r, col, w, a = 1) {
  if (r <= 0 || a <= 0.004) return;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.globalAlpha = 0.25 * a; ctx.strokeStyle = col; ctx.lineWidth = w * 2.6; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- 효과음 (코드로 합성 — 음원 파일 없음) ------------------------------------
const SFX = {
  ac: null, out: null, nbuf: null, last: {},
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => { }); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.out = this.ac.createGain(); this.out.gain.value = 0.32;
      this.out.connect(this.ac.destination);
      const n = this.ac.sampleRate, b = this.ac.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = b;
    } catch (e) { this.ac = null; }
  },
  tone(f0, f1, dur, type, vol, delay = 0) {
    const ac = this.ac, t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, fc, delay = 0) {
    const ac = this.ac, t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.nbuf; f.type = 'lowpass'; f.frequency.setValueAtTime(fc, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, fc * 0.2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out);
    s.start(t, Math.random() * 0.5, dur + 0.05);
  },
  /** name: 소리 종류, gap: 같은 소리 최소 간격(초) — 연타로 시끄러워지는 것 방지 */
  play(name) {
    if (!SET.sound || !this.ac) return;

const FX = {
  parts: [], rings: [], trauma: 0, hitstop: 0, time: 0,
  MAX_PARTS: 1400,
  reset() { this.parts.length = 0; this.rings.length = 0; this.trauma = 0; this.hitstop = 0; },
  /** 불꽃 n개를 사방으로 튀긴다 */
  burst(x, y, col, n, spd = 220, life = 0.35, size = 2.2, kind = 0) {
    if (this.parts.length > this.MAX_PARTS) n = Math.min(n, 2);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = spd * (0.35 + Math.random() * 0.65);
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: life * (0.6 + Math.random() * 0.6), size: size * (0.7 + Math.random() * 0.6), col, drag: 0.9, kind });
    }
  },
  /** 한 방향으로 쏠린 불꽃 */
  spray(x, y, ang, spread, col, n, spd = 260, life = 0.3, size = 2) {
    if (this.parts.length > this.MAX_PARTS) return;
    for (let i = 0; i < n; i++) {
      const a = ang + rand(-spread, spread), v = spd * (0.4 + Math.random() * 0.6);
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: life * (0.6 + Math.random() * 0.6), size: size * (0.7 + Math.random() * 0.6), col, drag: 0.9, kind: 0 });
    }
  },
  /** 느리게 떠다니는 빛 점 */
  mote(x, y, col, vx = 0, vy = 0, life = 0.5, size = 5) {
    if (this.parts.length > this.MAX_PARTS) return;
    this.parts.push({ x, y, vx, vy, t: 0, life, size, col, drag: 0.95, kind: 1 });
  },
  ring(x, y, r0, r1, dur, col, w = 3) { if (this.rings.length < 160) this.rings.push({ x, y, r0, r1, dur, col, w, t: 0 }); },
  shake(a, cap = 1) { if (SET.shake && this.trauma < cap) this.trauma = Math.min(cap, this.trauma + a); },
  stop(t) { if (SET.shake) this.hitstop = Math.max(this.hitstop, t); },
  update(dt) {
    this.time += dt;
    const ps = this.parts; let j = 0;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i]; p.t += dt;
      if (p.t >= p.life) continue;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d; p.x += p.vx * dt; p.y += p.vy * dt;
      ps[j++] = p;
    }
    ps.length = j;
    const rs = this.rings; j = 0;
    for (let i = 0; i < rs.length; i++) { const r = rs[i]; r.t += dt; if (r.t < r.dur) rs[j++] = r; }
    rs.length = j;
  },
  /** 월드 좌표계에서 'lighter' 합성으로 그린다 */
  draw(vx0, vy0) {
    const x1 = vx0 + VW + 30, y1 = vy0 + VH + 30; vx0 -= 30; vy0 -= 30;
    ctx.lineCap = 'round';
    for (const p of this.parts) {
      if (p.x < vx0 || p.x > x1 || p.y < vy0 || p.y > y1) continue;
      const k = 1 - p.t / p.life;
      if (p.kind === 1) { drawGlow(p.col, p.x, p.y, p.size * (0.6 + 0.8 * k), k); continue; }

      ctx.strokeStyle = p.col; ctx.lineWidth = p.size * (0.4 + 0.6 * k);

  },

function itemDesc(id, curLv, player) {
  const n = curLv + 1;
  if (ITEMS[id].type === 'skill') {
    const sk = new SKILLS[id]();
    sk.level = Math.min(n, ITEMS[id].max);
    return sk.lines();
  }
  switch (id) {
    case 'atk_up': return [`공격력 +${n * 10}%`, '(기본 무기 · 자석 구체 · 지뢰)'];
    case 'spd_up': return [`쿨타임 -${n * 6}%`, '(모든 무기)'];
    case 'range_up': return [`사거리 +${n * 15}px`];
    case 'aoe_up':
      if (player && player.skills.has('cannon')) return [`스킬 범위 +${n * 8}%`, `포환 크기 +${n * 4}%`];
      if (player && (player.skills.has('sword') || player.skills.has('claw'))) return [`스킬 범위 +${n * 8}%`, `기본 무기 각도 +${n * 5}°`];
      return [`스킬 범위 +${n * 8}%`];
    case 'def_up': return [`받는 피해 -${n * 9}%`];
    case 'hp_up': return [`최대 HP +${n * 10}%`];
    case 'xp_up': return [`XP 획득량 +${n * 12}%`];
    case 'score_up': return [`점수 획득량 +${n * 10}%`];
    case 'magnet_up': return [`오브 끌어오는 거리 +${n * 45}%`, `(${Math.round(Game.XP_PICKUP * (1 + n * 0.45))}px)`];
    case 'move_up': return [`이동 속도 +${n * 11}%`];
  }
  return [];
}

// ---- 아이템 아이콘 (코드로 그림) ----------------------------------------------
function drawItemIcon(g, id, cx, cy, s, glowOn = false) {
  const col = ITEM_COLORS[id] || '#fff', W = '#fff';
  const X = x => cx + x * s, Y = y => cy + y * s;
  const lw = Math.max(1.3, s * 0.14);
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (glowOn) { g.shadowColor = col; g.shadowBlur = s * 0.9; }
  g.beginPath(); g.arc(cx, cy, s * 1.3, 0, TAU);
  g.fillStyle = rgba(col, 0.13); g.fill();
  g.strokeStyle = rgba(col, 0.95); g.lineWidth = Math.max(1, s * 0.1); g.stroke();
  g.shadowBlur = 0;
  const L = (pts, w = lw, c = col) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.strokeStyle = c; g.lineWidth = w; g.stroke(); };
  const F = (pts, c = col) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.closePath(); g.fillStyle = c; g.fill(); };
  const O = (x, y, r, c = col, w = 0) => { g.beginPath(); g.arc(X(x), Y(y), Math.max(0.8, r * s), 0, TAU); if (w) { g.strokeStyle = c; g.lineWidth = w; g.stroke(); } else { g.fillStyle = c; g.fill(); } };
  switch (id) {
    case 'cannon':
      O(0.1, 0.05, 0.6, rgba(col, 0.3)); O(0.1, 0.05, 0.6, col, lw); O(-0.1, -0.15, 0.15, W);
      for (const k of [-0.3, 0, 0.3]) L([[-0.95, k], [-0.62, k]]);
      break;
    case 'sword':
      L([[-0.65, 0.65], [0.7, -0.7]], Math.max(3, s * 0.28)); L([[-0.45, 0.45], [0.7, -0.7]], lw * 0.7, W);
      L([[-0.75, 0.35], [-0.35, 0.75]], lw * 1.3);
      break;
    case 'claw':
      for (const k of [-0.45, 0, 0.45]) L([0, 0.25, 0.5, 0.75, 1].map(t => [(-0.45 + k * 1.1 + t * 0.9) * 0.85, -0.7 + t * 1.4 + 0.2 * Math.sin(t * 3.1) - 0.1]), lw * 1.2);
      break;
    case 'shield': O(0, 0, 0.85, col, lw * 1.3); O(0, 0, 0.25, W); break;
    case 'missile':
      F([[0.75, -0.75], [0.15, -0.55], [-0.5, 0.1], [-0.1, 0.5], [0.55, -0.15]]);
      L([[-0.4, 0.4], [-0.8, 0.8]], lw * 1.3, '#ffe08a');
      break;
    case 'laser': case 'mega_laser': {
      const z = [[-0.8, 0.5], [-0.25, -0.45], [0.25, 0.45], [0.8, -0.5]];
      L(z, id === 'mega_laser' ? lw * 2.2 : lw * 1.4); L(z, Math.max(1, lw * 0.5), W);
      break;
    }
    case 'rifle':
      for (const k of [-0.45, 0, 0.45]) { L([[-0.6, k], [0.2, k]], lw * 1.5); O(0.45, k, 0.14, W); }
      break;
    case 'grenade':
      O(0, 0.15, 0.55); F([[-0.2, -0.65], [0.2, -0.65], [0.2, -0.4], [-0.2, -0.4]], '#d6dcee'); O(0.38, -0.62, 0.15, '#d6dcee', lw * 0.8);
      break;
    case 'orb':
      O(0, 0, 0.18, W);
      for (let k = 0; k < 4; k++) { const a = TAU * k / 4 + 0.4; O(Math.cos(a) * 0.68, Math.sin(a) * 0.68, 0.27); }
      break;
    case 'mine':
      g.beginPath(); g.ellipse(cx, cy + s * 0.12, s * 0.8, s * 0.38, 0, 0, TAU); g.fillStyle = '#7a8296'; g.fill();
      O(0, -0.1, 0.25);
      break;
    case 'meteor':
      L([[0.8, -0.8], [0.05, -0.05]], Math.max(3, s * 0.35), '#ffd06a'); O(-0.2, 0.2, 0.5); O(-0.3, 0.1, 0.14, W);
      break;
    case 'energy_field': O(0, 0, 0.9, col, lw); O(0, 0, 0.55, col, lw); O(0, 0, 0.22, '#ff6a4a'); break;
    case 'boundary':
      for (let k = 0; k < 6; k++) { const a0 = TAU * k / 6; L([0, 0.5, 1].map(t => [Math.cos(a0 + t * 0.6) * 0.82, Math.sin(a0 + t * 0.6) * 0.82]), lw * 1.3, k % 2 ? W : col); }
      O(0, 0, 0.18);
      break;
    case 'atk_up': F([[0, -0.8], [0.55, -0.1], [0.2, -0.1], [0.2, 0.75], [-0.2, 0.75], [-0.2, -0.1], [-0.55, -0.1]]); break;
    case 'spd_up': for (const o of [-0.35, 0.25]) L([[o - 0.25, -0.55], [o + 0.25, 0], [o - 0.25, 0.55]], lw * 1.6); break;
    case 'range_up': O(0, 0, 0.7, col, lw); L([[-0.95, 0], [0.95, 0]]); L([[0, -0.95], [0, 0.95]]); O(0, 0, 0.12, W); break;
    case 'aoe_up':
      O(0, 0, 0.3, col, lw); O(0, 0, 0.65, col, lw);
      for (const a of [0.785, 2.356, 3.927, 5.498]) L([[Math.cos(a) * 0.7, Math.sin(a) * 0.7], [Math.cos(a) * 1.0, Math.sin(a) * 1.0]], lw, W);
      break;
    case 'def_up': { const p = [[0, -0.8], [0.65, -0.5], [0.5, 0.35], [0, 0.8], [-0.5, 0.35], [-0.65, -0.5]]; F(p, rgba(col, 0.55)); L(p.concat([p[0]]), lw, W); break; }
    case 'hp_up': O(-0.3, -0.2, 0.36); O(0.3, -0.2, 0.36); F([[-0.65, -0.05], [0.65, -0.05], [0, 0.75]]); break;
    case 'xp_up': { const p = [[0, -0.8], [0.6, 0], [0, 0.8], [-0.6, 0]]; F(p); L(p.concat([p[0]]), lw, W); break; }
    case 'plasma':
      L([[-0.85, 0.35], [0.85, -0.35]], lw * 1.6); L([[-0.45, 0.18], [0.85, -0.35]], lw * 0.7, W); O(0.62, -0.25, 0.16, W);
      break;
    case 'vulcan':
      for (const k of [-0.28, 0.28]) { L([[-0.7, k], [0.75, k]], lw * 1.5); O(0.78, k, 0.1, W); }
      L([[-0.7, -0.5], [-0.7, 0.5]], lw * 1.2);
      break;
    case 'lightning': F([[0.15, -0.9], [-0.45, 0.08], [0.0, 0.08], [-0.2, 0.9], [0.5, -0.12], [0.05, -0.12]]); break;
    case 'homing':
      g.beginPath(); g.arc(cx - s * 0.1, cy + s * 0.1, s * 0.62, Math.PI * 0.55, Math.PI * 1.9); g.strokeStyle = col; g.lineWidth = lw * 1.2; g.stroke();
      F([[0.65, -0.55], [0.15, -0.6], [0.55, -0.1]]); O(-0.1, 0.1, 0.15, W);
      break;
    case 'magnet_up':
      g.beginPath(); g.arc(cx, cy - s * 0.05, s * 0.55, Math.PI, 0); g.strokeStyle = col; g.lineWidth = lw * 2; g.stroke();
      L([[-0.55, -0.05], [-0.55, 0.6]], lw * 2); L([[0.55, -0.05], [0.55, 0.6]], lw * 2);
      L([[-0.55, 0.42], [-0.55, 0.6]], lw * 2, W); L([[0.55, 0.42], [0.55, 0.6]], lw * 2, W);
      break;
    case 'move_up':
      for (const o of [-0.4, 0.05, 0.5]) L([[o - 0.25, -0.5], [o + 0.15, 0], [o - 0.25, 0.5]], lw * 1.3, o > 0.3 ? W : col);
      break;
    case 'heal': F([[-0.22, -0.75], [0.22, -0.75], [0.22, -0.22], [0.75, -0.22], [0.75, 0.22], [0.22, 0.22], [0.22, 0.75], [-0.22, 0.75], [-0.22, 0.22], [-0.75, 0.22], [-0.75, -0.22], [-0.22, -0.22]]); break;
    case 'score_up': { const p = []; for (let k = 0; k < 10; k++) { const r = k % 2 ? 0.38 : 0.85, a = -Math.PI / 2 + Math.PI * k / 5; p.push([Math.cos(a) * r, Math.sin(a) * r]); } F(p); break; }
  }
  g.restore();
}

function drawRuneIcon(g, id, cx, cy, s, col) {
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col; g.fillStyle = col;
  const lw = Math.max(1.4, s * 0.15);
  const ln = (pts, w = lw, close = false) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(cx + p[0] * s, cy + p[1] * s) : g.moveTo(cx + p[0] * s, cy + p[1] * s)); if (close) g.closePath(); g.lineWidth = w; g.stroke(); };
  const ci = (x, y, r, w = 0) => { g.beginPath(); g.arc(cx + x * s, cy + y * s, r * s, 0, TAU); if (w) { g.lineWidth = w; g.stroke(); } else g.fill(); };
  switch (id) {
    case 'barrier': {
      const p = k => Array.from({ length: 5 }, (_, i) => [Math.cos(rad(-90 + 72 * i)) * k, Math.sin(rad(-90 + 72 * i)) * k]);
      ln(p(1), lw, true); ln(p(0.5), lw * 0.7, true); break;
    }
    case 'slow':
      ci(0, 0, 1, lw); ci(0, 0, 0.5, lw * 0.7); ln([[0, -0.4], [0, 0.4]]);
      g.beginPath(); g.moveTo(cx - s * 0.3, cy + s * 0.2); g.lineTo(cx + s * 0.3, cy + s * 0.2); g.lineTo(cx, cy + s * 0.6); g.closePath(); g.fill();
      break;
    case 'lifesteal': ln([[-0.9, 0], [0.9, 0]], lw * 2.2); ln([[0, -0.9], [0, 0.9]], lw * 2.2); break;
    case 'invuln': ln([[-1, -0.7], [1, -0.7], [1, 0], [0, 1], [-1, 0]], lw, true); ci(0, -0.1, 0.2); break;
    case 'fire': ln([[0, -1], [0.6, -0.1], [0.8, 0.5], [0, 1], [-0.8, 0.5], [-0.5, -0.1], [-0.1, 0.1]], lw, true); break;
    case 'pulse':
      ci(0, 0, 0.4, lw);
      for (let i = 0; i < 8; i++) { const a = rad(i * 45); ln([[Math.cos(a) * 0.65, Math.sin(a) * 0.65], [Math.cos(a), Math.sin(a)]]); }
      break;
    case 'berserk': for (const o of [-0.45, 0.25]) ln([[-0.8, o + 0.5], [0, o - 0.3], [0.8, o + 0.5]], lw * 1.5); break;
    case 'nova': { const p = []; for (let i = 0; i < 16; i++) { const r = i % 2 ? 0.45 : 1, a = rad(i * 22.5 - 90); p.push([Math.cos(a) * r, Math.sin(a) * r]); } ln(p, lw, true); break; }
  }
  g.restore();
}

// 정12면체 꼭짓점/모서리 (보호막 렌더링용) — 한 번만 계산
const DODE_V = [], DODE_E = [];
(() => {
  const PHI = (1 + Math.sqrt(5)) / 2;
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) DODE_V.push([x, y, z]);
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    DODE_V.push([0, a / PHI, b * PHI], [a / PHI, b * PHI, 0], [a * PHI, 0, b / PHI]);
  }
  for (let i = 0; i < DODE_V.length; i++) for (let j = i + 1; j < DODE_V.length; j++) {
    const d = Math.hypot(DODE_V[i][0] - DODE_V[j][0], DODE_V[i][1] - DODE_V[j][1], DODE_V[i][2] - DODE_V[j][2]);
    if (Math.abs(d - 2 / PHI) < 0.01) DODE_E.push([i, j]);
  }
})();

// =============================================================================
// 무기 (스킬) — 수치는 원본과 동일. g = Game 객체
//   update(dt, g)  : 판정
//   drawUnder(g)   : 몬스터 아래에 깔리는 것 (장판, 오라)
//   drawOver(g)    : 몬스터 위에 그려지는 것 (탄, 검기, 구체)
// 버프 연동: cd(쿨타임 배율) / area(범위 배율) / atk(공격력 배율) / rangeBonus / aoeLv
// 레벨 성장: Lv1 = 원래 Lv1, Lv5 = 원래 Lv3의 125%, 그 사이는 같은 폭으로 증가
//   grow     : 클수록 좋은 값 (피해, 범위)
//   growDown : 작을수록 좋은 값 (쿨타임) — Lv5 = 원래 Lv3 ÷ 1.25
const grow = (a1, a3, L) => a1 + (a3 * 1.25 - a1) * (L - 1) / 4;
const growDown = (a1, a3, L) => a1 + (a3 / 1.25 - a1) * (L - 1) / 4;
const FUSION_MULT = 1.3;   // 융합 무기 성능 (원래 융합 무기의 130%)
const n1 = v => +v.toFixed(1);   // 설명용 소수 한 자리
/** 적 탄을 지운다 (자석 구체 / 경계선 / 프리즘 소드) */
function blockBullets(g, test) {
  let j = 0;
  for (const b of g.ebullets) {
    if (test(b)) { FX.burst(b.x, b.y, '#d9c8ff', 5, 160, 0.2, 1.8); continue; }
    g.ebullets[j++] = b;
  }
  g.ebullets.length = j;
}

// =============================================================================
class Skill {
  constructor() { this.level = 1; this.cd = 1; this.area = 1; this.atk = 1; this.rangeBonus = 0; this.aoeLv = 0; }
  upgrade() { if (this.level < 5 && !this.constructor.FUSION) this.level++; }
  get L() { return this.level; }
  /** 카드·일시정지 화면에 보여줄 현재 수치 (최대 3줄) */
  lines() { return []; }
  update(dt, g) { }
  drawUnder(g) { }
  drawOver(g) { }
}

// ---- 방어막 ------------------------------------------------------------------
class Shield extends Skill {
  static INTERVAL = 0.16;
  static RADII = [50, 78, 105];   // 원래 Lv1~3 (융합 무기 기준값으로 사용)
  constructor() { super(); this.t = 0; this.hitPulse = 0; }
  get interval() { return Shield.INTERVAL * this.cd; }
  static SIZE_MULT = 1.1;   // 기본 크기 +10%
  get radius() { return Math.floor(grow(50, 105, this.L) * Shield.SIZE_MULT * this.area); }
  static GROWTH = 2 / 3;   // 레벨당 피해 증가폭은 원래의 2/3 (Lv1 3은 그대로, Lv5 6.25 → 5.17)
  get damage() { return 3 + (grow(3, 5, this.L) - 3) * Shield.GROWTH; }
  lines() { return [`범위 ${this.radius}px`, `${this.interval.toFixed(2)}초마다 ${n1(this.damage)} 피해`, '항상 작동하는 오라']; }
  update(dt, g) {
    this.t += dt; this.hitPulse = Math.max(0, this.hitPulse - dt * 5);
    if (this.t >= this.interval) {
      this.t -= this.interval;
      const p = g.player, r = this.radius; let any = false;
      for (const m of g.mons) if (dist(p.x, p.y, m.x, m.y) < r) { m.hp -= this.damage; any = true; }
      if (any) this.hitPulse = 1;
    }
  }
  drawUnder(g) {
    const p = g.player, r = this.radius;
    drawZone('#6eb4ff', p.x, p.y, r, 0.7 + 0.3 * this.hitPulse);
    ctx.save();
    ctx.setLineDash([r * 0.24, r * 0.17]); ctx.lineDashOffset = -FX.time * 70;
    ctx.strokeStyle = '#cfe8ff'; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.8, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/** 미사일 그림: +x 방향을 향한 작은 로켓 (빨간 탄두 · 흰 몸통 · 날개) */

});
class Missile extends Skill {
  static BLAST = [20, 30, 41];
  static FALL = 0.4;
  constructor() { super(); this.t = 0; this.fx = []; this.patches = []; this.flashes = []; }
  get rate() { return grow(4, 8, this.L) / this.cd; }
  get blastR() { return Math.floor(grow(20, 41, this.L) * this.area); }
  get damage() { return grow(2, 4, this.L); }
  get dot() { return grow(1, 3, this.L); }
  get interval() { return 1 / this.rate; }
  lines() { return [`초당 ${n1(this.rate)}발 · 폭발 ${this.blastR}px`, `폭발 ${n1(this.damage)} 피해`, `장판 0.1초당 ${n1(this.dot)} (2초)`]; }
  update(dt, g) {
    this.t += dt;
    while (this.t >= this.interval) {
      this.t -= this.interval;
      const x = rand(g.cam.x, g.cam.x + VW), y = rand(g.cam.y, g.cam.y + VH), side = Math.random() < 0.5 ? -1 : 1;
      // 화면 위쪽 비스듬한 곳에서 날아와 꽂힘 (좌우 방향은 무작위)
      this.fx.push({ x, y, sx: x + side * rand(120, 200), sy: y - rand(380, 460), r: this.blastR, dmg: this.damage, dot: this.dot, age: 0 });
    }
    let j = 0;
    for (const e of this.fx) {
      e.age += dt;
      if (e.age >= Missile.FALL) {
        for (const m of g.mons) if (dist(e.x, e.y, m.x, m.y) < e.r) m.hp -= e.dmg;
        this.patches.push({ x: e.x, y: e.y, r: e.r, dot: e.dot, age: 0, tick: 0 });   // 2초짜리 지속 피해 장판
        this.flashes.push({ x: e.x, y: e.y, r: e.r, t: 0 });
        if (g.inView(e.x, e.y, e.r)) {   // 착탄: 불꽃 + 파편 + 충격파
          FX.burst(e.x, e.y, '#ffd36a', 10, 300, 0.3, 2.6); FX.burst(e.x, e.y, '#ff6a2a', 8, 200, 0.4, 3); FX.burst(e.x, e.y, '#3a2a22', 5, 260, 0.45, 2.2);
          FX.ring(e.x, e.y, e.r * 0.3, e.r * 1.4, 0.24, '#ffd36a', 3);
          FX.mote(e.x, e.y - 4, '#5a4a44', rand(-15, 15), -30, 0.7, e.r * 0.6);
          FX.shake(0.05, 0.15);
        }
        sfx('thud');
        continue;
      }
      const k = e.age / Missile.FALL, q = k * k, mx = lerp(e.sx, e.x, q), my = lerp(e.sy, e.y, q);   // 점점 빨라지며 떨어짐
      if (g.inView(mx, my, 40) && Math.random() < dt * 45) FX.mote(mx + rand(-2, 2), my + rand(-2, 2), '#8a8090', rand(-8, 8), rand(-8, 8), 0.45, 5);   // 연기 꼬리
      this.fx[j++] = e;
    }
    this.fx.length = j;
    for (const f of this.flashes) f.t += dt;
    this.flashes = this.flashes.filter(f => f.t < 0.18);
    j = 0;
    for (const pt of this.patches) {
      pt.age += dt; pt.tick += dt;
      if (pt.tick >= 0.1) { pt.tick = 0; for (const m of g.mons) if (!m.fly && dist(pt.x, pt.y, m.x, m.y) < pt.r) m.hp -= pt.dot; }
      if (pt.age < 2.0) this.patches[j++] = pt;
    }
    this.patches.length = j;
  }
  drawUnder(g) {
    for (const pt of this.patches) if (g.inView(pt.x, pt.y, pt.r)) drawZone('#ff8a2e', pt.x, pt.y, pt.r, 0.6 * (1 - pt.age / 2));
    for (const e of this.fx) {   // 착탄 지점: 좁혀지는 조준 표시
      if (!g.inView(e.x, e.y, e.r)) continue;
      const k = e.age / Missile.FALL;
      drawReticle(e.x, e.y, e.r * (1.1 - 0.45 * k), k * 1.5, '#ff6a3a', 0.3 + 0.55 * k, 1.8);
    }
  }
  drawOver(g) {
    for (const e of this.fx) {   // 미사일 본체 + 불꽃 꼬리
      const k = e.age / Missile.FALL, q = k * k, x = lerp(e.sx, e.x, q), y = lerp(e.sy, e.y, q);
      if (!g.inView(x, y, 60)) continue;
      const a = Math.atan2(e.y - e.sy, e.x - e.sx), cx = Math.cos(a), cy = Math.sin(a), fl = 0.8 + 0.4 * Math.random();
      ctx.globalCompositeOperation = 'lighter';
      glowLine([[x - cx * 34 * fl, y - cy * 34 * fl], [x - cx * 10, y - cy * 10]], '#ff8a2e', 6, 0.75);
      glowLine([[x - cx * 20 * fl, y - cy * 20 * fl], [x - cx * 10, y - cy * 10]], '#fff2b0', 2.5, 1);
      drawGlow('#ffb347', x - cx * 12, y - cy * 12, 14 * fl, 0.8);
      ctx.globalCompositeOperation = 'source-over';
      drawSpr(missileSpr(), x, y, a, 1);
    }
    for (const f of this.flashes) {   // 착탄 섬광
      if (!g.inView(f.x, f.y, f.r * 2)) continue;
      const k = f.t / 0.18;
      ctx.globalCompositeOperation = 'lighter';
      drawGlow('#ffffff', f.x, f.y, f.r * (0.8 + 0.6 * k), 0.9 * (1 - k));
      drawGlow('#ff9a2e', f.x, f.y, f.r * (1.2 + 0.8 * k), 0.7 * (1 - k));
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

// ---- 레이저 빔 (레이저 / 거대 레이저 공용) --------------------------------------
// 화면 가장자리에 닿으면 반사, 몬스터는 관통(한 마리당 1회 피해)
class Beam {
  static SPEED = 16;     // 60fps 기준 프레임당 픽셀
  static TRAIL = 170;    // 꼬리 길이 (px)
  constructor(x, y, dx, dy, bounces, dmg, width, col) {
    this.x = x; this.y = y; this.dx = dx; this.dy = dy;
    this.bounces = bounces; this.dmg = dmg; this.width = width; this.col = col;
    this.trail = [[x, y]]; this.hit = new Set(); this.age = 0; this.done = false;
  }
  update(dt, g) {
    this.age += dt;
    if (this.age >= 4) { this.done = true; return; }
    let rem = Beam.SPEED * dt * 60, guard = 0;
    const L = g.cam.x, R = L + VW, T = g.cam.y, B = T + VH;
    const path = [[this.x, this.y]];
    while (rem > 1e-6 && guard++ < 8) {
      let tx = Infinity, ty = Infinity;
      if (this.dx > 0) tx = (R - this.x) / this.dx; else if (this.dx < 0) tx = (L - this.x) / this.dx;
      if (this.dy > 0) ty = (B - this.y) / this.dy; else if (this.dy < 0) ty = (T - this.y) / this.dy;
      const t = Math.max(0, Math.min(tx, ty));
      if (t > rem) { this.x += this.dx * rem; this.y += this.dy * rem; break; }
      this.x += this.dx * t; this.y += this.dy * t; rem -= t;
      if (tx <= ty) this.dx = -this.dx;
      if (ty <= tx) this.dy = -this.dy;
      path.push([this.x, this.y]); this.trail.push([this.x, this.y]);
      FX.burst(this.x, this.y, this.col, 5, 180, 0.25, 2);
      if (this.bounces > 0) this.bounces--; else { this.done = true; break; }
    }
    path.push([this.x, this.y]);
    // 이번 프레임에 지나간 경로에 닿은 몬스터에게 관통 피해
    const rr_ = this.width / 2;
    for (const m of g.mons) {
      if (this.hit.has(m)) continue;
      const lim = m.r + rr_;
      for (let i = 0; i + 1 < path.length; i++) {
        if (segDist(path[i][0], path[i][1], path[i + 1][0], path[i + 1][1], m.x, m.y) < lim) { m.hp -= this.dmg; this.hit.add(m); break; }
      }
    }
    this._trim();
  }
  _trim() {   // 꼬리를 머리에서부터 TRAIL 길이만 남긴다
    const pts = this.trail; let len = 0, px = this.x, py = this.y;
    for (let i = pts.length - 1; i >= 0; i--) {
      const d = dist(px, py, pts[i][0], pts[i][1]);
      if (len + d >= Beam.TRAIL) {
        const k = (Beam.TRAIL - len) / (d || 1);
        pts[i] = [px + (pts[i][0] - px) * k, py + (pts[i][1] - py) * k];
        pts.splice(0, i);
        return;
      }
      len += d; px = pts[i][0]; py = pts[i][1];
    }
  }
  draw() {
    const pts = this.trail.concat([[this.x, this.y]]);
    glowLine(pts, this.col, Math.max(2, this.width * 0.55));
    drawGlow(this.col, this.x, this.y, this.width * 1.3);
    drawGlow('#ffffff', this.x, this.y, this.width * 0.6);
  }
}

class Laser extends Skill {
  static BASE_INTERVAL = 1.2;
  static BASE_WIDTH = 18;
  constructor() { super(); this.t = 0; this.beams = []; }
  get bounces() { return this.L; }   // 반사 횟수 = 레벨
  get damage() { return grow(5, 9, this.L); }
  get width() { return Laser.BASE_WIDTH * this.area; }
  get interval() { return growDown(1.2, 0.72, this.L) * this.cd; }
  lines() { return [`반사 ${this.bounces}회 · ${n1(this.damage)} 피해`, `쿨타임 ${this.interval.toFixed(2)}초`, '적을 관통']; }
  update(dt, g) {
    this.t += dt;
    if (this.t >= this.interval) {
      const p = g.player, tg = g.nearest(p.x, p.y);
      if (tg) {
        this.t = 0;
        const a = Math.atan2(tg.y - p.y, tg.x - p.x);
        this.beams.push(new Beam(p.x, p.y, Math.cos(a), Math.sin(a), this.bounces, this.damage, this.width, '#ff4dcf'));
        sfx('laser');
      }
    }
    for (const b of this.beams) b.update(dt, g);
    this.beams = this.beams.filter(b => !b.done);
  }
  drawOver(g) { for (const b of this.beams) b.draw(); }
}

// ---- 소총 --------------------------------------------------------------------
class Rifle extends Skill {
  static RANGES = [300, 360, 450];
  static SPEED = 16;
  constructor() { super(); this.t = 0; this.bullets = []; }
  get interval() { return growDown(0.3, 0.1, this.L) * this.cd; }
  get damage() { return grow(2, 4, this.L); }
  get maxRange() { return Math.round(grow(300, 450, this.L)) + this.rangeBonus; }
  lines() { return [`${this.interval.toFixed(3)}초마다 발사`, `${n1(this.damage)} 피해`, `사거리 ${this.maxRange}px`]; }
  get bulletR() { return 5 * this.area; }
  update(dt, g) {
    this.t += dt;
    const p = g.player;
    if (this.t >= this.interval) {
      const tg = g.nearest(p.x, p.y, this.maxRange);
      if (tg) {
        this.t = 0;
        const a = Math.atan2(tg.y - p.y, tg.x - p.x);
        this.bullets.push({ x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), dmg: this.damage, max: this.maxRange, r: this.bulletR, trav: 0 });
        sfx('shot');
      }
    }
    let j = 0;
    for (const b of this.bullets) {
      const step = Math.min(Rifle.SPEED * dt * 60, b.max - b.trav);
      const ox = b.x, oy = b.y, nx = ox + b.dx * step, ny = oy + b.dy * step;
      let best = null, bt = Infinity;   // 경로에서 가장 먼저 닿는 몬스터 (관통 없음)
      for (const m of g.mons) {
        if (segDist(ox, oy, nx, ny, m.x, m.y) < m.r + b.r) {
          const t = (m.x - ox) * b.dx + (m.y - oy) * b.dy;
          if (t < bt) { bt = t; best = m; }
        }
      }
      if (best) {
        best.hp -= b.dmg;
        FX.spray(best.x, best.y, Math.atan2(-b.dy, -b.dx), 0.9, '#fff3c4', 3, 200, 0.2, 1.6);
        continue;
      }
      b.x = nx; b.y = ny; b.trav += step;
      if (b.trav < b.max - 1e-6) this.bullets[j++] = b;
    }
    this.bullets.length = j;
  }
  drawOver(g) {
    for (const b of this.bullets) {
      if (!g.inView(b.x, b.y, 30)) continue;
      const w = Math.max(2, b.r * 0.7);
      glowLine([[b.x - b.dx * 20, b.y - b.dy * 20], [b.x, b.y]], '#ffe9a8', w);
    }
  }
}

// ---- 수류탄 장판 (수류탄 / 메테오 공용) ----------------------------------------
class Patch {
  static DURATION = 3.5;
  static TICK = 0.3;
  constructor(x, y, r, blast, dot, dur = Patch.DURATION, col = '#62e06a') {
    this.x = x; this.y = y; this.r = r; this.blast = blast; this.dot = dot; this.dur = dur; this.col = col;
    this.age = 0; this.tick = 0; this.done = false; this.blastLeft = 3;   // 폭발 피해는 3프레임에 나눠 적용
  }
  update(dt, mons) {
    if (this.blastLeft > 0) {
      this.blastLeft--;
      const d = this.blast / 3;
      for (const m of mons) if (dist(this.x, this.y, m.x, m.y) < this.r) m.hp -= d;
    }
    this.age += dt; this.tick += dt;
    if (this.tick >= Patch.TICK) {
      this.tick = 0;
      for (const m of mons) if (!m.fly && dist(this.x, this.y, m.x, m.y) < this.r) m.hp -= this.dot;   // 날아다니는 적은 장판 피해 무시
    }
    if (this.age >= this.dur) this.done = true;
  }
  draw(g) {
    if (!g.inView(this.x, this.y, this.r)) return;
    const fade = Math.max(0, 1 - this.age / this.dur);
    drawZone(this.col, this.x, this.y, this.r, 0.2 + 0.65 * fade);
    const k = (this.tick / Patch.TICK);
    glowRing(this.x, this.y, this.r * (0.25 + 0.7 * k), this.col, 1.5, 0.35 * (1 - k) * fade);
  }
}

class Grenade extends Skill {
  // 장판 없이 '폭발'만: 피해 2배 · 범위 1.2배 · 투척 간격 4/5 · 넉백 + 0.4초 감속 15%
  static BASE_INTERVAL = (Patch.DURATION + 0.5) * 0.8;   // 3.2초
  static RADIUS_MULT = 1.2;
  static KB = 28;
  static SLOW_T = 0.4;            // 맞은 적: 0.4초 동안 이동 속도 -15% (effSpeed 참고)
  static FLIGHT = 0.28;           // 던져서 터지기까지
  constructor() { super(); this.t = Grenade.BASE_INTERVAL; this.nades = []; this.booms = []; }   // 시작하자마자 첫 투척
  get interval() { return Grenade.BASE_INTERVAL * this.cd; }
  get count() { return this.L; }   // 수류탄 개수 = 레벨
  get radius() { return Math.floor(grow(50, 110, this.L) * Grenade.RADIUS_MULT * this.area); }
  get blast() { return grow(3, 7, this.L) * 2; }
  lines() { return [`수류탄 ${this.count}개 · 폭발 범위 ${this.radius}px`, `폭발 피해 ${n1(this.blast)} · 넉백 · 0.4초 감속 15%`, `${this.interval.toFixed(1)}초마다 투척`]; }
  positions(p) {   // Lv1=위, Lv2=위/아래, Lv3~=정다각형
    const r = this.radius, n = this.count;
    if (n === 1) return [[p.x, p.y - r]];
    if (n === 2) return [[p.x, p.y - r], [p.x, p.y + r]];
    return Array.from({ length: n }, (_, i) => [p.x + Math.cos(rad(i * 360 / n)) * r, p.y + Math.sin(rad(i * 360 / n)) * r]);
  }
  update(dt, g) {
    const p = g.player;
    this.t += dt;
    if (this.t >= this.interval) {   // 던지기: 플레이어에게서 포물선으로 날아감
      this.t = 0;
      for (const [x, y] of this.positions(p)) this.nades.push({ sx: p.x, sy: p.y, x, y, age: 0, r: this.radius, dmg: this.blast, spin: rand(-12, 12) });
      sfx('launch');
    }
    let j = 0;
    for (const n of this.nades) {
      n.age += dt;
      if (n.age >= Grenade.FLIGHT) { this.explode(g, n); continue; }
      this.nades[j++] = n;
    }
    this.nades.length = j;
    for (const b of this.booms) b.t += dt;
    this.booms = this.booms.filter(b => b.t < 0.42);
  }
  explode(g, n) {
    const { x, y, r } = n;
    for (const m of g.mons) {
      if (m.kind === 'crate' && dist(x, y, m.x, m.y) >= r + m.r) continue;
      if (dist(x, y, m.x, m.y) < r + m.r * 0.5) {
        m.hp -= n.dmg;
        if (m.kind !== 'crate') { g.knockback(m, x, y, Grenade.KB, 0.18); m.gslow = Grenade.SLOW_T; }
      }
    }
    this.booms.push({ x, y, r, t: 0 });
    if (g.inView(x, y, r)) {
      FX.burst(x, y, '#ffd36a', 22, 380, 0.45, 3); FX.burst(x, y, '#ff6a2a', 16, 260, 0.55, 3.4); FX.burst(x, y, '#ffffff', 6, 200, 0.2, 2.4);
      FX.ring(x, y, r * 0.2, r * 1.05, 0.28, '#ffe08a', 5); FX.ring(x, y, r * 0.5, r * 1.35, 0.4, '#ff8a3d', 2.5);
      for (let k = 0; k < 6; k++) { const a = rand(0, TAU), d = rand(0, r * 0.6); FX.mote(x + Math.cos(a) * d, y + Math.sin(a) * d, '#6a5a52', Math.cos(a) * 30, Math.sin(a) * 30 - 20, 0.7, r * 0.35); }   // 연기
      FX.shake(0.18, 0.4); sfx('boom');
    }
  }
  drawUnder(g) {   // 떨어질 자리 표시
    for (const n of this.nades) if (g.inView(n.x, n.y, n.r)) glowRing(n.x, n.y, n.r * (1.15 - 0.15 * n.age / Grenade.FLIGHT), '#ffb347', 1.5, 0.25 + 0.4 * n.age / Grenade.FLIGHT);
  }
  drawOver(g) {
    for (const n of this.nades) {   // 날아가는 수류탄 (포물선, 빙글빙글)
      const k = n.age / Grenade.FLIGHT, x = lerp(n.sx, n.x, k), y = lerp(n.sy, n.y, k) - Math.sin(Math.PI * k) * 60;
      ctx.save(); ctx.translate(x, y); ctx.rotate(n.spin * n.age);
      ctx.fillStyle = '#2f5a2c'; ctx.strokeStyle = '#a8ff9a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 8.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#cfd6c6'; ctx.fillRect(-3, -12, 6, 4);
      ctx.restore();
      drawGlow('#ffe08a', x + 2, y - 11, 6, 0.9);   // 불붙은 신관
    }
    for (const b of this.booms) {   // 폭발 불덩이: 하얗게 번쩍 → 주황 불꽃 → 사그라듦
      if (!g.inView(b.x, b.y, b.r * 1.3)) continue;
      const k = b.t / 0.42, e = 1 - (1 - k) ** 3;
      ctx.globalCompositeOperation = 'lighter';
      if (k < 0.25) drawGlow('#ffffff', b.x, b.y, b.r * (0.6 + 1.2 * k), 1 - k * 3);
      drawGlow('#ff8a2e', b.x, b.y, b.r * (0.5 + 0.9 * e), 0.9 * (1 - k));
      drawGlow('#ffd36a', b.x, b.y, b.r * (0.3 + 0.5 * e), 0.8 * (1 - k));
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

// =============================================================================
// 기본 무기 공통 (대포 / 프리즘 소드 / 흡혈귀의 손톱)
// 캐릭터의 공격력·공격 간격·사거리·각도를 물려받고 레벨업으로 3레벨까지 강화
// =============================================================================
class BasicWeapon extends Skill {
  constructor(ci) {
    super();
    const c = CHARS[ci];
    this.baseAtk = c.atk; this.baseInterval = c.atkSpd; this.baseRange = c.range; this.baseAngle = c.angle;
    this.timer = this.baseInterval;   // 시작하자마자 첫 공격
    this.swing = 1;                   // 휘두르는 방향 (공격마다 번갈아)
  }
  static mult(L) { return grow(2 / 3, 1.3, L); }   // 피해 배율: Lv1 = 원래의 2/3, Lv5 = 원래 Lv3(1.3배)의 125%
  get damage() { return Math.max(1, Math.round(this.baseAtk * this.atk * this.constructor.mult(this.L))); }
  get interval() { return Math.max(0.05, this.baseInterval * this.cd); }
  get angle() { return this.baseAngle + this.aoeLv * 5; }
  update(dt, g) {
    this.updateFx(dt, g);
    this.timer += dt;
    if (this.timer < this.interval || !g.player.hasTarget) return;
    this.timer = 0;
    this.fire(g);
    this.swing = -this.swing;
  }
  updateFx(dt, g) { }
  fire(g) { }
}

// ---- 대포 --------------------------------------------------------------------
class Cannon extends BasicWeapon {
  static SPEED = 11;
  static KB_MULT = 1.2;       // 넉백 전체 120%
  static KB = 20 * Cannon.KB_MULT;
  static BOOM_SIZE = 2.5 * 1.35;   // 끝 사거리 폭발 지름 = 포환 지름의 3.375배 (2.5배의 1.35배)
  static BOOM_DMG = 1.35;     // 폭발 피해 = 포환 피해의 1.35배
  static BOOM_KB = 30 * Cannon.KB_MULT;
  static SIZE_PER_LV = 0.06;  // 포환 크기: 레벨마다 +6% (Lv5 +24%)
  static RANGE_MULT = 5 / 6;  // 사거리 5/6 (폭발이 더 가까이에서)
  // 발사 충격파: 포구 앞 부채꼴 — 피해 = 포환의 1/4, 사거리 = 포환 사거리의 1/5, 각도 Lv1 110° + 레벨마다 5°
  static BLAST_DMG = 1 / 4; static BLAST_RANGE = 1 / 5; static BLAST_KB = 16 * Cannon.KB_MULT;
  // 피해 배율: (Lv1 8 → Lv5 22, 레벨마다 +3.5)의 140% → Lv1 11, Lv5 31
  static DMG_MULT = 1.4;
  static mult(L) { return (8 + 3.5 * (L - 1)) * Cannon.DMG_MULT / CHARS[0].atk; }
  constructor() { super(0); this.balls = []; this.booms = []; this.muzzles = []; }
  // 포환 지름 = 원래 부채꼴(사거리 380, 15°) 현 길이의 절반 ≈ 50px, 레벨·범위 버프로 커짐
  get radius() { return this.baseRange * Math.sin(rad(this.baseAngle / 2)) / 2 * (1 + 0.04 * this.aoeLv) * (1 + Cannon.SIZE_PER_LV * (this.L - 1)); }
  get maxDist() { return Math.round((this.baseRange + this.rangeBonus) * Cannon.RANGE_MULT); }
  get blastDmg() { return Math.max(1, Math.round(this.damage * Cannon.BLAST_DMG)); }
  get blastR() { return Math.round(this.maxDist * Cannon.BLAST_RANGE); }
  get blastAngle() { return 110 + 5 * (this.L - 1); }
  get boomDmg() { return Math.round(this.damage * Cannon.BOOM_DMG); }
  lines() { return [`포환 ${this.damage} · 사거리 ${this.maxDist}px · 끝 폭발 ${this.boomDmg}`, `발사 충격파 ${this.blastDmg} · ${this.blastR}px · ${this.blastAngle}°`, `포환 지름 ${(this.radius * 2).toFixed(0)}px · ${this.interval.toFixed(2)}초마다`]; }
  fire(g) {
    const p = g.player, a = rad(p.face);
    this.balls.push({ x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), r: this.radius, dmg: this.damage, boom: this.boomDmg, max: this.maxDist, trav: 0, hit: new Set() });
    // 발사 충격파: 화약이 터지며 포구 앞 부채꼴로 밀쳐냄
    const R = this.blastR, half = rad(this.blastAngle / 2), bd = this.blastDmg;
    for (const m of g.mons) {
      const d = dist(p.x, p.y, m.x, m.y);
      if (d > R + m.r) continue;
      if (d > m.r && Math.abs(angDiff(Math.atan2(m.y - p.y, m.x - p.x), a)) > half + Math.asin(Math.min(1, m.r / d))) continue;
      m.hp -= bd;
      g.knockback(m, p.x, p.y, Cannon.BLAST_KB, 0.12);
    }
    this.muzzles.push({ x: p.x, y: p.y, a, R, half, t: 0 });
    for (let k = 0; k < 14; k++) {   // 작은 불꽃이 부채꼴로 튐
      const aa = a + rand(-half, half) * 0.9;
      FX.spray(p.x + Math.cos(aa) * 18, p.y + Math.sin(aa) * 18, aa, 0.08, k % 3 ? '#ffb347' : '#fff2b0', 1, rand(260, 520), rand(0.12, 0.24), rand(1.6, 2.6));
    }
    FX.spray(p.x + Math.cos(a) * 22, p.y + Math.sin(a) * 22, a, 0.5, '#cfe0ff', 8, 320, 0.25, 2.4);
    FX.shake(0.07, 0.2); sfx('cannon'); p.recoil = 1;
  }
  updateFx(dt, g) {
    let j = 0;
    for (const b of this.balls) {
      const n = Math.min(Cannon.SPEED * dt * 60, b.max - b.trav);
      const ox = b.x, oy = b.y;
      b.x += b.dx * n; b.y += b.dy * n; b.trav += n;
      for (const m of g.mons) {
        if (b.hit.has(m)) continue;
        if (segDist(ox, oy, b.x, b.y, m.x, m.y) < b.r + m.r) {
          m.hp -= b.dmg; b.hit.add(m);
          g.knockback(m, m.x - b.dx * 10, m.y - b.dy * 10, Cannon.KB, 0.15);
          FX.spray(m.x, m.y, Math.atan2(b.dy, b.dx), 0.7, '#cfe0ff', 4, 260, 0.22, 2);
        }
      }
      if (Math.random() < dt * 40) FX.mote(b.x + rand(-b.r, b.r) * 0.5, b.y + rand(-b.r, b.r) * 0.5, '#9fb6ff', -b.dx * 40, -b.dy * 40, 0.3, b.r * 0.5);
      if (b.trav >= b.max - 1e-6) { this.explode(g, b); continue; }   // 끝 사거리: 폭발
      this.balls[j++] = b;
    }
    this.balls.length = j;
    for (const e of this.booms) e.t += dt;
    this.booms = this.booms.filter(e => e.t < 0.36);
    for (const e of this.muzzles) e.t += dt;
    this.muzzles = this.muzzles.filter(e => e.t < 0.16);
  }
  explode(g, b) {
    const R = b.r * Cannon.BOOM_SIZE;
    for (const m of g.mons) {
      if (dist(b.x, b.y, m.x, m.y) < R + m.r * 0.5) {
        m.hp -= b.boom;
        g.knockback(m, b.x, b.y, Cannon.BOOM_KB, 0.18);
      }
    }
    this.booms.push({ x: b.x, y: b.y, r: R, t: 0 });
    if (g.inView(b.x, b.y, R)) {
      FX.burst(b.x, b.y, '#cfe0ff', 18, 360, 0.4, 2.8); FX.burst(b.x, b.y, '#7f9cff', 12, 240, 0.5, 3);
      FX.ring(b.x, b.y, R * 0.25, R, 0.26, '#dfe8ff', 4); FX.ring(b.x, b.y, R * 0.5, R * 1.25, 0.36, '#7f9cff', 2);
      FX.shake(0.12, 0.3); sfx('boom');
    }
  }
  drawOver(g) {
    for (const b of this.balls) {
      if (!g.inView(b.x, b.y, b.r + 60)) continue;
      const r = b.r;
      glowLine([[b.x - b.dx * r * 2.6, b.y - b.dy * r * 2.6], [b.x - b.dx * r * 0.5, b.y - b.dy * r * 0.5]], '#7f9cff', r * 0.7, 0.35);
      drawGlow('#7f9cff', b.x, b.y, r * 2.0, 0.5);
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU);
      ctx.fillStyle = 'rgba(110,140,255,0.3)'; ctx.fill();
      ctx.strokeStyle = '#c4d4ff'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1;
      drawGlow('#e6eeff', b.x - r * 0.28, b.y - r * 0.28, r * 0.6, 0.6);
    }
    for (const e of this.muzzles) {   // 발사 충격파: 부채꼴로 퍼지는 화약 불빛
      const k = e.t / 0.16, r = e.R * (0.45 + 0.65 * (1 - (1 - k) ** 2));
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      gr.addColorStop(0, rgba('#fff2b0', 0.55 * (1 - k))); gr.addColorStop(0.6, rgba('#ff9a2e', 0.35 * (1 - k))); gr.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.arc(e.x, e.y, r, e.a - e.half, e.a + e.half); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba('#ffd36a', 0.7 * (1 - k)); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(e.x, e.y, r, e.a - e.half, e.a + e.half); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    for (const e of this.booms) {   // 끝 사거리 폭발: 푸른 섬광
      if (!g.inView(e.x, e.y, e.r * 1.3)) continue;
      const k = e.t / 0.36, q = 1 - (1 - k) ** 3;
      ctx.globalCompositeOperation = 'lighter';
      if (k < 0.3) drawGlow('#ffffff', e.x, e.y, e.r * (0.5 + q), 1 - k * 3);
      drawGlow('#7f9cff', e.x, e.y, e.r * (0.5 + 0.8 * q), 0.85 * (1 - k));
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

// ---- 프리즘 소드 --------------------------------------------------------------
/** 검기 두께 비율: 가운데가 가장 두껍고 양 끝으로 갈수록 얇아지는 초승달 모양 */
const qiShape = u => 0.35 + 0.65 * Math.sin(Math.PI * clamp(u, 0, 1));

class SwordQi {
  static TRAVEL = 0.22;
  static FADE = 0.10;
  constructor(ox, oy, a0, a1, thick, maxR, dmg, delay) {
    this.ox = ox; this.oy = oy; this.a0 = a0; this.a1 = a1; this.thick = thick; this.maxR = maxR; this.dmg = dmg;
    this.t = -delay; this.prevR = null; this.hit = new Set(); this.done = false;
  }
  front() {
    let p = clamp(this.t / SwordQi.TRAVEL, 0, 1);
    p = 1 - Math.pow(1 - p, 1.6);
    return this.thick + (this.maxR - this.thick) * p;
  }
  /** 검기(초승달) 안에 들어온 적 탄을 지운다 — 판정은 그려지는 모양 그대로 */
  cutBullets(g) {
    if (this.t < 0 || this.t > SwordQi.TRAVEL || !g.ebullets.length) return;
    const r = this.front(), span = this.a1 - this.a0;
    blockBullets(g, b => {
      const dx = b.x - this.ox, dy = b.y - this.oy, d = Math.hypot(dx, dy);
      if (d > r + b.r || d < r - this.thick - b.r) return false;
      const rel = mod(deg(Math.atan2(dy, dx)) - this.a0, 360);
      if (rel > span) return false;
      return d >= r - this.thick * qiShape(span ? rel / span : 0.5) - b.r;
    });
  }
  update(dt, mons) {
    this.t += dt;
    if (this.t < 0) return;
    if (this.t >= SwordQi.TRAVEL + SwordQi.FADE) { this.done = true; return; }
    if (this.t > SwordQi.TRAVEL + dt) return;   // 끝에 도착한 뒤 사라지는 동안에는 판정 없음
    const r = this.front(), rLo = this.prevR !== null ? this.prevR : this.thick;
    this.prevR = r;
    const span = this.a1 - this.a0;
    for (const m of mons) {
      if (this.hit.has(m)) continue;
      const dx = m.x - this.ox, dy = m.y - this.oy, d = Math.hypot(dx, dy);
      if (d > r + m.r || d < rLo - this.thick - m.r) continue;
      const a = deg(Math.atan2(dy, dx)), eps = deg(m.r / Math.max(d, m.r));
      let rel = mod(a - this.a0, 360);
      if (rel > 360 - eps) rel -= 360;
      if (rel < -eps || rel > span + eps) continue;
      const u = span ? rel / span : 0.5;
      if (d >= rLo - this.thick * qiShape(u) - m.r) { m.hp -= this.dmg; this.hit.add(m); }
    }
  }
  draw(g) {
    if (this.t < 0 || !g.inView(this.ox, this.oy, this.maxR + 20)) return;
    const fade = this.t <= SwordQi.TRAVEL ? 1 : Math.max(0, 1 - (this.t - SwordQi.TRAVEL) / SwordQi.FADE);
    const r = this.front(), n = 10, outer = [], inner = [];
    for (let i = 0; i <= n; i++) {
      const a = rad(this.a0 + (this.a1 - this.a0) * i / n);
      outer.push([this.ox + Math.cos(a) * r, this.oy + Math.sin(a) * r]);
    }
    for (let i = n; i >= 0; i--) {
      const u = i / n, rr2 = r - this.thick * qiShape(u), a = rad(this.a0 + (this.a1 - this.a0) * u);
      inner.push([this.ox + Math.cos(a) * rr2, this.oy + Math.sin(a) * rr2]);
    }
    poly(ctx, outer.concat(inner)); ctx.closePath();
    ctx.globalAlpha = 0.5 * fade; ctx.fillStyle = '#49cfff'; ctx.fill(); ctx.globalAlpha = 1;
    glowLine(outer, '#8fe9ff', 3, fade);
  }
}

class Sword extends BasicWeapon {
  static rangeMult(L) { return grow(0.8, 1.2, L); }
  static SWING = 0.16;
  static SWING_FADE = 0.08;
  constructor() { super(1); this.qis = []; this.swings = []; }
  get maxR() { return this.baseRange * Sword.rangeMult(this.L) + this.rangeBonus; }
  get count() { return Math.round(grow(4, 6, this.L)); }
  lines() { return [`검기 ${this.count}개 · 피해 ${this.damage}`, `범위 ${this.maxR.toFixed(0)}px · 각도 ${this.angle}°`, `${this.interval.toFixed(2)}초마다 · 적 탄 베어냄`]; }
  get thick() { return this.maxR / 5; }
  fire(g) {
    const p = g.player, n = this.count, ang = this.angle, lo = p.face - ang / 2;
    for (let k = 0; k < n; k++) {
      const i = this.swing > 0 ? k : n - 1 - k, a0 = lo + ang * i / n;
      this.qis.push(new SwordQi(p.x, p.y, a0, a0 + ang / n, this.thick, this.maxR, this.damage, Sword.SWING * (k + 0.5) / n));
    }
    const [as, ae] = this.swing > 0 ? [lo, lo + ang] : [lo + ang, lo];
    this.swings.push({ as, ae, len: this.maxR * 0.45, t: 0 });
    p.recoil = 1;
    sfx('slash');
  }
  updateFx(dt, g) {
    for (const q of this.qis) { q.update(dt, g.mons); q.cutBullets(g); }   // 검기가 지나간 자리의 적 탄을 베어낸다
    this.qis = this.qis.filter(q => !q.done);
    for (const s of this.swings) s.t += dt;
    this.swings = this.swings.filter(s => s.t < Sword.SWING + Sword.SWING_FADE);
  }
  drawOver(g) {
    for (const q of this.qis) q.draw(g);
    const p = g.player;
    for (const s of this.swings) {   // 휘두르는 칼날과 잔상
      let k = Math.min(1, s.t / Sword.SWING); k = 1 - (1 - k) * (1 - k);
      const cur = s.as + (s.ae - s.as) * k;
      const fade = s.t <= Sword.SWING ? 1 : Math.max(0, 1 - (s.t - Sword.SWING) / Sword.SWING_FADE);
      if (Math.abs(cur - s.as) > 1) {
        const fan = [[p.x, p.y]];
        for (let i = 0; i <= 12; i++) { const a = rad(s.as + (cur - s.as) * i / 12); fan.push([p.x + Math.cos(a) * s.len, p.y + Math.sin(a) * s.len]); }
        poly(ctx, fan); ctx.closePath(); ctx.globalAlpha = 0.2 * fade; ctx.fillStyle = '#6fe6ff'; ctx.fill(); ctx.globalAlpha = 1;
      }
      const a = rad(cur);
      glowLine([[p.x + Math.cos(a) * 18, p.y + Math.sin(a) * 18], [p.x + Math.cos(a) * s.len, p.y + Math.sin(a) * s.len]], '#6fe6ff', 5, fade);
    }
  }
}

// ---- 흡혈귀의 손톱 ------------------------------------------------------------
// 손톱 네 줄이 부채꼴을 한쪽에서 반대쪽으로 할퀴고 지나간다 (플레이어를 따라다님)
class ClawSwipe {
  static SWEEP = 0.10;
  static LIFE = 0.30;
  static FRACS = [0.2, 0.45, 0.7, 0.95];   // 4줄 — 사거리 145 기준 줄 간격 약 36px, 판정 띠가 서로 겹쳐 빈틈이 없다
  static OVERLAP = 0.5;   // 겹쳐 맞을 때 추가 줄의 피해 배율
  static HALF_T = 8;   // 줄 반두께 최솟값 — 사거리가 늘면 줄 사이가 벌어지지 않도록 같이 굵어진다
  constructor(face, angle, R, dmg, dir) {
    this.sgn = dir > 0 ? 1 : -1;
    this.aStart = face - this.sgn * angle / 2;
    this.span = angle; this.R = R; this.dmg = dmg; this.t = 0;
    this.ht = Math.max(ClawSwipe.HALF_T, 0.14 * R - 13);   // 판정 반두께 (그려지는 두께와 같음)
    this.hit = ClawSwipe.FRACS.map(() => new Set()); this.any = new Set(); this.done = false;
  }
  rAt(i, u) { return this.R * ClawSwipe.FRACS[i] * (0.9 + 0.2 * u); }
  update(dt, px, py, mons) {
    const prev = this.t;
    this.t += dt;
    if (this.t >= ClawSwipe.LIFE) { this.done = true; return; }
    if (prev > ClawSwipe.SWEEP) return;
    const reach = this.span * Math.min(1, this.t / ClawSwipe.SWEEP);
    for (const m of mons) {
      const dx = m.x - px, dy = m.y - py, d = Math.hypot(dx, dy);
      if (d > this.R * 1.1 + this.ht + m.r) continue;
      const a = deg(Math.atan2(dy, dx)), eps = deg(m.r / Math.max(d, m.r));
      let rel = mod((a - this.aStart) * this.sgn, 360);
      if (rel > 360 - eps) rel -= 360;
      if (rel < -eps || rel > reach + eps) continue;
      const u = clamp(rel / this.span, 0, 1);
      for (let i = 0; i < ClawSwipe.FRACS.length; i++) {
        if (this.hit[i].has(m)) continue;
        if (Math.abs(d - this.rAt(i, u)) <= this.ht + m.r) {
          // 같은 할퀴기에서 두 번째 줄부터는 절반 피해 (두 줄이 겹치면 1.5배)
          m.hp -= this.any.has(m) ? this.dmg * ClawSwipe.OVERLAP : this.dmg;
          this.hit[i].add(m); this.any.add(m);
        }
      }
    }
  }
  draw(p) {
    const prog = Math.min(1, this.t / ClawSwipe.SWEEP);
    const fade = this.t <= ClawSwipe.SWEEP ? 1 : Math.max(0, 1 - (this.t - ClawSwipe.SWEEP) / (ClawSwipe.LIFE - ClawSwipe.SWEEP));
    for (let i = 0; i < ClawSwipe.FRACS.length; i++) {
      const pts = [];
      for (let j = 0; j <= 20; j++) {
        const u = prog * j / 20, a = rad(this.aStart + this.sgn * this.span * u), r = this.rAt(i, u);
        pts.push([p.x + Math.cos(a) * r, p.y + Math.sin(a) * r]);
      }
      glowLine(pts, '#ff2a5c', this.ht * 0.8, fade);
    }
  }
}

class Claw extends BasicWeapon {
  static mult(L) { return grow(2 / 3, 1.5, L); }
  constructor() { super(2); this.swipes = []; }
  get reach() { return this.baseRange + this.rangeBonus; }
  lines() { return [`손톱 4줄 · 줄마다 피해 ${this.damage}`, `범위 ${this.reach}px · 각도 ${this.angle}°`, `${this.interval.toFixed(2)}초마다 할퀴기`]; }
  fire(g) {
    this.swipes.push(new ClawSwipe(g.player.face, this.angle, this.reach, this.damage, this.swing));
    g.player.recoil = 1;
    sfx('slash');
  }
  updateFx(dt, g) {
    for (const s of this.swipes) s.update(dt, g.player.x, g.player.y, g.mons);
    this.swipes = this.swipes.filter(s => !s.done);
  }
  drawOver(g) { for (const s of this.swipes) s.draw(g.player); }
}

// ---- 자석 구체 ----------------------------------------------------------------
// 플레이어 주위를 도는 구체. 닿은 적에게 0.15초마다 2 피해 + 바깥으로 넉백 18.75px
class Orb extends Skill {
  static SIZE = 24; static ORBIT = 155; static DMG = 2; static TICK = 0.15; static KB = 18.75;   // 크기는 원래 40의 60%, 넉백은 원래 25의 3/4
  constructor() { super(); this.phase = 0; this.cds = new Map(); }
  get count() { return this.L + 1; }   // 2 / 3 / 4 / 5 / 6개
  get radius() { return Orb.SIZE / 2 * this.area; }
  get orbit() { return Orb.ORBIT + this.rangeBonus; }
  get damage() { return Orb.DMG * this.atk; }
  get tick() { return Orb.TICK * this.cd; }
  get revTime() { return 1.25 * this.cd; }   // 회전 속도는 원래의 80%
  lines() { return [`구체 ${this.count}개 · ${this.revTime.toFixed(2)}초에 1바퀴`, `닿으면 ${this.tick.toFixed(2)}초마다 ${n1(this.damage)} 피해`, '넉백 + 적 탄 막기']; }
  positions(p) {
    const n = this.count, o = this.orbit;
    return Array.from({ length: n }, (_, i) => [p.x + Math.cos(this.phase + TAU * i / n) * o, p.y + Math.sin(this.phase + TAU * i / n) * o]);
  }
  update(dt, g) {
    this.phase = (this.phase + TAU / this.revTime * dt) % TAU;
    for (const [m, t] of this.cds) { if (t - dt <= 0) this.cds.delete(m); else this.cds.set(m, t - dt); }
    const p = g.player, pos = this.positions(p), R = this.radius, orb = this.orbit;
    for (const m of g.mons) {
      if (this.cds.has(m)) continue;
      if (Math.abs(dist(p.x, p.y, m.x, m.y) - orb) > R + m.r) continue;
      const lim = (R + m.r) * (R + m.r);
      for (const [ox, oy] of pos) {
        if ((m.x - ox) ** 2 + (m.y - oy) ** 2 < lim) {
          m.hp -= this.damage; this.cds.set(m, this.tick);
          g.knockback(m, ox, oy, Orb.KB, 0.15);
          FX.burst(m.x, m.y, '#b9a8ff', 2, 150, 0.2, 1.8);
          break;
        }
      }
    }
    if (g.ebullets.length) blockBullets(g, b => pos.some(([ox, oy]) => (b.x - ox) ** 2 + (b.y - oy) ** 2 < (R + b.r) ** 2));
  }
  drawOver(g) {
    const p = g.player, R = this.radius, n = this.count, o = this.orbit;
    for (let i = 0; i < n; i++) {
      const a = this.phase + TAU * i / n, x = p.x + Math.cos(a) * o, y = p.y + Math.sin(a) * o;
      // 지나온 궤적 (꼬리)
      ctx.beginPath(); ctx.arc(p.x, p.y, o, a - 0.42, a);
      ctx.strokeStyle = '#7d66ff'; ctx.lineWidth = R * 0.9; ctx.lineCap = 'round'; ctx.globalAlpha = 0.22; ctx.stroke(); ctx.globalAlpha = 1;
      drawGlow('#7d66ff', x, y, R * 2.0, 0.55);
      ctx.beginPath(); ctx.arc(x, y, R, 0, TAU);
      ctx.fillStyle = 'rgba(90,70,230,0.35)'; ctx.fill();
      ctx.strokeStyle = '#b9a8ff'; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1;
      drawGlow('#e4dcff', x - R * 0.3, y - R * 0.3, R * 0.55, 0.6);
    }
  }
}

// ---- 지뢰 (+ 융합: 에너지 필드) ------------------------------------------------
class Mine extends Skill {
  static INTERVAL = 2.0; static LIFE = 6.0; static DMGS = [15, 20, 25]; static TRIG_R = 11; static PLACE = [120, 260];
  static FIELD_DUR = 3.0;
  constructor() { super(); this.t = Mine.INTERVAL - 1.0; this.mines = []; this.zones = []; }   // 첫 지뢰는 1초 뒤
  get field() { return false; }
  get radius() { return Math.floor((this.field ? 110 * FUSION_MULT : grow(50, 110, this.L)) * this.area); }
  get damage() { return (this.field ? 25 * FUSION_MULT : grow(15, 25, this.L)) * this.atk; }
  get zoneR() { return Math.floor(Shield.RADII[2] * FUSION_MULT * this.area); }
  get zoneDmg() { return 5 * FUSION_MULT; }
  lines() {
    if (this.field) return [`지뢰 폭발 ${n1(this.damage)} · ${this.radius}px`, `터진 자리에 장판 ${this.zoneR}px`, `0.16초마다 ${n1(this.zoneDmg)} · 3초`];
    return [`${this.interval.toFixed(1)}초마다 매설 · 폭발 ${n1(this.damage)}`, `범위 ${this.radius}px · 넉백`, '1초간 이동속도 -1'];
  }
  get interval() { return Mine.INTERVAL * this.cd; }
  explode(x, y, g) {
    const R = this.radius;
    for (const m of g.mons) {
      const d = dist(x, y, m.x, m.y);
      if (d < R + m.r) {
        m.hp -= this.damage; m.wslow = 1.0;   // 1초간 이동속도 -1
        g.knockback(m, x, y, Math.max(8, R - d + m.r), 0.25);
      }
    }
    FX.burst(x, y, '#ffb05a', 16, 330, 0.4, 2.6); FX.burst(x, y, '#ffffff', 5, 200, 0.2, 2);
    FX.ring(x, y, R * 0.3, R, 0.3, '#ff8a4a', 4);
    if (g.inView(x, y, R)) { FX.shake(0.14, 0.3); sfx('boom'); }
    if (this.field) this.zones.push({ x, y, r: this.zoneR, dmg: this.zoneDmg, tick: Shield.INTERVAL * this.cd, t: 0, age: 0 });
  }
  update(dt, g) {
    const p = g.player;
    this.t += dt;
    if (this.t >= this.interval) {
      this.t = 0;
      const a = rand(0, TAU), d = rand(Mine.PLACE[0], Mine.PLACE[1] + this.rangeBonus);
      this.mines.push({ x: Arena.cx(p.x + Math.cos(a) * d, 20), y: Arena.cy(p.y + Math.sin(a) * d, 20), age: 0 });
    }
    let j = 0;
    for (const mine of this.mines) {
      mine.age += dt;
      let boom = mine.age >= Mine.LIFE;
      if (!boom) for (const m of g.mons) {
        if (Math.abs(m.x - mine.x) < 60 && Math.abs(m.y - mine.y) < 60 && dist(mine.x, mine.y, m.x, m.y) < m.r + Mine.TRIG_R) { boom = true; break; }
      }
      if (boom) this.explode(mine.x, mine.y, g); else this.mines[j++] = mine;
    }
    this.mines.length = j;
    j = 0;
    for (const z of this.zones) {
      z.age += dt; z.t += dt;
      if (z.t >= z.tick) { z.t -= z.tick; for (const m of g.mons) if (!m.fly && dist(z.x, z.y, m.x, m.y) < z.r) m.hp -= z.dmg; }
      if (z.age < Mine.FIELD_DUR) this.zones[j++] = z;
    }
    this.zones.length = j;
  }
  drawUnder(g) {
    for (const z of this.zones) {
      if (!g.inView(z.x, z.y, z.r)) continue;
      const fade = z.age < Mine.FIELD_DUR - 0.5 ? 1 : Math.max(0, (Mine.FIELD_DUR - z.age) / 0.5);
      drawZone('#6ebeff', z.x, z.y, z.r, (0.6 + 0.25 * Math.sin(z.age * 9)) * fade);
    }
    for (const mine of this.mines) {
      if (!g.inView(mine.x, mine.y, 30)) continue;
      const rate = mine.age < Mine.LIFE - 2 ? 2 : 7;   // 터지기 직전에는 빠르게 깜빡임
      const on = Math.floor((FX.time + mine.age) * rate) % 2 === 0;
      glowRing(mine.x, mine.y, 10, '#8f9bb8', 2, 0.9);
      drawGlow('#ff4a3a', mine.x, mine.y, on ? 16 : 7, on ? 1 : 0.6);
      if (on) glowRing(mine.x, mine.y, 15, '#ff4a3a', 1, 0.5);
    }
  }
}
class EnergyField extends Mine {

// ---- 융합: 경계선 (자석 구체 + 방어막) ------------------------------------------
class Boundary extends Skill {
  static FUSION = true;
  static ARCS = 8; static THICK = 6; static ARC_LEN = 60; static KB = 25 * 5 / 6;   // 넉백 ≈ 20.8px
  constructor() { super(); this.phase = 0; this.cds = new Map(); }
  get radius() { return Shield.RADII[2] * FUSION_MULT * 0.9 * this.area; }   // 범위는 10% 줄임
  static DMG_MULT = 0.7;   // 너프: 피해 -30%
  get damage() { return Orb.DMG * FUSION_MULT * this.atk * Boundary.DMG_MULT; }
  get tick() { return Orb.TICK / FUSION_MULT; }        // 이미 빨라서 공격 속도 증가 영향을 받지 않음
  get revTime() { return 0.5 / FUSION_MULT; }
  lines() { return [`반지름 ${this.radius.toFixed(0)}px · ${this.revTime.toFixed(2)}초에 1바퀴`, `선에 닿으면 ${n1(this.damage)} 피해 + 넉백`, '안쪽 적 이속 -1 · 적 탄 막기']; }
  get arcSpan() { return deg(Boundary.ARC_LEN / this.radius); }
  centers() { const b = deg(this.phase); return Array.from({ length: Boundary.ARCS }, (_, i) => b + 360 * i / Boundary.ARCS); }
  update(dt, g) {
    const dPh = TAU / this.revTime * dt;
    this.phase = (this.phase + dPh) % TAU;
    this.sweep = deg(dPh);   // 이번 프레임에 선이 쓸고 지나간 각도 (탄이 선 사이로 빠지지 않게)
    for (const [m, t] of this.cds) { if (t - dt <= 0) this.cds.delete(m); else this.cds.set(m, t - dt); }
    const p = g.player, R = this.radius, half = this.arcSpan / 2, cs = this.centers();
    for (const m of g.mons) {
      const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
      if (d < R) m.zslow = 0.1;   // 원 안쪽: 이동속도 -1
      if (Math.abs(d - R) > Boundary.THICK / 2 + m.r) continue;
      if (this.cds.has(m)) continue;
      const a = deg(Math.atan2(dy, dx)), eps = deg(m.r / Math.max(d, m.r));
      if (cs.some(c => adiff(a, c) <= half + eps)) {
        const res = m.bdRes || (m.tier > 0 ? 0.5 : 1);   // 탱커 1/3, 보스·중간보스 절반
        m.hp -= this.damage * res; this.cds.set(m, this.tick);
        g.knockback(m, p.x, p.y, Boundary.KB * (m.bdRes || 1), 0.15);
        FX.burst(m.x, m.y, '#d9c8ff', 2, 150, 0.2, 1.8);
      }
    }
    if (g.ebullets.length) blockBullets(g, b => {   // 도는 선 부분에 닿은 적 탄만 막는다
      const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
      if (Math.abs(d - R) > Boundary.THICK / 2 + b.r) return false;
      const a = deg(Math.atan2(dy, dx)), eps = deg(b.r / Math.max(d, b.r));
      const sw = this.sweep / 2;
      return cs.some(c => adiff(a, c - sw) <= half + sw + eps);
    });
  }
  drawUnder(g) { drawZone('#b996ff', g.player.x, g.player.y, this.radius, 0.35); }
  drawOver(g) {
    const p = g.player, R = this.radius, half = rad(this.arcSpan / 2);
    for (const c of this.centers()) {
      const a = rad(c), pts = [];
      for (let j = 0; j <= 6; j++) { const t = a - half + 2 * half * j / 6; pts.push([p.x + Math.cos(t) * R, p.y + Math.sin(t) * R]); }
      glowLine(pts, '#b996ff', Boundary.THICK);
    }
  }
}

// ---- 융합: 메테오 (미사일 + 수류탄) --------------------------------------------
class Meteor extends Skill {
  static FUSION = true;
  static RATE = 4.0 * 0.8; static DURATION = 3.0 * 0.75; static FALL = 0.5;   // 빈도 4/5, 장판 지속 3/4
  constructor() { super(); this.t = 0; this.drops = []; this.patches = []; }
  get interval() { return this.cd / (Meteor.RATE * FUSION_MULT); }
  get radius() { return Math.floor(110 * FUSION_MULT * this.area); }
  get blast() { return 7 * FUSION_MULT; }
  get dot() { return 3 * FUSION_MULT; }
  lines() { return [`초당 ${n1(1 / this.interval)}개 수류탄 낙하`, `폭발 ${n1(this.blast)} · 장판 0.3초당 ${n1(this.dot)}`, `범위 ${this.radius}px · 3초 유지`]; }
  update(dt, g) {
    this.t += dt;
    while (this.t >= this.interval) {
      this.t -= this.interval;
      this.drops.push({ x: rand(g.cam.x, g.cam.x + VW), y: rand(g.cam.y, g.cam.y + VH), r: this.radius, t: 0 });
    }
    let j = 0;
    for (const d of this.drops) {
      d.t += dt;
      if (d.t >= Meteor.FALL) {
        this.patches.push(new Patch(d.x, d.y, d.r, this.blast, this.dot, Meteor.DURATION, '#ff7a3a'));
        FX.burst(d.x, d.y, '#ffb05a', 14, 380, 0.45, 2.8); FX.burst(d.x, d.y, '#ffffff', 4, 220, 0.2, 2);
        FX.ring(d.x, d.y, d.r * 0.2, d.r * 1.05, 0.32, '#ff8a4a', 4);
        FX.shake(0.07, 0.22); sfx('boom');
        continue;
      }
      this.drops[j++] = d;
    }
    this.drops.length = j;
    for (const pt of this.patches) pt.update(dt, g.mons);
    this.patches = this.patches.filter(pt => !pt.done);
  }
  drawUnder(g) {
    for (const pt of this.patches) pt.draw(g);
    for (const d of this.drops) {
      if (!g.inView(d.x, d.y, d.r)) continue;
      const k = Math.min(1, d.t / Meteor.FALL);
      drawZone('#ff7a3a', d.x, d.y, d.r * (0.3 + 0.7 * k), 0.25 + 0.4 * k);
    }
  }
  drawOver(g) {
    for (const d of this.drops) {
      if (!g.inView(d.x, d.y, 320)) continue;
      const h = (1 - Math.min(1, d.t / Meteor.FALL)) * 300, bx = d.x + h * 0.35, by = d.y - h;
      glowLine([[bx + 32, by - 90], [bx, by]], '#ff9a3a', 7, 0.8);
      drawGlow('#ffb05a', bx, by, 26);
      drawGlow('#ffffff', bx, by, 10);
    }
  }
}

// 친구 게임에서 가져온 무기 (수치는 내 게임 기준으로 맞춤)
// =============================================================================
/** 직선 탄 공통: 적을 관통(pierce)하며 지나간 경로에 닿은 적마다 한 번 피해 */
class Gun extends Skill {
  constructor() { super(); this.t = 0; this.shots = []; }
  shoot(g, x, y, ang, o) {
    this.shots.push({ x, y, dx: Math.cos(ang), dy: Math.sin(ang), trav: 0, hit: new Set(), ...o });
  }
  moveShots(dt, g) {
    let j = 0;
    for (const b of this.shots) {
      const step = Math.min(b.spd * dt * 60, b.max - b.trav), ox = b.x, oy = b.y;
      b.x += b.dx * step; b.y += b.dy * step; b.trav += step;
      let alive = true;
      for (const m of g.mons) {
        if (b.hit.has(m) || segDist(ox, oy, b.x, b.y, m.x, m.y) >= m.r + b.r) continue;
        b.hit.add(m); m.hp -= b.dmg;
        g.knockback(m, m.x - b.dx * 10, m.y - b.dy * 10, b.kb, 0.12);
        FX.spray(m.x, m.y, Math.atan2(b.dy, b.dx), 0.8, b.col, 3, 220, 0.2, 1.8);
        if (--b.pierce <= 0) { alive = false; break; }
      }
      if (alive && b.trav < b.max - 1e-6) this.shots[j++] = b;
    }
    this.shots.length = j;
  }
  drawOver(g) {
    for (const b of this.shots) {
      if (!g.inView(b.x, b.y, 40)) continue;
      glowLine([[b.x - b.dx * b.len, b.y - b.dy * b.len], [b.x, b.y]], b.col, b.r * 0.9);
    }
  }
}

// ---- 플라즈마 소총: 관통하는 고출력 탄 ----
class Plasma extends Gun {

  get count() { return [1, 1, 2, 2, 3][this.L - 1]; }

  update(dt, g) {
    this.t += dt;

      const tg = g.nearest(p.x, p.y, this.range);
