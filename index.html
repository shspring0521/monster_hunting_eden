  const c = g.cam, p = g.player;
  let shx = 0, shy = 0;
  if (SET.shake && FX.trauma > 0) { const s = FX.trauma * FX.trauma; shx = (Math.random() * 2 - 1) * 18 * s; shy = (Math.random() * 2 - 1) * 18 * s; }
  g.shakeOff = [shx, shy];
  ctx.save();
  ctx.translate(-c.x + shx, -c.y + shy);
  const vx = c.x - shx, vy = c.y - shy;

  // ── 배경: 격자 + 큰 색 얼룩 + 맵 경계선 ──
  ctx.fillStyle = bgPattern(); ctx.fillRect(vx - 2, vy - 2, VW + 4, VH + 4);
  ctx.globalCompositeOperation = 'lighter';
  for (const b of g.blobs) if (g.inView(b.x, b.y, b.r)) drawGlow(b.col, b.x, b.y, b.r, 0.16);
  glowLine([[0, 0], [MAP_W, 0], [MAP_W, MAP_H], [0, MAP_H]], '#ff4d6a', 4, 0.9, true);

  // ── [빛] 바닥에 깔리는 것 ──
  drawMyFx(() => { p.runes.drawUnder(g); for (const sk of p.skills.values()) sk.drawUnder(g); });
  for (const [x, y, age] of g.bossFire) {
    if (!g.inView(x, y, 20)) continue;
    const remain = BOSS.FIRE_LIFE - age, k = remain > 0.6 ? 1 : Math.max(0.2, remain / 0.6);
    const fl = 1 + 0.25 * Math.sin(FX.time * 14 + x * 0.3 + y * 0.2);
    drawGlow('#2a78ff', x, y - 2, 20 * k * fl, 0.9); drawGlow('#bfe6ff', x, y, 8 * k * fl, 0.9);
  }
  for (const r of g.rocks) r.drawTelegraph(g);
  drawMonsUnder(g);
  for (const ch of g.chests) if (g.inView(ch.x, ch.y, 80)) drawZone(C.gold, ch.x, ch.y + 8, 40, 0.45 + 0.25 * Math.sin(ch.age * 4));

  // ── 본체 ──
  ctx.globalCompositeOperation = 'source-over';
  for (const o of g.orbs) {
    if (!g.inView(o.x, o.y, 12)) continue;
    drawSpr(orbSpr(o.v < 30 ? 0 : o.v < 100 ? 1 : 2), o.x, o.y + Math.sin(FX.time * 4 + o.ph) * 2);
  }
  for (const r of g.rocks) r.drawGround(g);
  for (const ch of g.chests) if (g.inView(ch.x, ch.y, 60)) drawSpr(chestSpr(), ch.x, ch.y + 4 + Math.sin(ch.age * 3) * 3);
  drawMons(g);
  if (!g.over) drawPlayer(g);
  for (const it of g.drops) {
    if (!g.inView(it.x, it.y, 30)) continue;
    drawSpr(dropSpr(it.kind), it.x, it.y, 0, 1 + 0.08 * Math.sin(it.age * 5));
  }

  // ── 전투 구역 밖은 어둡게 + 맥동하는 경계선 ──
  if (Arena.limited()) {
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(vx - 40, vy - 40, VW + 80, Arena.y0 - vy + 40);
    ctx.fillRect(vx - 40, Arena.y1, VW + 80, vy + VH + 40 - Arena.y1);
    ctx.fillRect(vx - 40, Arena.y0, Arena.x0 - vx + 40, Arena.y1 - Arena.y0);
    ctx.fillRect(Arena.x1, Arena.y0, vx + VW + 40 - Arena.x1, Arena.y1 - Arena.y0);
  }

  // ── [빛] 위에 얹히는 것 ──
  ctx.globalCompositeOperation = 'lighter';
  if (Arena.limited()) glowLine([[Arena.x0, Arena.y0], [Arena.x1, Arena.y0], [Arena.x1, Arena.y1], [Arena.x0, Arena.y1]], '#ff466a', 5, 0.7 + 0.3 * Math.sin(FX.time * 4), true);
  for (const it of g.drops) if (g.inView(it.x, it.y, 30)) glowRing(it.x, it.y, 15 + 4 * (0.5 + 0.5 * Math.sin(it.age * 5)), dropCol(it.kind), 2, 0.8);
  drawMyFx(() => { for (const sk of p.skills.values()) sk.drawOver(g); p.runes.drawOver(g); FX.draw(vx, vy); });
  for (const s of g.slashes) s.draw();
  const beam = beamSpr();
  for (const ch of g.chests) {
    if (!g.inView(ch.x, ch.y, 40)) continue;
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(ch.age * 3);
    ctx.drawImage(beam, ch.x - 34, ch.y - VH * 0.9, 68, VH * 0.9);
    ctx.globalAlpha = 1;
  }

  // ── 날아가는 바위 / 데미지 숫자 ──
  ctx.globalCompositeOperation = 'source-over';
  for (const r of g.rocks) r.drawAir(g);
  drawRescueWorld(g);
  drawOverheadBars(g);
  drawPopups(g);
  ctx.restore();
}

/** 에덴 구출: 폭격 예고 표식 · 떨어지는 포탄 · 마지막 대폭격 예고 · 구출 광선 */
function drawRescueWorld(g) {
  const r = g.rescue;
  if (!r) return;
  const R = Game.RESCUE, p = g.player, t = r.t;
  ctx.globalCompositeOperation = 'lighter';
  for (const s of r.strikes) {
    if (s.hit || t < s.at - R.WARN) continue;
    const k = (t - (s.at - R.WARN)) / R.WARN;
    drawZone('#ff4d6a', s.x, s.y, s.r * (1.25 - 0.25 * k), 0.25 + 0.5 * k);
    drawReticle(s.x, s.y, s.r * 0.62, k * 1.8, '#ff4d6a', 0.4 + 0.6 * k, 3);
    if (k > 0.55) {   // 하늘에서 내리꽂히는 포탄
      const u = (k - 0.55) / 0.45, sy = s.y - VH * (1 - u);
      glowLine([[s.x + 40 * (1 - u), sy - 90], [s.x, sy]], '#fff2b0', 5, 0.9);
      drawGlow('#ffb347', s.x, sy, 26, 0.9);
    }
  }
  if (!r.final && t > R.FINAL - 0.9) {   // 마지막 대폭격 예고: 화면 가장자리에서 좁혀오는 고리
    const k = clamp((t - (R.FINAL - 0.9)) / 0.9, 0, 1);
    glowRing(p.x, p.y, 760 - 640 * k, '#ff4d6a', 5, 0.3 + 0.7 * k);
  }
  if (t >= R.BEAM) {   // 구출 광선
    const a = clamp((t - R.BEAM) / 0.35, 0, 1) * (r.gone ? clamp(1 - (t - R.LIFT - R.LIFT_DUR) / 0.6, 0, 1) : 1);
    if (a > 0) {
      const w = 70 + 20 * Math.sin(t * 9);
      ctx.globalAlpha = a * 0.7; ctx.drawImage(beamSpr(), p.x - w, p.y - VH * 1.2, w * 2, VH * 1.2 + 24); ctx.globalAlpha = 1;
      drawZone('#7dffb0', p.x, p.y, 54, a * 0.45);
      for (let i = 0; i < 3; i++) {   // 위로 올라가는 고리
        const u = (t * 0.9 + i / 3) % 1;
        glowRing(p.x, p.y - u * 160, 34 * (1 - u * 0.5), '#7dffb0', 2.5, a * (1 - u));
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPlayer(g) {
  const p = g.player;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < g.trail.length - 1; i++) {   // 움직인 자리의 잔상
    const [x, y] = g.trail[i];
    drawGlow(C.player, x, y, 10 + i * 1.2, 0.05 + i * 0.03);
  }
  if (p.buffLv('magnet_up') > 0) glowRing(p.x, p.y, p.pickupR, '#3a8bff', 1, 0.22);   // 자석 범위
  ctx.globalCompositeOperation = 'source-over';
  const blink = p.invulnT > 0 && Math.floor(p.invulnT * 30) % 2 === 0;   // 피격 무적 중 깜빡임
  const rs = g.rescue, lift = rs ? rs.lift * rs.lift : 0;   // 구출: 광선을 타고 떠오름
  if (rs && rs.gone) return;
  ctx.globalAlpha = rs ? 1 - lift * 0.85 : blink ? 0.35 : 1;
  drawHunter(p, p.x, p.y - lift * 80, 21, rad(p.face), rs ? false : p.moving, FX.time, p.basicId, p.recoil);
  ctx.globalAlpha = 1;
  if (p.hasTarget) {   // 조준 방향 화살표
    const a = rad(p.face), r0 = p.r + 7;
    poly(ctx, [[p.x + Math.cos(a) * (r0 + 13), p.y + Math.sin(a) * (r0 + 13)], [p.x + Math.cos(a + 0.42) * r0, p.y + Math.sin(a + 0.42) * r0], [p.x + Math.cos(a - 0.42) * r0, p.y + Math.sin(a - 0.42) * r0]]);
    ctx.closePath(); ctx.fillStyle = g.autoAim ? '#ffe98c' : '#ffffff'; ctx.fill();
  }
}

/**
 * 인간형 사냥꾼 (친구 게임 캐릭터를 바탕으로) — 그림자, 걷는 다리, 갑옷, 헬멧 바이저(조준 방향을 봄),
 * 손에 든 기본 무기(대포 / 프리즘 소드 / 흡혈귀의 손톱)
 */
function drawHunter(p, cx, cy, r, aim, moving, t, weapon, recoil) {
  const bob = moving ? Math.sin(t * 22) * 2.5 : Math.sin(t * 4.5) * 1.2;
  const leg = moving ? Math.sin(t * 24) * r * 0.48 : 0;
  const facing = Math.cos(aim) >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.85, r * 0.32, 0, 0, TAU); ctx.fill();
  // 다리
  ctx.lineCap = 'round'; ctx.lineWidth = Math.max(4, r * 0.28); ctx.strokeStyle = '#1b2a6b';
  ctx.beginPath(); ctx.moveTo(-r * 0.28, r * 0.35); ctx.lineTo(-r * 0.32 - leg * 0.42, r * 0.88 + (leg > 0 ? -2 : 0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r * 0.28, r * 0.35); ctx.lineTo(r * 0.32 + leg * 0.42, r * 0.88 + (leg < 0 ? -2 : 0)); ctx.stroke();
  ctx.fillStyle = '#3fd8ff';
  ctx.beginPath(); ctx.arc(-r * 0.32 - leg * 0.42, r * 0.9, r * 0.15, 0, TAU); ctx.arc(r * 0.32 + leg * 0.42, r * 0.9, r * 0.15, 0, TAU); ctx.fill();
  ctx.translate(0, bob);
  // 망토 (사냥꾼 느낌) — 조준 반대쪽으로 살짝 날림
  ctx.fillStyle = '#16204a';
  ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.1); ctx.quadraticCurveTo(-facing * r * 0.9, r * 0.6, -facing * r * 0.35, r * 0.75 + leg * 0.1);
  ctx.lineTo(r * 0.45 * -facing + facing * r * 0.9, r * 0.7); ctx.quadraticCurveTo(r * 0.6, r * 0.2, r * 0.55, -r * 0.1); ctx.closePath(); ctx.fill();
  // 상체 갑옷
  const tg = ctx.createRadialGradient(-r * 0.2, -r * 0.1, 2, 0, 0, r * 0.85);
  tg.addColorStop(0, '#5fe1ff'); tg.addColorStop(0.6, '#1a9ccc'); tg.addColorStop(1, '#1b2a6b');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.62, r * 0.55, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#d8fbff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#5fe1ff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(facing * r * 0.15, r * 0.15, r * 0.15, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  // 헬멧 + 바이저
  const hy = -r * 0.45, hr = r * 0.52;
  const hg = ctx.createRadialGradient(-hr * 0.3, hy - hr * 0.3, 2, 0, hy, hr);
  hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.7, '#c4d2e6'); hg.addColorStop(1, '#4e5d78');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, hy, hr, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#1c2638'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#5fffd8'; ctx.shadowColor = '#5fffd8'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.ellipse(Math.cos(aim) * hr * 0.35, hy + Math.sin(aim) * hr * 0.25, hr * 0.55, hr * 0.24, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  // 손에 든 무기
  ctx.translate(0, r * 0.12); ctx.rotate(aim);
  const kick = recoil * 5;
  if (weapon === 'cannon') {
    ctx.fillStyle = '#262e3e'; rr(ctx, r * 0.1 - kick, -5.5, r * 1.35, 11, 3); ctx.fill();
    ctx.fillStyle = '#9fb6ff'; ctx.fillRect(r * 0.35 - kick, -2, r * 0.95, 4);
    ctx.shadowColor = '#9fb6ff'; ctx.shadowBlur = 12 + recoil * 20; ctx.fillStyle = '#e6eeff';
    ctx.beginPath(); ctx.arc(r * 1.45 - kick, 0, 4 + recoil * 3, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  } else if (weapon === 'sword') {
    ctx.fillStyle = '#d6dbe6'; ctx.fillRect(r * 0.2, -3, r * 0.45, 6);
    ctx.rotate((recoil - 0.5) * 1.4 * (recoil > 0 ? 1 : 0));
    ctx.shadowColor = '#6fe6ff'; ctx.shadowBlur = 14;
    const bg = ctx.createLinearGradient(r * 0.65, 0, r * 2.5, 0);
    bg.addColorStop(0, '#ff9af0'); bg.addColorStop(0.5, '#9af6ff'); bg.addColorStop(1, '#fff6a0');   // 프리즘 빛
    ctx.fillStyle = bg; ctx.fillRect(r * 0.65, -2.5, r * 1.85, 5);
    ctx.strokeStyle = '#6fe6ff'; ctx.lineWidth = 1.5; ctx.strokeRect(r * 0.65, -3, r * 1.85, 6);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#3a1020'; rr(ctx, r * 0.25, -5, r * 0.55, 10, 3); ctx.fill();
    ctx.strokeStyle = '#ff4d78'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.shadowColor = '#ff2a5c'; ctx.shadowBlur = 10;
    const reach = r * (0.75 + recoil * 0.35);
    for (const k of [-4, 0, 4]) { ctx.beginPath(); ctx.moveTo(r * 0.75, k); ctx.quadraticCurveTo(r * 0.75 + reach * 0.6, k * 1.3, r * 0.75 + reach, k * 0.6 + 3); ctx.stroke(); }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/** 머리 위 체력바 + 숫자 (플레이어 / 보스) — 몬스터 체력바와 같은 모양에 크기만 키움 */
function overheadBar(x, y, w, h, hp, maxHp, col, size) {
  const r = clamp(hp / maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(x - w / 2 - 1.5, y - 1.5, w + 3, h + 3);
  ctx.fillStyle = 'rgba(90,20,30,0.85)'; ctx.fillRect(x - w / 2, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * r, h);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x - w / 2, y, w * r, Math.max(1, h * 0.35));
  const s = `${Math.max(0, Math.ceil(hp))} / ${maxHp}`;
  ctx.font = font(size, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(5,8,18,0.9)'; ctx.lineWidth = 3; ctx.strokeText(s, x, y - 3);
  ctx.fillStyle = '#fff'; ctx.fillText(s, x, y - 3);
}
function drawOverheadBars(g) {
  for (const m of g.mons) {   // 현상수배 표적: 천천히 도는 조준 꺾쇠 + 머리 위 '현상수배' 꼬리표
    if (!m.hunt || m.intro > 0 || !g.inView(m.x, m.y, m.r + 60)) continue;
    const pulse = 0.5 + 0.5 * Math.sin(FX.time * 4 + m.x * 0.01);
    drawReticle(m.x, m.y, m.r + 14 + 3 * pulse, FX.time * 0.6, HUNT_RED, 0.55 + 0.3 * pulse, 2.5);
    const ty = m.y - m.r - (m.tier === 2 ? 50 : 32), label = '현상수배';
    const w = textW(ctx, label, 11, 800) + 16;
    rr(ctx, m.x - w / 2, ty - 9, w, 18, 9); ctx.fillStyle = 'rgba(150,10,30,0.9)'; ctx.fill();
    ctx.strokeStyle = rgba(HUNT_RED, 0.6 + 0.4 * pulse); ctx.lineWidth = 1.5; ctx.stroke();
    txt(ctx, label, m.x, ty + 1, 11, '#ffe3e8', 'center', 800);
  }
  for (const m of g.mons) {
    if (m.kind !== 'boss' || !g.inView(m.x, m.y, m.r + 40)) continue;
    overheadBar(m.x, m.y - m.r - 22, 110, 8, m.hp, m.maxHp, C.boss, 13);
  }
  if (g.over || g.rescue) return;
  const p = g.player, low = p.hp / p.maxHp < 0.3;
  overheadBar(p.x, p.y - p.r - 18, 46, 5, p.hp, p.maxHp, low ? C.hpLow : C.hp, 11);
}

/** '-숫자' 데미지 표시: 톡 튀어오름 → 살짝 내려앉음 → 천천히 떠오르며 사라짐 */
function drawPopups(g) {
  const SIZE = [10, 12, 16, 21], POP = 0.12;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const d of g.popups) {
    const t = d.age, pp = d.pop;
    let off;
    if (t < POP) off = pp * Math.sin(t / POP * Math.PI / 2);
    else if (t < POP * 2) off = pp - 0.4 * pp * ((t - POP) / POP);
    else off = 0.6 * pp + 0.8 * pp * Math.min(1, (t - POP * 2) / Math.max(0.01, d.dur - POP * 2));
    ctx.globalAlpha = t < d.fade ? 1 : Math.max(0, 1 - (t - d.fade) / Math.max(0.01, d.dur - d.fade));
    ctx.font = font(SIZE[d.tier], 800);
    if (d.big) ctx.font = font(22, 900);
    const s = d.text || (d.heal ? '+' : '-') + d.amt;
    ctx.strokeStyle = 'rgba(5,8,18,0.85)'; ctx.lineWidth = d.tier >= 2 ? 4 : 3;
    ctx.strokeText(s, d.x, d.y - off);
    ctx.fillStyle = d.col; ctx.fillText(s, d.x, d.y - off);
  }
  ctx.globalAlpha = 1;
}

/**
 * 적 탄: 빛 번짐과 내 공격 효과가 다 그려진 뒤 맨 위에 또렷하게 그린다
 * (어두운 테두리 + 색 고리 + 흰 심) — 화면이 아무리 난잡해도 보이도록
 */
function drawThreats(g) {
  if (!g.ebullets.length) return;
  const c = g.cam, [shx, shy] = g.shakeOff || [0, 0];
  ctx.save();
  ctx.translate(-c.x + shx, -c.y + shy);
  for (const b of g.ebullets) {
    if (!g.inView(b.x, b.y, 20)) continue;
    const r = b.r + 1.5;
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = b.col; ctx.lineWidth = r * 1.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - b.dx * 14, b.y - b.dy * 14); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, r + 3, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fillStyle = b.col; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.45, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
  }
  ctx.restore();
}

/** 블룸 뒤에 덧씌우는 화면 효과: 가장자리 어둡게 / 피격 붉은 번쩍임 / 저체력 경고 / 섬광 */
function drawScreenFx(g) {
  ctx.drawImage(vignette('#000000', 0.55), 0, 0, VW, VH);
  const p = g.player, low = !g.over && !g.rescue && p.hp / p.maxHp < 0.3 ? 0.22 + 0.12 * Math.sin(FX.time * 6) : 0;
  const a = Math.max(low, g.hurtFlash * 0.75);
  if (a > 0.01) { ctx.globalAlpha = a; ctx.drawImage(vignette('#ff1030', 0.35), 0, 0, VW, VH); ctx.globalAlpha = 1; }
  if (g.flashT > 0 && SET.flash) {
    ctx.globalAlpha = Math.pow(g.flashT / Game.FLASH_DUR, 1.5);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1;
  }
}

// =============================================================================
// UI (HUD / 카드 선택 / 일시정지 / 게임 오버 / 메인 메뉴)
// 버튼은 그릴 때마다 클릭 영역을 등록하고, 클릭 이벤트에서 그 목록을 검사한다.
// =============================================================================
const UI = { hot: [] };
const inRect = (x, y, w, h) => { const k = UI_K; return MOUSE.x >= x * k && MOUSE.x <= (x + w) * k && MOUSE.y >= y * k && MOUSE.y <= (y + h) * k; };
/** 누를 수 있는 영역 등록 (확대된 HUD 안에서도 실제 화면 좌표로 저장) */
function hot(x, y, w, h, fn) { const k = UI_K; UI.hot.push({ x: x * k, y: y * k, w: w * k, h: h * k, fn }); return inRect(x, y, w, h); }
/** k배로 키워서 그리기: 그 안에서는 VW·VH가 화면을 k배 확대한 크기로 보임 */
function withUi(k, fn) {

  VW = w / k; VH = h / k; UI_K = k;

}

  if (c.done) {
    const st = clamp((t - 0.3) / 0.16, 0, 1);

function runeSummary(st) {
  const info = st.info;
  const dmg = { barrier: '깨질 때 30', slow: '-', lifesteal: '-', invuln: '-', fire: '0.5초당 3', pulse: '2 + 최대 넉백', berserk: '모든 피해 2.5배', nova: '화면 안 모든 적에게 300' }[st.id];
  let cd;
  if (info.kind === 'passive') {
    cd = st.id === 'pulse' ? '패시브 (2초마다)' : '패시브';
    if (st.id === 'barrier') cd += `  ·  남은 방어 ${st.charges}회`;
  } else {
    cd = (info.cd ? `${info.cd}초` : '없음') + `  ·  남은 횟수 ${st.usesLeft}`;
    if (st.cd > 0) cd += `  ·  ${Math.ceil(st.cd)}초 후 사용 가능`;
  }
  return [`피해: ${dmg}`, `쿨타임: ${cd}`, info.desc];
}

  for (const [bx, by, br, col] of MENU_BLOBS) drawGlow(col, cx + mod(bx - cx * 0.4, VW + 1200) - 600, cy + mod(by, VH + 800) - 400, br, 0.2);

  const kinds = ['straight', 'drone', 'tracker', 'walker', 'straight', 'hound', 'ranged', 'artillery', 'tracker', 'drone', 'straight', 'tank', 'mini', 'hound', 'warden3'];
  for (let i = 0; i < 26; i++) {

    const x = mod(i * 397 + Math.cos(an) * sp * t, VW + 200) - 100, y = mod(i * 211 + Math.sin(an) * sp * t, VH + 200) - 100;
    const key = kd === 'drone' ? 'drone' + (Math.floor(t * 9 + i) % 2) : kd;
    const rot = kd === 'mini' ? t * 0.5 : (kd === 'straight' || kd === 'tracker') ? an : 0;   // 친구 적은 똑바로 선 채 이동

  bloomPass();

  ctx.fillStyle = 'rgba(120,150,220,0.2)'; ctx.fillRect(rx - 26, ly - 10, 1.5, H - 150);
  txt(ctx, '모바일 버튼', rx, ly, 16, '#ff9a2e', 'left', 800);
  cycleRow(rx, ly + 22, rw, '버튼 크기', Math.round(SET.btnScale * 100) + '%', () => { SET.btnScale = BTN_SCALES[(BTN_SCALES.indexOf(SET.btnScale) + 1) % BTN_SCALES.length]; saveSettings(); });
  cycleRow(rx, ly + 64, rw, '조이스틱 · 버튼 투명도', Math.round(SET.btnAlpha * 100) + '%', () => { SET.btnAlpha = BTN_ALPHAS[(BTN_ALPHAS.indexOf(SET.btnAlpha) + 1) % BTN_ALPHAS.length]; saveSettings(); });
  // 미리보기: 조이스틱 + 룬석 슬롯 크기
  const pcx = rx + 110, pcy = ly + 230, R = joyR();
  txt(ctx, '미리보기', rx, ly + 120, 13, C.dim, 'left', 700);
  ctx.globalAlpha = SET.btnAlpha;
  ctx.beginPath(); ctx.arc(pcx, pcy, R, 0, TAU); ctx.fillStyle = 'rgba(10,16,34,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(150,190,255,0.7)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(pcx + R * 0.45 * Math.cos(App.t * 1.5), pcy + R * 0.45 * Math.sin(App.t * 1.5), R * 0.42, 0, TAU); ctx.fillStyle = 'rgba(95,225,255,0.55)'; ctx.fill();
  ctx.globalAlpha = 1;
  const ss = Math.round(64 * SET.btnScale);
  rr(ctx, rx + rw - ss - 10, pcy - ss / 2, ss, ss, 9); ctx.fillStyle = 'rgba(8,12,26,0.85)'; ctx.fill(); ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
  drawRuneIcon(ctx, 'nova', rx + rw - ss / 2 - 10, pcy, 14 * SET.btnScale, C.runeAtk);
  txt(ctx, '룬석 슬롯', rx + rw - ss / 2 - 10, pcy + ss / 2 + 14, 12, C.dim, 'center', 600);
  const note = SET.mobile ? '지금 조작: 모바일' : "설정의 '조작'을 모바일로 바꾸면 적용돼요";
  txt(ctx, note, rx, ly + 360, 13, SET.mobile ? '#ff9a2e' : C.gray, 'left', 700);
  txt(ctx, '모바일: 화면 아무 곳이나 끌면 조이스틱,', rx, ly + 386, 12, C.dim, 'left', 600);
  txt(ctx, '룬석 슬롯을 누르면 바로 사용해요.', rx, ly + 404, 12, C.dim, 'left', 600);

  button(VW / 2 - 200, Y + H - 62, 180, 44, '기본값으로', () => { resetKeys(); SET.btnScale = 1; SET.btnAlpha = 0.6; saveSettings(); KeyEdit.wait = null; });
  button(VW / 2 + 20, Y + H - 62, 180, 44, '닫기', () => KeyEdit.close(), { col: '#56e08a' });
}

// =============================================================================
// 랭킹 (모드별 TOP 5 — 이 브라우저에 저장됨)
//   무한 생존: 구출까지 버틴 시간 · 랭킹전: 최종 점수
// =============================================================================
function mkBoard(key, o) {
  return {
    MAX: 5, key, ...o,
    entries: (loadJSON(key, []) || []).filter(e => e && typeof e.value === 'number').slice(0, 5),
    qualifies(v) { return v > 0 && (this.entries.length < this.MAX || v > this.entries[this.entries.length - 1].value); },
    clear() { this.entries = []; saveJSON(this.key, []); },
    add(name, v) {
      const e = { name: String(name || '').trim().slice(0, 10) || this.anon, value: v };
      this.entries.push(e);
      this.entries.sort((a, b) => b.value - a.value);
      this.entries = this.entries.slice(0, this.MAX);
      saveJSON(this.key, this.entries);
      return this.entries.indexOf(e);
    },
  };
}
const Boards = {
  survival: mkBoard('mh_board_survival', { title: '무한 생존  TOP 5', sub: '구출까지 버틴 시간', anon: '이름 없는 생존자', fmt: v => fmtTime(v) }),
  ranked: mkBoard('mh_board_ranked', { title: '랭킹전  TOP 5', sub: '최종 점수', anon: '이름 없는 도전자', fmt: v => fmtNum(v) + ' P' }),
};

// =============================================================================
// 앱: 장면 전환 / 입력 / 메인 루프
// =============================================================================
const App = {
  scene: 'menu', game: null, t: 0, fade: 1,
  mode: loadJSON('mh_mode', 'survival') === 'ranked' ? 'ranked' : 'survival', boardView: null,   // 고른 모드 / 메뉴 랭킹표에 보이는 모드
  setMode(m) { this.mode = m; this.boardView = m; saveJSON('mh_mode', m); },
  nameEl: document.getElementById('nm'), nameShown: false,
  start(mode = this.game ? this.game.mode : this.mode) { this.submitName(); this.game = new Game(mode); this.scene = 'game'; this.fade = 1; sfx('click'); },
  restart() { this.start(); },
  /** 메뉴에서 시작: 처음이면 프롤로그부터 */
  begin() { if (Story.seen) this.start(this.mode); else Story.open(['prologue', this.mode], 'game', 'game'); },
  toMenu() { this.submitName(); this.game = null; DMG_SINK = null; this.scene = 'menu'; this.fade = 1; },
  onGameOver() { },
  /** 게임 오버 화면의 이름 입력칸 (한글 입력을 위해 HTML 입력창을 캔버스 위에 띄운다) */
  showName() {
    if (this.nameShown) return;
    this.nameShown = true;
    const el = this.nameEl;
    el.placeholder = this.game && this.game.mode === 'ranked' ? '도전자 이름' : '생존자 이름';
    el.value = ''; el.style.display = 'block';
    this.placeNameInput();
    try { el.focus(); } catch (e) { /* 포커스 불가 */ }
  },
  placeNameInput() {
    if (!this.nameShown) return;
    const s = this.nameEl.style;
    s.left = OFF_X + (VW / 2 - 156) * CSS_S + 'px'; s.top = OFF_Y + 338 * CSS_S + 'px';
    s.width = 312 * CSS_S + 'px'; s.height = 42 * CSS_S + 'px'; s.fontSize = 20 * CSS_S + 'px';
  },
  submitName() {
    const g = this.game;
    if (g && g.over && g.over.qualifies && !g.over.submitted) {
      g.over.rank = Boards[g.mode].add(this.nameEl.value, g.over.value);
      g.over.submitted = true;
    }
    if (this.nameShown) { this.nameShown = false; this.nameEl.style.display = 'none'; this.nameEl.blur(); }
  },
  onKey(code) {
    if (isKey(code, 'mute')) { SET.sound = !SET.sound; saveSettings(); return; }
    if (this.scene === 'menu') { if (code === 'Enter' || code === 'Space') this.begin(); return; }
    if (this.scene === 'story') { if (code === 'Escape') Story.escape(); else if (code === 'Enter' || code === 'Space') Story.advance(); return; }
    const g = this.game;
    if (g.over) { if ((code === 'Enter' || isKey(code, 'reroll')) && g.over.t > 1.2 && (!g.over.qualifies || g.over.submitted)) this.restart(); return; }
    g.onKey(code);
  },
  /** 누른 곳의 버튼 실행 (true = 무언가를 눌렀음) */
  onClick() {
    for (let i = UI.hot.length - 1; i >= 0; i--) {
      const h = UI.hot[i];
      if (MOUSE.x >= h.x && MOUSE.x <= h.x + h.w && MOUSE.y >= h.y && MOUSE.y <= h.y + h.h) { sfx('click'); h.fn(); return true; }
    }
    if (this.scene === 'story') { Story.advance(); return true; }
    return false;
  },
};

window.addEventListener('keydown', e => {
  SFX.init();
  if (e.target === App.nameEl) { if (e.key === 'Enter' && !e.isComposing) App.submitName(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (KeyEdit.open) { e.preventDefault(); if (!e.repeat) KeyEdit.onKey(e.code); return; }   // 키 설정 창이 키를 가져감
  if (e.repeat) return;
  KEYS.add(e.code);
  App.onKey(e.code);
});
window.addEventListener('keyup', e => KEYS.delete(e.code));
/** 창을 벗어나면 자동으로 일시정지 */
function autoPause() {
  KEYS.clear(); joyEnd();
  const g = App.game;
  if (g && !g.over && !g.weaponSel && !g.levelup && !g.runeReveal) g.paused = true;
}
// 모바일은 화면이 실제로 가려질 때만 (전체 화면 전환 등으로 잠깐 포커스가 빠지는 것은 무시)
window.addEventListener('blur', () => { if (!SET.mobile) autoPause(); else { KEYS.clear(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
// ---- 마우스 · 터치 (포인터 이벤트로 함께 처리) ----
const evPos = e => [(e.clientX - OFF_X) / CSS_S, (e.clientY - OFF_Y) / CSS_S];
/** 지금 조이스틱을 쓸 수 있는 상황인지 (게임 진행 중, 다른 창 없음) */
const canJoy = () => { const g = App.game; return SET.mobile && App.scene === 'game' && g && !g.over && !g.paused && !g.levelup && !g.weaponSel && !g.runeReveal && !g.rescue && !KeyEdit.open; };
// 캔버스 바깥(위아래·좌우 여백)을 눌러도 받도록 창 전체에서 받음 — 여백을 끌면 브라우저가 스크롤/전체 화면 해제로 받아들이던 문제
window.addEventListener('pointerdown', e => {
  if (e.target === App.nameEl) return;   // 이름 입력칸은 그대로
  SFX.init();
  if (e.pointerType === 'mouse' && e.button === 2) { toLogical(e); if (App.game && !KeyEdit.open) App.game.onRightClick(); return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  if (JOY.id !== null && e.pointerId !== JOY.id) {   // 조이스틱을 쥔 채 다른 손가락으로 누름: 마우스 위치는 건드리지 않고 버튼만 확인
    const [x, y] = evPos(e), mx = MOUSE.x, my = MOUSE.y;
    MOUSE.x = x; MOUSE.y = y; App.onClick(); MOUSE.x = mx; MOUSE.y = my;
    return;
  }
  toLogical(e);
  const g = App.game;
  if (!KeyEdit.open && App.scene === 'game' && g.runeReveal && !g.over && !g.paused) { g.revealDown(); return; }
  if (App.onClick()) return;
  if (canJoy()) joyStart(e.pointerId, clamp(MOUSE.x, 0, VW), clamp(MOUSE.y, 0, VH));   // 버튼이 아닌 곳: 그 자리에 조이스틱
});
window.addEventListener('pointermove', e => {
  if (e.pointerId === JOY.id) { const [x, y] = evPos(e); joyMove(x, y); return; }
  if (JOY.id !== null && e.pointerType !== 'mouse') return;
  toLogical(e);
  if (App.game && App.game.runeReveal) App.game.revealMove();
});
const pointerEnd = e => {
  if (e.pointerId === JOY.id) { joyEnd(); return; }
  if (App.game && App.game.runeReveal && (e.pointerType !== 'mouse' || e.button === 0)) App.game.revealUp();
};
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);
// 터치로 화면이 밀리거나 확대되지 않게 (iOS: 끌기 · 두 손가락 확대) — 누르기/떼기는 막지 않음 (전체 화면 요청이 터치로 인정되도록)
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
cv.addEventListener('wheel', e => { e.preventDefault(); if (App.game) App.game.onWheel(e.deltaY); }, { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);
window.addEventListener('orientationchange', () => { resize(); setTimeout(resize, 150); setTimeout(resize, 500); });
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

function render() {
  UI.hot.length = 0;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, VW, VH);
  drawScene();
  drawOverlays();
  if (App.fade > 0) { ctx.globalAlpha = App.fade; ctx.fillStyle = '#03050b'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }   // 장면 전환 페이드
}
function drawScene() {
  if (App.scene === 'menu') { drawMenu(); return; }
  if (App.scene === 'story') { drawStory(); return; }
  const g = App.game;
  drawWorld(g);
  bloomPass();
  drawThreats(g);
  drawScreenFx(g);
  drawOffscreenArrows(g);
  withUi(SET.mobile ? 1.25 : 1, () => { drawHUD(g); drawRescueHud(g); });   // 모바일: 게임 중 HUD를 크게
  if (canJoy()) drawJoystick(); else if (JOY.id !== null && App.game && (App.game.levelup || App.game.paused || App.game.over)) joyEnd();
  if (g.paused) drawPause(g);   // 무기·증강 선택 중에 눌러도 일시정지 화면이 위에 뜸
  else if (g.weaponSel) drawWeaponSelect(g);
  else if (g.runeReveal) drawRuneReveal(g);
  else if (g.levelup) drawLevelUp(g);
  if (g.over) {
    drawGameOver(g);
    if (g.over.qualifies && !g.over.submitted && g.over.t > 1.15) App.showName();
  }
}
function drawOverlays() { drawKeyEdit(); }

let _last = 0;
function frame(now) {
  // 프레임 간격(초). 최대 50ms로 제한해 창 이동 등으로 멈췄다 돌아올 때 튀는 것을 방지
  const dt = clamp((now - _last) / 1000, 0, 0.05);
  _last = now;
  checkResize();
  App.t += dt;
  if (App.fade > 0) App.fade = Math.max(0, App.fade - dt * 3);
  FX.trauma = Math.max(0, FX.trauma - dt * 1.7);
  if (App.scene === 'game') App.game.update(dt);
  else if (App.scene === 'story') Story.update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(t => { _last = t; requestAnimationFrame(frame); });

</script>
</body>
