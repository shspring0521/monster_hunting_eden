// ---- 테슬라 번개: 주변 적 여러 마리에게 낙뢰 (범위 공격이라 한 발 피해는 낮게) ----
class Lightning extends Skill {
  constructor() { super(); this.t = 1.2; this.bolts = []; }
  get interval() { return 2.1 * 0.75 * this.cd; }   // 낙뢰 간격 3/4: 2.1초 → 1.575초
  get targets() { return (this.L + 1) * 2; }          // 낙뢰 수 2배: 4 → 12마리
  get damage() { return (6 + (this.L - 1)) * 1.5; }   // 피해 1.5배: 9 → 15
  get range() { return Math.round(620 * 1.15) + this.rangeBonus; }   // 범위 1.15배: 620 → 713px
  lines() { return [`${this.interval.toFixed(2)}초마다 낙뢰`, `주변 적 ${this.targets}마리 · ${n1(this.damage)} 피해`, `범위 ${this.range}px`]; }
  update(dt, g) {
    this.t += dt;
    const p = g.player;
    if (this.t >= this.interval) {
      const cands = shuffle(g.mons.filter(m => m.kind !== 'crate' && dist(m.x, m.y, p.x, p.y) < this.range)).slice(0, this.targets);
      if (cands.length) {
        this.t = 0;
        for (const m of cands) {
          m.hp -= this.damage;
          const pts = [];   // 하늘에서 내리꽂히는 지그재그 번개
          for (let s = 0; s <= 6; s++) pts.push([m.x + (s === 6 ? 0 : rand(-18, 18)), m.y - 280 + 280 * s / 6]);
          this.bolts.push({ pts, life: 0.26 });
          FX.burst(m.x, m.y, '#c79bff', 8, 260, 0.3, 2); FX.ring(m.x, m.y, 4, 34, 0.25, '#c79bff', 3);
        }
        sfx('zap');
      }
    }
    for (const b of this.bolts) b.life -= dt;
    this.bolts = this.bolts.filter(b => b.life > 0);
  }
  drawOver(g) { for (const b of this.bolts) glowLine(b.pts, '#b57cff', 4, b.life / 0.26); }
}

// ---- 유도탄: 보스류를 우선 추적하는 단일 대상 미사일 (발 수 = 레벨) ----
class Homing extends Skill {
  static SPEED = 540 / 60; static TURN = 6; static LIFE = 2.4;
  constructor() { super(); this.t = 1.6; this.ms = []; }
  get interval() { return 2.4 * this.cd; }
  static COUNT_MULT = 2.5;   // 발 수 = 레벨 × 2.5 (반올림): 3 / 5 / 8 / 10 / 13
  static BOSS_MULT = 1.2;    // 보스·중간보스에게 1.2배
  get count() { return Math.round(this.L * Homing.COUNT_MULT); }
  get damage() { return 8 + 2 * (this.L - 1); }   // 8 → 16
  get blastR() { return Math.round(20 * this.area); }   // 폭발 범위 = 미사일 1레벨 범위 (20px)
  lines() { return [`${this.interval.toFixed(1)}초마다 유도탄 ${this.count}발`, `한 발 ${n1(this.damage)} 피해 · 폭발 ${this.blastR}px`, '보스·중간보스 우선 · 1.2배 피해']; }
  pick(g, p) {
    const list = g.mons.filter(m => m.kind !== 'crate' && m.hp > 0);
    list.sort((a, b) => (b.tier - a.tier) || (dist(a.x, a.y, p.x, p.y) - dist(b.x, b.y, p.x, p.y)));
    return list;
  }
  update(dt, g) {
    this.t += dt;
    const p = g.player;
    if (this.t >= this.interval) {
      const list = this.pick(g, p);
      if (list.length) {
        this.t = 0;
        const n = this.count;
        for (let i = 0; i < n; i++) {
          const a = TAU * i / n - Math.PI / 2;
          this.ms.push({ x: p.x, y: p.y, a, target: list[i % list.length], life: Homing.LIFE, dmg: this.damage, trail: [] });
        }
        sfx('launch');
      }
    }
    let j = 0;
    for (const m of this.ms) {
      m.life -= dt;
      if (!m.target || m.target.hp <= 0 || !g.mons.includes(m.target)) m.target = this.pick(g, m)[0] || null;
      if (m.target) {
        let diff = Math.atan2(m.target.y - m.y, m.target.x - m.x) - m.a;
        diff = mod(diff + Math.PI, TAU) - Math.PI;
        m.a += clamp(diff, -Homing.TURN * dt, Homing.TURN * dt);
      }
      const step = Homing.SPEED * dt * 60, ox = m.x, oy = m.y;
      m.x += Math.cos(m.a) * step; m.y += Math.sin(m.a) * step;
      m.trail.push([m.x, m.y]); if (m.trail.length > 7) m.trail.shift();
      if (Math.random() < 0.5) FX.mote(m.x, m.y, '#ff9a5a', 0, 0, 0.3, 5);
      let hit = null;
      for (const e of g.mons) if (segDist(ox, oy, m.x, m.y, e.x, e.y) < e.r + 7) { hit = e; break; }
      if (hit) {   // 부딪힌 자리에서 작은 폭발: 범위 안 적 모두 피해
        const R = this.blastR;
        for (const e of g.mons) {
          if (e !== hit && dist(m.x, m.y, e.x, e.y) > R + e.r) continue;
          e.hp -= m.dmg * (e.tier > 0 ? Homing.BOSS_MULT : 1);
        }
        g.knockback(hit, m.x - Math.cos(m.a) * 10, m.y - Math.sin(m.a) * 10, 10, 0.15);
        FX.burst(m.x, m.y, '#ff6a5a', 10, 260, 0.3, 2.2); FX.ring(m.x, m.y, 4, R * 1.3, 0.22, '#ff6a5a', 3);
        continue;
      }
      if (m.life > 0) this.ms[j++] = m;
    }
    this.ms.length = j;
  }
  drawOver(g) {
    for (const m of this.ms) {
      if (!g.inView(m.x, m.y, 40)) continue;
      glowLine(m.trail, '#ff6a5a', 3, 0.6);
      drawGlow('#ff6a5a', m.x, m.y, 14);
      drawGlow('#ffffff', m.x, m.y, 5);
    }
  }
}

const SKILLS = {
  shield: Shield, missile: Missile, laser: Laser, rifle: Rifle, grenade: Grenade,
  cannon: Cannon, sword: Sword, claw: Claw, orb: Orb, mine: Mine,
  mega_laser: MegaLaser, meteor: Meteor, energy_field: EnergyField, boundary: Boundary,
  plasma: Plasma, vulcan: Vulcan, lightning: Lightning, homing: Homing,
};

/** 일시정지 화면에 보여줄 현재 수치 요약 (버프가 적용된 실제 값) */
const skillSummary = (id, sk) => sk.lines();

// =============================================================================
// 룬석 시스템 (장비) — 보물상자에서 획득
//   패시브 룬석 : 슬롯에 있는 동안 항상 작동
//   소모성 룬석 : 1~5 키나 마우스 휠로 슬롯을 고른 뒤 우클릭(또는 Space)으로 사용
// =============================================================================
class RuneState {
  constructor(id) {
    this.id = id; this.info = RUNES[id];
    this.usesLeft = this.info.uses || 0;   // 소모성 남은 횟수
    this.cd = 0; this.cdMax = 0;           // 재사용 대기
    this.active = 0;                       // 효과 지속 잔여 시간
    this.timer = 0;                        // 패시브용 타이머 (충격파 주기)
    this.charges = 3; this.broken = false; // 보호막
    this.fixed = false;
  }
  /** 더 쓸 수 없는 상태 (깨진 보호막 / 횟수를 다 쓴 소모성) */
  get spent() {
    if (this.id === 'barrier') return this.broken;
    return this.info.kind === 'consumable' && this.usesLeft <= 0;
  }
  badge() {
    if (this.id === 'barrier') return this.broken ? 'X' : String(this.charges);
    if (this.info.kind === 'consumable') return 'x' + this.usesLeft;
    return '';
  }
}

class RuneSystem {
  static FIRE_LIFE = 8.0; static FIRE_TICK = 0.5; static FIRE_DMG = 3; static FIRE_SPACING = 10; static FIRE_RADIUS = 6;
  static PULSE_PERIOD = 2.0; static PULSE_DUR = 0.45; static PULSE_W = 5;

  constructor(player, n = 4) {
    this.player = player;
    this.slots = new Array(n).fill(null);
    this.obtained = new Set();    // 이번 판에 한 번이라도 얻은 룬석 (패시브 중복 방지)
    this.selected = 0;
    this.pulses = [];             // 퍼지는 충격파 고리
    this.firePts = []; this.fireTick = 0; this.lastFire = null;
    this.spin = 0; this.clock = 0;
    this.pendingBreak = null;     // 보호막이 깨진 위치 (다음 update에서 폭발)
    this.crack1 = this._cracks(1); this.crack2 = this._cracks(2);
  }

  // ---- 슬롯 관리 ----
  count() { return this.slots.filter(Boolean).length; }
  ownedIds() { return this.slots.filter(Boolean).map(s => s.id); }
  get(id) { return this.slots.find(s => s && s.id === id) || null; }
  freeSlot() { const i = this.slots.indexOf(null); return i < 0 ? null : i; }
  /**
   * 상자에서 나올 수 있는 룬석 목록.
   *  - 패시브: 이번 판에 처음 얻는 것만, 빈칸 필요
   *  - 소모성: 이미 있으면 빈칸 없어도 OK (횟수 증가), 없으면 빈칸 필요
   */
  offerPool(hasFree = this.freeSlot() !== null) {
    const owned = this.ownedIds(), pool = [];
    for (const r of RUNE_ORDER) {
      if (RUNES[r].kind === 'consumable') { if (owned.includes(r) || hasFree) pool.push(r); }
      else if (hasFree && !this.obtained.has(r) && !owned.includes(r)) pool.push(r);
    }
    return pool;
  }
  rollNew() { const p = this.offerPool(); return p.length ? p[Math.floor(Math.random() * p.length)] : null; }
  /** 이미 가진 소모성 룬석을 다시 얻으면 기본 횟수만큼 더한다. 늘어난 횟수 반환 */
  stack(id) {
    const st = this.get(id);
    if (!st || st.info.kind !== 'consumable') return 0;
    const n = st.info.uses || 1;
    st.usesLeft += n;
    return n;
  }
  add(id) {
    const i = this.freeSlot();
    if (i === null) return false;
    this.slots[i] = new RuneState(id);
    this.obtained.add(id);
    return true;
  }
  /** 다 쓴 룬석을 슬롯에서 비운다 (효과 지속 중이면 끝난 뒤) */
  releaseSpent() {
    this.slots.forEach((st, i) => {
      if (st && st.spent && st.active <= 0 && !(st.id === 'barrier' && this.pendingBreak)) this.slots[i] = null;
    });
  }
  select(i) { if (i >= 0 && i < this.slots.length) this.selected = i; }

  // ---- 효과 조회 ----
  isInvulnerable() { const s = this.get('invuln'); return !!(s && s.active > 0); }
  damageMult() { const s = this.get('berserk'); return s && s.active > 0 ? 2.5 : 1; }
  /** 룬석이 주는 피해 (광폭화 중이면 배율 적용) */
  deal(m, amount) {
    const d = amount * this.damageMult();
    if (DMG_SINK && m.kind !== 'crate') DMG_SINK.addDmg('rune', Math.min(Math.max(0, m.hp), d));
    m.hp -= d;
  }
  /** 보호막이 피해 1회를 막으면 true. 3회째에 깨지며 폭발 예약 */
  absorb() {
    const b = this.get('barrier');
    if (!b || b.broken) return false;
    b.charges--;
    if (b.charges <= 0) { b.broken = true; this.pendingBreak = [this.player.x, this.player.y]; }
    return true;
  }
  onKill(g, x, y) {
    if (!this.get('lifesteal') || Math.random() >= LIFESTEAL_CHANCE) return;
    const p = this.player, before = p.hp;
    p.hp = Math.min(p.maxHp, p.hp + 2);
    g.prevHp = p.hp;
    // 흡혈 연출: 처치한 자리에서 핏빛 구슬이 플레이어에게 빨려 들어오고, 붉은 고리 + '흡혈 +2'
    if (x !== undefined) for (let i = 0; i < 10; i++) {
      const sx = x + rand(-14, 14), sy = y + rand(-14, 14), t = rand(0.25, 0.4);
      FX.mote(sx, sy, '#ff2a4a', (p.x - sx) / t, (p.y - sy) / t, t, 9);
    }
    FX.ring(p.x, p.y, 34, 8, 0.35, '#ff2a4a', 4); FX.ring(p.x, p.y, 10, 70, 0.45, '#ff6a7a', 3);
    FX.burst(p.x, p.y, '#ff4a6a', 18, 240, 0.45, 2.4);
    g.popups.push({ x: p.x, y: p.y - p.r - 40, amt: p.hp - before, text: '흡혈 +' + Math.max(0, p.hp - before), col: '#ff6a8a', tier: 3, age: 0, dur: 1.1, pop: 14, fade: 0.55, heal: true, big: true });
    sfx('drain');
  }

  // ---- 사용 ----
  useSelected(g) {
    const st = this.slots[this.selected];
    if (!st || st.info.kind !== 'consumable') return;
    if (st.usesLeft <= 0 || st.cd > 0 || st.active > 0) return;
    st.usesLeft--;
    const p = this.player;
    if (st.id === 'invuln') {
      st.active = st.info.dur; st.cd = st.cdMax = st.info.cd;
      FX.ring(p.x, p.y, 10, 90, 0.5, '#ffe98c', 4); FX.burst(p.x, p.y, '#ffe98c', 24, 300, 0.5, 2.4); sfx('rune');
    } else if (st.id === 'berserk') {
      st.active = st.info.dur; st.cd = st.cdMax = st.info.cd;
      FX.ring(p.x, p.y, 10, 100, 0.5, '#ff5a3c', 4); FX.burst(p.x, p.y, '#ff5a3c', 28, 340, 0.5, 2.6); FX.shake(0.3); sfx('rune');
    } else if (st.id === 'nova') this._nova(g);
  }
  /** 화면 안 모든 적에게 300 피해 + 섬광 + 시간 감속 */
  _nova(g) {
    for (const m of g.mons) if (m.kind !== 'crate' && g.inView(m.x, m.y, m.r)) this.deal(m, 300);
    g.slowT = Game.NOVA_SLOW;
    if (SET.flash) g.flashT = Game.FLASH_DUR;
    const p = this.player;
    FX.ring(p.x, p.y, 20, 900, 0.6, '#fffadc', 8); FX.ring(p.x, p.y, 10, 600, 0.8, '#ffd84a', 4);
    FX.burst(p.x, p.y, '#fff3b0', 60, 700, 0.7, 3);
    FX.shake(0.9); sfx('nova');
  }

  // ---- 매 프레임 ----
  /** 이동/몬스터 처리 전에 호출: 타이머, 이동속도 배율, 둔화 오라 */
  preUpdate(dt, g) {
    this.clock += dt; this.spin += dt * 1.1;
    for (const s of this.slots) if (s) { s.cd = Math.max(0, s.cd - dt); s.active = Math.max(0, s.active - dt); }
    for (const f of this.pulses) { f.age += dt; this._pulseHits(f, g); }
    this.pulses = this.pulses.filter(f => f.age < RuneSystem.PULSE_DUR);

    let mult = 1;   // 무적 +30%, 광폭화 +30% (겹치면 합산)
    const inv = this.get('invuln'), bz = this.get('berserk');
    if (inv && inv.active > 0) mult += 0.3;
    if (bz && bz.active > 0) mult += 0.3;
    this.player.runeSpd = mult;
    this.releaseSpent();

    // 둔화 오라: 범위 안 일반 몬스터는 각자 이동 속도의 50%, 적 탄환도 50% 속도 (중간보스·보스 면역)
    g.slowAura = this.get('slow') ? SLOW_RUNE_R : 0;
    if (g.slowAura) {
      const p = this.player;
      for (const m of g.mons) if (m.tier === 0) m.slow = dist(p.x, p.y, m.x, m.y) < SLOW_RUNE_R ? 1 : 0;
    }
  }
  /** 플레이어 이동 후 호출: 불길 / 충격파 / 보호막 파괴 */
  update(dt, g) {
    const p = this.player;
    if (this.pendingBreak) {
      const [x, y] = this.pendingBreak; this.pendingBreak = null;
      for (const m of g.mons) if (dist(x, y, m.x, m.y) < SHIELD_R_LV3) { this.deal(m, 30); g.knockback(m, x, y, SHIELD_R_LV3); }
      FX.ring(x, y, 20, SHIELD_R_LV3, 0.45, '#aee1ff', 7); FX.burst(x, y, '#aee1ff', 40, 420, 0.5, 3);
      FX.shake(0.5); FX.stop(0.08); sfx('boom');
    }
    const pulse = this.get('pulse');
    if (pulse) {
      pulse.timer += dt;
      if (pulse.timer >= RuneSystem.PULSE_PERIOD) {
        pulse.timer = 0;
        const f = { x: p.x, y: p.y, r: PULSE_RANGE, age: 0, hit: new Set() };
        this.pulses.push(f);
        this._pulseHits(f, g);   // 발동 순간 몸에 붙어 있는 적부터 판정
      }
    }
    if (this.get('fire')) this._updateFire(dt, g.mons); else this.lastFire = null;
  }
  _updateFire(dt, mons) {
    const p = this.player, SP = RuneSystem.FIRE_SPACING;
    if (!this.lastFire) this.lastFire = [p.x, p.y];
    const d = dist(p.x, p.y, this.lastFire[0], this.lastFire[1]);
    if (d >= SP) {
      const n = Math.floor(d / SP), [lx, ly] = this.lastFire;
      for (let i = 1; i <= n; i++) { const t = i * SP / d; this.firePts.push([lx + (p.x - lx) * t, ly + (p.y - ly) * t, 0]); }
      const t = n * SP / d;
      this.lastFire = [lx + (p.x - lx) * t, ly + (p.y - ly) * t];
    }
    for (const pt of this.firePts) pt[2] += dt;
    this.firePts = this.firePts.filter(pt => pt[2] < RuneSystem.FIRE_LIFE);
    this.fireTick += dt;
    if (this.fireTick >= RuneSystem.FIRE_TICK) {
      this.fireTick = 0;
      // 불길 좌표를 48px 격자에 넣어두고 몬스터마다 주변 칸만 검사
      const grid = new Map();
      for (const [x, y] of this.firePts) {
        const k = Math.floor(x / 48) * 4096 + Math.floor(y / 48);
        let a = grid.get(k); if (!a) grid.set(k, a = []);
        a.push(x, y);
      }
      for (const m of mons) {
        const cx = Math.floor(m.x / 48), cy = Math.floor(m.y / 48), reach = m.r + RuneSystem.FIRE_RADIUS;
        let hit = false;
        for (let gx = cx - 1; gx <= cx + 1 && !hit; gx++) for (let gy = cy - 1; gy <= cy + 1 && !hit; gy++) {
          const a = grid.get(gx * 4096 + gy);
          if (a) for (let i = 0; i < a.length; i += 2) if (dist(a[i], a[i + 1], m.x, m.y) < reach) { hit = true; break; }
        }
        if (hit && !m.fly) this.deal(m, RuneSystem.FIRE_DMG);   // 날아다니는 적은 불길(장판) 무시
      }
    }
  }

  // ---- 충격파 ----
  /** 고리의 현재 바깥 테두리 반경 (그리는 공식과 동일) */
  static pulseReach(f) {
    const t = Math.min(1, f.age / RuneSystem.PULSE_DUR);
    return f.r * (1 - (1 - t) * (1 - t)) + RuneSystem.PULSE_W / 2;
  }
  /** 고리가 남아 있는 동안 안쪽은 몬스터가 들어올 수 없다 (몬스터 이동 뒤에 호출) */
  enforcePulseWalls(g) {
    if (!this.pulses.length) return;
    for (const m of g.mons) for (const f of this.pulses) {
      const need = RuneSystem.pulseReach(f) + m.r;
      let dx = m.x - f.x, dy = m.y - f.y, d = Math.hypot(dx, dy);
      if (d < need) {
        if (d < 0.001) { const a = rand(0, TAU); dx = Math.cos(a); dy = Math.sin(a); d = 1; }
        m.x = Arena.cx(f.x + dx / d * need); m.y = Arena.cy(f.y + dy / d * need);
      }
    }
  }
  /** 고리 바깥 테두리가 적의 몸에 닿는 순간 2 피해 + 최대 넉백 (1회) */
  _pulseHits(f, g) {
    const reach = RuneSystem.pulseReach(f);
    for (const m of g.mons) {
      if (f.hit.has(m)) continue;
      if (dist(f.x, f.y, m.x, m.y) - m.r <= reach) {
        f.hit.add(m);
        this.deal(m, 2);
        g.knockback(m, f.x, f.y, PULSE_MAX_KB);
      }
    }
  }

  _cracks(level) {   // 보호막에 그려질 금 (단위원 좌표)
    const lines = [], a = rand(0, TAU), n = level === 1 ? 4 : 7, endR = level === 1 ? 0.45 : 0.05, pts = [];
    for (let i = 0; i < n; i++) {
      const r = 1 - (1 - endR) * i / (n - 1), aa = a + rand(-0.25, 0.25);
      pts.push([Math.cos(aa) * r, Math.sin(aa) * r]);
    }
    lines.push(pts);
    if (level === 2) {
      const mid = pts[3], b = a + (Math.random() < 0.5 ? -1 : 1) * rand(0.7, 1.1);
      lines.push([mid, [mid[0] + Math.cos(b) * 0.35, mid[1] + Math.sin(b) * 0.35], [mid[0] + Math.cos(b) * 0.6, mid[1] + Math.sin(b) * 0.5]]);
    }
    return lines;
  }

  // ---- 그리기 ('lighter' 합성, 월드 좌표) ----
  drawUnder(g) {
    const p = this.player;
    for (const [x, y, age] of this.firePts) {
      if (!g.inView(x, y, 20)) continue;
      const remain = RuneSystem.FIRE_LIFE - age;
      const k = remain > 1.5 ? 1 : Math.max(0.2, remain / 1.5);
      const fl = 1 + 0.25 * Math.sin(this.clock * 14 + x * 0.3 + y * 0.2);
      drawGlow('#ff5a1e', x, y - 2, 15 * k * fl, 0.85);
      drawGlow('#ffd06a', x, y, 6 * k * fl, 0.9);
    }
    if (this.get('slow')) {
      drawZone('#a05aff', p.x, p.y, SLOW_RUNE_R, 0.45 + 0.15 * Math.sin(this.clock * 3));
    }
  }
  drawOver(g) {
    const p = this.player;
    this._drawBarrier(p.x, p.y);
    if (this.isInvulnerable()) {
      const k = 0.5 + 0.5 * Math.sin(this.clock * 10);
      drawGlow('#ffe98c', p.x, p.y, 40, 0.22 + 0.12 * k);
      glowRing(p.x, p.y, 27, '#ffe98c', 3, 0.6 + 0.4 * k);
    }
    if (this.damageMult() > 1) {
      const r = 24 + 3 * Math.sin(this.clock * 12);
      drawGlow('#ff3c28', p.x, p.y, 44, 0.3);
      glowRing(p.x, p.y, r, '#ff5a3c', 3, 0.9);
      if (Math.random() < 0.5) FX.mote(p.x + rand(-14, 14), p.y + rand(-14, 14), '#ff5a3c', rand(-20, 20), rand(-90, -40), 0.4, 6);
    }
    for (const f of this.pulses) {
      const t = f.age / RuneSystem.PULSE_DUR, r = Math.max(2, f.r * (1 - (1 - t) * (1 - t)));

  let r = rand(0, Object.values(opts).reduce((a, c) => a + c, 0));

/** 플레이어 주변에 바위 4~6개 — 서로(기존 바위 포함) 겹치지 않게 배치 */
function bossThrowRocks(b, g) {
  const p = g.player, live = g.rocks.filter(r => !r.broken);
  const n = Math.min(randi(4, 6), BOSS.MAX_ROCKS - live.length), placed = [];
  for (let i = 0; i < n; i++) {
    const k = rand(1, 3), rd = Rock.BASE_R * k;
    for (let tr = 0; tr < 40; tr++) {
      const a = rand(0, TAU), d = i === 0 ? rand(0, 60) : rand(120, 380);   // 첫 바위는 플레이어를 노린다
      const tx = Arena.cx(p.x + Math.cos(a) * d, rd), ty = Arena.cy(p.y + Math.sin(a) * d, rd);
      if (placed.every(o => dist(tx, ty, o[0], o[1]) >= rd + o[2]) && live.every(r => dist(tx, ty, r.tx, r.ty) >= rd + r.radius)) {
        placed.push([tx, ty, rd]);

}

// ---- 보스 바위 ----------------------------------------------------------------
// 날아가는 동안 탄착점에 빨간 예고가 진해지고, 떨어지면 벽이 된다
//   직격(바위 안): 20 피해 + 밀쳐냄   충격파(가장자리 바깥): 8~10 피해 + 밀쳐냄
class Rock {
  static BASE_R = 41; static FLIGHT = 1.2; static MAX_HITS = 3; static DIRECT = 20; static PUSH = 70;
  constructor(sx, sy, tx, ty, k, delay) {
    this.sx = sx; this.sy = sy; this.tx = tx; this.ty = ty; this.k = k;
    this.radius = Math.floor(Rock.BASE_R * k);
    this.shockExtra = Math.floor(22 + 10 * k);
    this.shockDmg = Math.round(8 + (k - 1));
    this.delay = delay; this.age = 0; this.landed = false; this.landAge = 0; this.hits = 0; this.broken = false;
    this.chunks = Rock.makeChunks();
  }
  static makeChunks() {   // 바위 하나 = 4~5개의 울퉁불퉁한 돌덩이 (반지름 1 기준)
    const out = [], n = randi(4, 5);
    for (let i = 0; i < n; i++) {
      let cx = 0, cy = 0, cr = 0.62;
      if (i) { const a = rand(0, TAU), d = rand(0.35, 0.55); cx = Math.cos(a) * d; cy = Math.sin(a) * d; cr = rand(0.32, 0.45); }
      const pts = [];
      for (let k = 0; k < 7; k++) { const an = k / 7 * TAU + rand(-0.25, 0.25), rr2 = cr * rand(0.75, 1.05); pts.push([cx + Math.cos(an) * rr2, cy + Math.sin(an) * rr2]); }
      out.push({ pts, shade: randi(-10, 10) });
    }
    out.sort((a, b) => a.pts.reduce((s, q) => s + q[1], 0) - b.pts.reduce((s, q) => s + q[1], 0));
    return out;
  }
  get flying() { return !this.landed && this.age >= this.delay; }
  get progress() { return clamp((this.age - this.delay) / Rock.FLIGHT, 0, 1); }
  update(dt, g) {
    this.age += dt;
    if (this.landed) { this.landAge += dt; return; }
    if (this.age >= this.delay + Rock.FLIGHT) { this.landed = true; this.impact(g); }
  }
  impact(g) {
    const p = g.player, d = dist(p.x, p.y, this.tx, this.ty);
    if (d < this.radius + p.r * 0.5) {
      g.hurtPlayer(Rock.DIRECT);
      g.pushPlayer(this.tx, this.ty, this.radius + p.r + Rock.PUSH - d);
    } else if (d < this.radius + this.shockExtra + p.r) {
      g.hurtPlayer(this.shockDmg);
      g.pushPlayer(this.tx, this.ty, Rock.PUSH);
    }
    FX.ring(this.tx, this.ty, this.radius * 0.6, this.radius + this.shockExtra, 0.35, '#ffaa78', 5);
    FX.burst(this.tx, this.ty, '#d9c8ff', 18, 380, 0.45, 2.8);
    if (g.inView(this.tx, this.ty, this.radius)) { FX.shake(0.3, 0.8); sfx('boom'); }
  }
  drawTelegraph(g) {   // 'lighter' 층: 탄착 예고
    if (this.landed || this.age < this.delay || !g.inView(this.tx, this.ty, this.radius + 80)) return;
    const t = this.progress;
    drawZone('#ff5a3c', this.tx, this.ty, this.radius + this.shockExtra, 0.15 + 0.3 * t);
    drawZone('#ff2e3e', this.tx, this.ty, this.radius, 0.3 + 0.7 * t);

  }
  _body(x, y, R) {
    ctx.lineJoin = 'round';
    for (const c of this.chunks) {
      poly(ctx, c.pts.map(q => [x + q[0] * R, y + q[1] * R])); ctx.closePath();
      const v = 30 + c.shade;
      ctx.fillStyle = `rgb(${v + 6},${v},${v + 22})`; ctx.fill();
      ctx.strokeStyle = '#a995e6'; ctx.lineWidth = 2; ctx.stroke();
      poly(ctx, c.pts.slice(0, 3).map(q => [x + q[0] * R * 0.9 - 2, y + q[1] * R * 0.9 - 3]));
      ctx.strokeStyle = 'rgba(225,215,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    for (let i = 0; i < this.hits; i++) {   // 참격을 맞은 횟수만큼 금이 간다
      const a = 0.9 + i * 2.1;
      poly(ctx, [[x + Math.cos(a) * R * 0.1, y + Math.sin(a) * R * 0.1], [x + Math.cos(a + 0.4) * R * 0.5, y + Math.sin(a + 0.4) * R * 0.5], [x + Math.cos(a - 0.2) * R * 0.8, y + Math.sin(a - 0.2) * R * 0.8]]);
      ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }
  drawGround(g) { if (this.landed && g.inView(this.tx, this.ty, this.radius + 20)) this._body(this.tx, this.ty, this.radius); }
  drawAir(g) {   // 날아가는 바위 (포물선 + 그림자)
    if (!this.flying) return;
    const t = this.progress, gx = this.sx + (this.tx - this.sx) * t, gy = this.sy + (this.ty - this.sy) * t;
    if (!g.inView(gx, gy, 300)) return;
    const h = Math.sin(Math.PI * t) * (160 + 40 * this.k);
    ctx.beginPath(); ctx.ellipse(gx, gy, this.radius * 0.5, this.radius * 0.28, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
    this._body(gx, gy - h, this.radius * (0.55 + 0.45 * t));
  }
}

// ---- 바람 참격 ----------------------------------------------------------------
// 보스 중심에서 화면 끝까지 퍼지는 고리. 바위 뒤쪽 각도만 끊긴다 (바위 뒤에 숨으면 안 맞음)
class WindSlash {
  static SPEED = 900; static THICK = 16;
  constructor(ox, oy, dmg, rocks, maxR) {
    this.ox = ox; this.oy = oy; this.dmg = dmg; this.r = 0; this.maxR = maxR; this.done = false; this.hitPlayer = false;
    this.shadows = [];   // [중심각, 반각, 바위까지 거리, 바위]
    for (const rk of rocks) {
      if (!rk.landed || rk.broken) continue;
      const d = dist(ox, oy, rk.tx, rk.ty);
      if (d <= rk.radius + 1) continue;
      this.shadows.push([Math.atan2(rk.ty - oy, rk.tx - ox), Math.asin(Math.min(1, rk.radius / d)), d, rk]);
    }
    // 맨 앞 바위만 참격을 맞는다

  }
  static ad(a, b) { return Math.abs(mod(a - b + Math.PI, TAU) - Math.PI); }
  blocked(ang, d, exclude = null) {
    for (const [a, half, rd, rk] of this.shadows) {
      if (rk === exclude) continue;
      if (d > rd && WindSlash.ad(ang, a) <= half) return true;
    }
    return false;
  }
  update(dt, g) {
    this.r += WindSlash.SPEED * dt;
    this.pending = this.pending.filter(s => {
      if (this.r < s[2] - s[3].radius) return true;
      const rk = s[3];
      rk.hits++;
      FX.burst(rk.tx, rk.ty, '#e8fbff', 10, 260, 0.3, 2.2);
      if (rk.hits >= Rock.MAX_HITS) { rk.broken = true; FX.burst(rk.tx, rk.ty, '#b7a4e8', 30, 400, 0.6, 3); FX.ring(rk.tx, rk.ty, 10, rk.radius * 1.3, 0.4, '#b7a4e8', 4); FX.shake(0.2, 0.6); }
      return false;
    });
    const p = g.player, dp = dist(this.ox, this.oy, p.x, p.y);
    if (!this.hitPlayer && this.r - WindSlash.THICK - p.r <= dp && dp <= this.r + p.r) {
      if (!this.blocked(Math.atan2(p.y - this.oy, p.x - this.ox), dp)) { this.hitPlayer = true; g.hurtPlayer(this.dmg); }
    }

  }
  draw() {
    if (this.r < 4) return;

    for (let i = 0; i <= n; i++) {
      const a = rad(i * step);
      if (this.blocked(a, this.r)) { if (run.length >= 2) runs.push(run); run = []; continue; }
      run.push([this.ox + Math.cos(a) * this.r, this.oy + Math.sin(a) * this.r]);
    }
    if (run.length >= 2) runs.push(run);
    const fade = Math.max(0.3, 1 - this.r / Math.max(1, this.maxR) * 0.6);
    for (const rn of runs) glowLine(rn, '#7fdcff', 7, fade);
  }
}

    poly(g, [[-11, 12], [-6, 8], [-2, 13], [2, 8], [6, 13], [11, 9]]); g.stroke();
  });
}

/** 돌진 경로 예고 ('lighter' 층). active = 실제 돌진 중 */
function drawChargeZone(x, y, dx, dy, len, w, active, k) {
  const px = -dy, py = dx, h = w / 2;
  const a = [x + px * h, y + py * h], b = [x - px * h, y - py * h];
  const c = [b[0] + dx * len, b[1] + dy * len], d = [a[0] + dx * len, a[1] + dy * len];
  poly(ctx, [a, d, c, b]); ctx.closePath();
  ctx.globalAlpha = active ? 0.45 : 0.12 + 0.2 * k; ctx.fillStyle = '#ff2a3c'; ctx.fill(); ctx.globalAlpha = 1;
  glowLine([a, d], '#ff5a6a', 1.5, active ? 1 : 0.4 + 0.5 * k);
  glowLine([b, c], '#ff5a6a', 1.5, active ? 1 : 0.4 + 0.5 * k);
  // 진행 방향으로 흐르는 화살표 무늬
  const off = (FX.time * 260) % 60;
  ctx.strokeStyle = '#ff8a94'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = active ? 0.8 : 0.25 + 0.45 * k;
  for (let s = off; s < len - 10; s += 60) {
    const cx = x + dx * s, cy = y + dy * s, q = h * 0.55;
    ctx.beginPath();
    ctx.moveTo(cx + px * q - dx * 14, cy + py * q - dy * 14); ctx.lineTo(cx + dx * 8, cy + dy * 8); ctx.lineTo(cx - px * q - dx * 14, cy - py * q - dy * 14);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** 네 귀퉁이 꺾쇠 모양 조준 고리 (현상수배 표적 표시) */
function drawReticle(x, y, R, rot, col, a, w = 3) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  const L = R * 0.42;
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(R - L, -R); ctx.lineTo(R, -R); ctx.lineTo(R, -R + L); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
/** 'lighter' 층: 돌진 예고, 보스 준비 동작 */
function drawMonsUnder(g) {
  for (const m of g.mons) {
    if (m.intro > 0) {   // 현상수배 표적 등장: 하늘에서 내려오는 빛기둥 + 좁혀지는 조준 고리
      const k = 1 - m.intro / Game.HUNT_INTRO, e = 1 - (1 - k) ** 3;
      const R = m.r * (4.2 - 2.6 * e), a = 0.35 + 0.65 * k;
      ctx.globalAlpha = a * 0.7;
      ctx.drawImage(beamSpr(), m.x - m.r * 1.3, m.y - VH, m.r * 2.6, VH);
      ctx.globalAlpha = 1;
      drawZone(HUNT_RED, m.x, m.y, R, a * 0.8);
      drawReticle(m.x, m.y, R * 1.12, k * 2.4, HUNT_RED, a, 4);
      continue;
    }
    if (m.kind === 'mini') {
      if (m.state === 'tele') drawChargeZone(m.x, m.y, m.aimX, m.aimY, m.speed * MINI.MULT * MINI.CHARGE * 60, MINI.WIDTH, false, 1 - m.timer / MINI.TELE);
      else if (m.state === 'charge') drawChargeZone(m.x, m.y, m.cdx, m.cdy, m.clen * (m.timer / MINI.CHARGE), MINI.WIDTH, true, 1);
    } else if (m.kind === 'boss') {
      if (m.state === 'tele') drawChargeZone(m.x, m.y, m.aimX, m.aimY, m.speed * BOSS.MULT * BOSS.CHARGE * 60, BOSS.WIDTH, false, 1 - m.timer / BOSS.TELE);
      else if (m.state === 'charge') drawChargeZone(m.x, m.y, m.cdx, m.cdy, m.clen * (m.timer / BOSS.CHARGE), BOSS.WIDTH, true, 1);
      else if (m.state === 'slam') { const k = 1 - m.timer / BOSS.SLAM_WINDUP; drawZone('#c8f0ff', m.x, m.y, m.r + 20 + 130 * k, 0.25 + 0.6 * k); }
      else if (m.state === 'summon') drawZone(C.ranged, m.x, m.y, m.r + 26 + 10 * Math.sin(FX.time * 20), 0.8);
      drawGlow(C.boss, m.x, m.y, m.r * 2.6, 0.35);
    } else if (m.kind === 'warden') {
      drawGlow(m.col, m.x, m.y, m.r * 2.2, 0.3);
      if (m.fireT < 0.35) drawZone(m.col, m.x, m.y, m.r + 8 + 30 * (1 - m.fireT / 0.35), 0.5);   // 탄막 직전 예고
    }
  }
}

/** 일반 합성 층: 몬스터 본체 + 체력바 */
function drawMons(g) {
  const p = g.player;
  for (const m of g.mons) {
    const pad = m.r + 30;
    if (m.intro > 0 || !g.inView(m.x, m.y, pad)) continue;   // 등장 연출 중에는 아직 보이지 않음
    const pop = m.age < 0.25 ? 0.4 + 2.4 * m.age : 1;   // 등장할 때 커지며 나타남
    // 바닥 그림자 (날아다니는 박쥐는 멀리 작게, 위아래로 흔들림)
    const bob = m.fly ? Math.sin(m.age * 5 + m.rot) * 4 - 6 : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y + m.r * (m.fly ? 1.15 : 0.82), m.r * (m.fly ? 0.6 : 0.88) * pop, m.r * (m.fly ? 0.22 : 0.32) * pop, 0, 0, TAU); ctx.fill();
    let rot = 0, sc = pop * m.r / MON[m.kind].r;   // 일반 몬스터는 90% 크기로 그림
    if (m.kind === 'straight') rot = m.rot;
    else if (m.kind === 'tracker') { rot = m.rot; sc *= 1 + 0.06 * Math.sin(m.age * 9 + m.x); }
    else if (m.kind === 'brute') { rot = m.rot; sc *= 1 + 0.03 * Math.sin(m.age * 4 + m.x); }
    else if (m.kind === 'ranged') sc *= 1 + 0.05 * Math.sin(m.age * 6);
    else if (m.kind === 'mini') rot = m.age * (m.state === 'chase' ? 0.7 : 4) + 0.001;
    else if (m.kind === 'boss') rot = m.age * (m.state === 'chase' ? 0.45 : 2.2) + 0.001;
    let fade = 1;
    if (m.flung) { rot += m.flung.spin * m.flung.t; fade = Math.max(0, 1 - m.flung.t / 0.9); if (fade <= 0) continue; }   // 에덴 폭격에 날아가는 중
    const key = monKey(m), s = monSpr(key), my = m.y + bob;
    ctx.globalAlpha = Math.min(1, pop) * fade;
    drawSpr(s, m.x, my, rot, sc);
    drawEye(m, p, m.x, my);
    if (m.kind === 'boss') {
      drawSpr(bossFaceSpr(), m.x, m.y, 0, 1);
      if (m.state === 'throw') { ctx.fillStyle = '#2a2438'; ctx.strokeStyle = '#a995e6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.x, m.y - m.r - 18, 15, 0, TAU); ctx.fill(); ctx.stroke(); }
    }
    if (m.flash > 0) {   // 맞으면 하얗게 번쩍
      ctx.globalAlpha = Math.min(0.7, m.flash / 0.1);
      drawSpr(whiteOf('m_' + key), m.x, my, rot, sc);
    }
    ctx.globalAlpha = 1;
    if (m.hp < m.maxHp && m.tier < 2) {   // 체력바는 다친 몬스터만
      const big = m.tier === 1, bw = big ? Math.max(56, m.r * 2) : Math.max(26, m.r * 1.8), bh = big ? 5 : 3, by = m.y - m.r - (big ? 16 : 10);
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(m.x - bw / 2 - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = m.col || MON[m.kind].col; ctx.fillRect(m.x - bw / 2, by, bw * clamp(m.hp / m.maxHp, 0, 1), bh);
    }
  }
}

// 플레이어
// =============================================================================
class Player {
  static INVULN = 0.35 * 1.4;   // 피격 후 무적 시간 (초) — 0.49초
  constructor(ci) {
    const c = CHARS[ci];
    this.ci = ci; this.r = 16;
    this.baseHp = c.hp; this.maxHp = c.hp; this.hp = c.hp; this.spd = c.spd;
    this.x = MAP_W / 2; this.y = MAP_H / 2;
    this.face = 0; this.hasTarget = false; this.invulnT = 0; this.kb = null; this.recoil = 0;
    this.level = 1; this.xp = 0; this.xpReq = xpRequired(1);
    this.skills = new Map();   // 무기 슬롯 (기본 무기 포함 최대 4개): id → 무기 객체
    this.buffs = new Map();    // 버프 슬롯 (최대 4개): id → 레벨(1~5)
    this.xpMult = 1; this.scoreMult = 1; this.dmgReduce = 0; this.runeSpd = 1;
    // 흡혈귀의 손톱 특성: 룬석 칸 +1 (5칸) + 흡혈 룬석 기본 장착 (5번 칸 고정)
    this.runes = new RuneSystem(this, ci === 2 ? 5 : 4);
    if (ci === 2) {
      const st = new RuneState('lifesteal'); st.fixed = true;
      this.runes.slots[4] = st; this.runes.obtained.add('lifesteal');
    }
    this.basicId = BASIC_IDS[ci];
    this.skills.set(this.basicId, new SKILLS[this.basicId]());
    this.recalc();
  }
  buffLv(id) { return this.buffs.get(id) || 0; }
  /** 경험치 오브를 끌어오는 거리 (자석 범위 증가 버프: 레벨당 +45%) */
  get pickupR() { return Game.XP_PICKUP * (1 + this.buffLv('magnet_up') * 0.45); }
  /** 보유 버프를 토대로 모든 스탯을 다시 계산 */
  recalc() {
    const atk = this.buffLv('atk_up'), spd = this.buffLv('spd_up'), rng = this.buffLv('range_up'), aoe = this.buffLv('aoe_up');
    const newMax = Math.round(this.baseHp * (1 + this.buffLv('hp_up') * 0.10)), diff = newMax - this.maxHp;
    this.maxHp = newMax; this.hp = Math.min(this.maxHp, this.hp + diff);
    this.dmgReduce = this.buffLv('def_up') * 0.09;
    this.xpMult = 1 + this.buffLv('xp_up') * 0.12;
    this.scoreMult = 1 + this.buffLv('score_up') * 0.10;
    for (const sk of this.skills.values()) {
      sk.cd = 1 - spd * 0.06; sk.area = 1 + aoe * 0.08; sk.atk = 1 + atk * 0.10;
      sk.rangeBonus = rng * 15; sk.aoeLv = aoe;
    }
  }
  /** 경험치 획득. 이번에 오른 레벨 수를 반환 */
  gainXp(amount) {
    this.xp += Math.round(amount * this.xpMult);
    let n = 0;
    while (this.xp >= this.xpReq) { this.xp -= this.xpReq; this.level++; this.xpReq = xpRequired(this.level); n++; }
    return n;
  }
  /** 슬롯 여유 / 최대 레벨 확인 (기본 무기는 처음 고른 것만, 융합 무기는 상자에서만) */
  canTake(id) {
    const it = ITEMS[id];
    if (it.type === 'skill') {
      if (this.skills.has(id)) return this.skills.get(id).level < it.max && !FUSIONS[id];
      if (BASIC_IDS.includes(id) || FUSIONS[id]) return false;
      return this.skills.size < MAX_WEAPONS;
    }
    if (this.buffs.has(id)) return this.buffs.get(id) < it.max;
    return this.buffs.size < MAX_BUFFS;
  }
  apply(id) {
    if (ITEMS[id].type === 'skill') {
      if (this.skills.has(id)) this.skills.get(id).upgrade(); else this.skills.set(id, new SKILLS[id]());
    } else this.buffs.set(id, this.buffLv(id) + 1);
    this.recalc();
  }
  /** 지금 얻을 수 있는 융합 무기 (재료 무기 두 개가 모두 5레벨) */
  fusionOptions() {
    return Object.keys(FUSIONS).filter(f => {
      const [a, b] = FUSIONS[f];
      return !this.skills.has(f) && this.skills.has(a) && this.skills.has(b) && this.skills.get(a).level >= 5 && this.skills.get(b).level >= 5;
    });
  }
  /** 재료 무기 두 개를 없애고 융합 무기 하나를 장착 (무기 칸 2개 → 1개) */
  applyFusion(f) {
    for (const id of FUSIONS[f]) this.skills.delete(id);
    this.skills.set(f, new SKILLS[f]());
    this.recalc();
  }
  move(dt) {
    let dx = 0, dy = 0, k = 1;
    if (keyHeld('left')) dx -= 1;
    if (keyHeld('right')) dx += 1;
    if (keyHeld('up')) dy -= 1;
    if (keyHeld('down')) dy += 1;
    if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
    else if (SET.mobile) { const j = joyVec(); if (j) { dx = j[0]; dy = j[1]; k = 0.35 + 0.65 * j[2]; } }   // 모바일 조이스틱 (살짝 밀면 천천히)
    if (dx || dy) this.moveAng = Math.atan2(dy, dx);   // 모바일 수동 조준: 마지막으로 움직인 방향
    const s = k * this.spd * (1 + this.buffLv('move_up') * 0.11) * this.runeSpd * dt * 60;
    this.x = Arena.cx(this.x + dx * s, this.r);
    this.y = Arena.cy(this.y + dy * s, this.r);
    this.moving = !!(dx || dy);
  }
}

  /** 보급 상자: 플레이어에게서 180px 이상 떨어진 곳 */
  spawnCrate() {
    const p = this.player;
    for (let t = 0; t < 20; t++) {
      const x = rand(Arena.x0 + 140, Arena.x1 - 140), y = rand(Arena.y0 + 140, Arena.y1 - 140);
      if (dist(x, y, p.x, p.y) >= 180) { this.mons.push(mkCrate(x, y)); return; }
    }
  }
  /** 친구 게임 적 스폰 (시간대별로 종류가 섞임) */
  spawnFriend(kind = null) {
    const p = this.player, mins = this.elapsed / 60, a = rand(0, TAU);
    if (!kind) {
      const r = Math.random();
      if (mins < 0.5) kind = r < 0.78 ? 'drone' : 'walker';
      else if (mins < 1.5) kind = r < 0.45 ? 'drone' : r < 0.78 ? 'walker' : 'hound';
      else kind = r < 0.35 ? 'drone' : r < 0.62 ? 'walker' : r < 0.82 ? 'hound' : r < 0.93 ? 'tank' : 'artillery';
    }
    this.mons.push(mkFriend(kind, Arena.cx(p.x + Math.cos(a) * Game.FRIEND_DIST, 50), Arena.cy(p.y + Math.sin(a) * Game.FRIEND_DIST, 50), this.elapsed));
  }
  /** 중간보스: 내 중간보스 / 워든(친구 보스) 중 랜덤. 체력은 둘이 공유하며 등장할 때마다 오른다 */
  spawnMiniboss(x, y) {
    const hp = this.miniHp;
    this.miniHp = nextBossHp(hp);
    const m = Math.random() < 0.5 ? mkMini(x, y, this.trackerSpeed(), hp) : mkWarden(x, y, hp, this.miniCount);
    this.mons.push(m);
    this.markHunt(m, this.miniCount);
    this.miniCount++;
    sfx('warn');
  }
  /** EMP: 화면 안 일반 적에게 200, 보스·중간보스에게 최대 체력의 15% + 적 탄 제거 */
  emp() {
    const p = this.player;
    for (const m of this.mons) {
      if (m.kind === 'crate' || !this.inView(m.x, m.y, m.r)) continue;
      const d = m.tier > 0 ? m.maxHp * Game.EMP_BOSS : Game.EMP_DMG;
      this.addDmg('emp', Math.min(Math.max(0, m.hp), d));
      m.hp -= d;
    }
    this.ebullets.length = 0;
    FX.ring(p.x, p.y, 20, 760, 0.55, '#ff4757', 8); FX.ring(p.x, p.y, 10, 480, 0.7, '#ffd84a', 4);
    FX.burst(p.x, p.y, '#ff6a5a', 50, 650, 0.6, 3);
    if (SET.flash) this.flashT = Game.FLASH_DUR * 0.4;
    FX.shake(0.8); FX.stop(0.08); sfx('nova');
    this.banner('EMP 충격파!', '#ff4757');
  }

  // ---- 조회 헬퍼 ----
  inView(x, y, pad = 0) { const c = this.cam; return x >= c.x - pad - 24 && x <= c.x + VW + pad + 24 && y >= c.y - pad - 24 && y <= c.y + VH + pad + 24; }
  countKind(k) { let n = 0; for (const m of this.mons) if (m.kind === k) n++; return n; }
  bosses() { return this.mons.filter(m => m.kind === 'boss'); }
  nearest(x, y, maxR = Infinity) {
    let best = null, bd = maxR * maxR;
    for (const m of this.mons) { if (m.kind === 'crate') continue; const d = (m.x - x) ** 2 + (m.y - y) ** 2; if (d <= bd) { bd = d; best = m; } }
    return best;
  }
  /** 직선 몬스터 이동속도: 90초까지 2, 이후 30초마다 +0.5, 최대 8.5 (웨이브 중 +1) */
  monsterSpeed() {
    const base = this.elapsed <= 90 ? 2 : Math.min(2 + Math.floor((this.elapsed - 90) / 30) * 0.5, 8.5);
    return base + (this.inWave ? 1 : 0);
  }
  trackerSpeed() { return 2; }
  rangedSpeed() { return Math.floor(this.trackerSpeed() * 0.8); }

  // ---- 넉백 ----
  /** (ox,oy)에서 멀어지는 방향으로 distance만큼 부드럽게 밀어낸다. 보스류는 절반 */
  knockback(m, ox, oy, distance, dur = 0.3) {
    let dx = m.x - ox, dy = m.y - oy, l = Math.hypot(dx, dy);
    if (l < 0.001) { const a = rand(0, TAU); dx = Math.cos(a); dy = Math.sin(a); l = 1; }
    if (m.kind === 'crate' || m.kind === 'brute') return;   // 탱커 '철갑 추적체'는 넉백을 받지 않음 (경계선도 뚫고 들어옴)
    if (m.tier > 0) distance *= 0.25;   // 보스·중간보스는 1/4만 (예전 절반의 절반)
    m.kb = [dx / l, dy / l, distance, 0, dur, 0];   // [방향x, 방향y, 총거리, 경과, 지속, 이동한 비율]
  }
  _stepKb(o, dt, pad) {
    const kb = o.kb;
    kb[3] = Math.min(kb[4], kb[3] + dt);
    const f = 1 - (1 - kb[3] / kb[4]) ** 2, step = kb[2] * (f - kb[5]);   // 처음엔 빠르게, 끝에서 느리게
    kb[5] = f;
    o.x = Arena.cx(o.x + kb[0] * step, pad); o.y = Arena.cy(o.y + kb[1] * step, pad);
    if (kb[3] >= kb[4]) o.kb = null;
  }

  /** 보스가 살아 있는 동안만 전투 구역을 2/3로 줄인다 */
  updateArena() {
    const boss = this.countKind('boss') > 0, p = this.player;
    if (boss && !this.arenaBoss) {
      this.arenaBoss = true;
      Arena.setBox(p.x, p.y);
      for (const it of [...this.chests, ...this.drops, ...this.orbs]) { it.x = Arena.cx(it.x, 30); it.y = Arena.cy(it.y, 30); }
      this.banner('보스전! 전투 구역이 좁아졌어요', C.boss);
    } else if (!boss && this.arenaBoss) {
      this.arenaBoss = false;
      Arena.setFull();
      this.banner('전투 구역 해제', C.bandage);
    }
    if (Arena.limited()) {   // 구역 밖의 추적형·원거리형·보스류는 벽 안쪽으로 (돌진형은 벽에 닿으면 사라짐)
      for (const m of this.mons) if (m.kind !== 'straight' && m.kind !== 'crate') { m.x = Arena.cx(m.x, m.r); m.y = Arena.cy(m.y, m.r); }
    }
  }
  onWheel(dy) {   // 휠 위 = 앞 칸, 휠 아래 = 다음 칸 (끝에서 돌아감)
    if (this.weaponSel || this.levelup || this.over || this.paused || !dy) return;
    const rs = this.player.runes, n = rs.slots.length;
    rs.select(mod(rs.selected + (dy < 0 ? -1 : 1), n));
  }

  // ---- 플레이어 피격 ----
  /** 시간 강화 배율 */
  get atkMult() { return 1 + Game.ATK_PER_MIN * this.elapsed / 60; }
  get spawnMult() { return 1 + Game.SPAWN_PER_MIN * this.elapsed / 60; }
  hurtPlayer(dmg) {
    if (this.rescue || this.over) return;   // 구출 중에는 피해 없음
    dmg *= this.atkMult;   // 몬스터가 주는 모든 피해는 시간이 지날수록 강해짐
    if (this.elapsed < Game.EARLY_TIME) dmg *= Game.EARLY_DMG;   // 초반(2분 전)에는 몸통·탄환 피해 3/4
    const p = this.player;
    if (p.invulnT > 0 || p.runes.isInvulnerable()) return;
    if (p.runes.absorb()) {   // 보호막이 막음
      p.invulnT = Player.INVULN;
      FX.burst(p.x, p.y, '#aee1ff', 14, 280, 0.3, 2.4); FX.ring(p.x, p.y, 20, 60, 0.25, '#aee1ff', 3);
      FX.shake(0.25, 0.6); sfx('block');
      return;
    }
    const actual = Math.max(1, Math.round(dmg * (1 - Math.min(p.dmgReduce, 0.5))));   // 피해 감소는 최대 50%
    p.hp = Math.max(0, p.hp - actual);
    p.invulnT = Player.INVULN;
    this.hurtFlash = 1;
    FX.burst(p.x, p.y, C.red, 16, 320, 0.35, 2.6);
    FX.shake(0.45); FX.stop(0.05); sfx('hurt');
    if (p.hp <= 0) { if (this.mode === 'ranked') this.endGame(); else this.startRescue(); }   // 랭킹전에는 구출이 없음
  }
  pushPlayer(ox, oy, distance, dur = 0.22) {
    const p = this.player;
    let dx = p.x - ox, dy = p.y - oy, l = Math.hypot(dx, dy);
    if (l < 0.001) { const a = rand(0, TAU); dx = Math.cos(a); dy = Math.sin(a); l = 1; }
    p.kb = [dx / l, dy / l, Math.max(0, distance), 0, dur, 0];
  }
  endGame() {
    if (this.over) return;
    const v = this.mode === 'ranked' ? this.score : this.rescue ? this.rescue.value : this.elapsed;
    this.over = { t: 0, value: v, qualifies: Boards[this.mode].qualifies(v), submitted: false, rank: -1, rescued: !!this.rescue };
    FX.hitstop = 0;
    if (!this.rescue) {   // 랭킹전: 쓰러짐
      const p = this.player;
      FX.burst(p.x, p.y, C.player, 70, 620, 0.9, 3.2); FX.burst(p.x, p.y, '#ffffff', 30, 380, 0.6, 2.6);
      FX.ring(p.x, p.y, 10, 220, 0.6, C.player, 6); FX.ring(p.x, p.y, 10, 420, 0.9, '#ffffff', 3);
      FX.shake(1); sfx('over');
    }
    App.onGameOver(this);
  }

  // ---- 에덴의 구출 (무한 생존: 체력이 0이 되면) ---------------------------------------
  //   체력 1로 버티는 순간 시간이 멈추고 → 에덴 본부의 폭격이 주변을 쓸어버리고
  //   → 하늘에서 구출 광선이 내려와 플레이어를 끌어올린 뒤 → 결과 화면
  static RESCUE = { STRIKE0: 0.75, STRIKE_GAP: 0.17, STRIKES: 9, FINAL: 2.55, BEAM: 3.0, LIFT: 3.35, LIFT_DUR: 1.0, END: 4.9, WARN: 0.6 };
  startRescue() {
    if (this.rescue || this.over) return;
    const p = this.player, R = Game.RESCUE;
    p.hp = 1; p.kb = null;
    const strikes = [];
    for (let i = 0; i < R.STRIKES; i++) {   // 플레이어를 빙 둘러 차례로 떨어지는 폭격
      const a = i * 2.39996 + rand(-0.3, 0.3), d = 150 + (i % 3) * 110 + rand(0, 60);
      strikes.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d * 0.8, r: 150, at: R.STRIKE0 + i * R.STRIKE_GAP, hit: false });
    }
    this.rescue = { t: 0, value: this.elapsed, strikes, final: false, flung: [], lift: 0 };
    this.huntCards = [];
    FX.burst(p.x, p.y, '#ffffff', 24, 300, 0.4, 2.4); FX.ring(p.x, p.y, 10, 90, 0.4, '#ff4d6a', 4);
    FX.shake(0.6); FX.stop(0.12); sfx('warn');
  }
  /** 폭발: 가까운 일반 적은 터지고, 바깥쪽과 보스류는 날아간다 */
  rescueBlast(x, y, R, final = false) {
    const r = this.rescue;
    let bursts = 0;
    for (const m of this.mons) {
      if (m.dead || m.kind === 'crate') continue;
      const d = dist(x, y, m.x, m.y);
      if (!final && d > R + m.r) continue;
      if (final && !this.inView(m.x, m.y, 200)) continue;
      const col = m.col || MON[m.kind].col;
      if (m.tier === 0 && (final || d < R * 0.75)) {   // 터짐
        m.dead = true;
        if (bursts++ < 40) FX.burst(m.x, m.y, col, 8, 260, 0.4, 2.4);
      } else if (!m.flung) {   // 날아감
        let dx = m.x - x, dy = m.y - y, l = Math.hypot(dx, dy) || 1;
        const sp = (m.tier ? 900 : 1300) * rand(0.8, 1.2);
        m.flung = { vx: dx / l * sp, vy: dy / l * sp, spin: rand(-14, 14), t: 0 };
        r.flung.push(m);
      }
    }
    this.mons = this.mons.filter(m => !m.dead);
    this.ebullets.length = 0;
    if (final) { this.rocks = []; this.slashes = []; this.bossFire = []; }
  }
  updateRescue(dt) {
    const r = this.rescue, p = this.player, R = Game.RESCUE;
    r.t += dt;
    if (p.invulnT > 0) p.invulnT = Math.max(0, p.invulnT - dt);
    for (const s of r.strikes) {
      if (s.hit || r.t < s.at) continue;
      s.hit = true;
      this.rescueBlast(s.x, s.y, s.r);
      FX.ring(s.x, s.y, 20, s.r * 1.4, 0.45, '#ffb347', 7); FX.ring(s.x, s.y, 10, s.r * 0.8, 0.3, '#ffffff', 4);
      FX.burst(s.x, s.y, '#ff8a3d', 34, 520, 0.6, 3.2); FX.burst(s.x, s.y, '#fff2b0', 14, 300, 0.35, 2.6);
      FX.shake(0.55); sfx('boom');
    }
    if (!r.final && r.t >= R.FINAL) {   // 마지막 대폭격: 화면 안 모든 적
      r.final = true;
      this.rescueBlast(p.x, p.y, 9999, true);
      FX.ring(p.x, p.y, 30, 900, 0.8, '#ffb347', 10); FX.ring(p.x, p.y, 20, 620, 0.6, '#ffffff', 5);
      FX.burst(p.x, p.y, '#ff8a3d', 80, 900, 0.9, 3.6);
      if (SET.flash) this.flashT = Game.FLASH_DUR * 0.5;
      FX.shake(1); FX.stop(0.15); sfx('nova');
    }
    for (const m of r.flung) {   // 날아가는 적: 빙글빙글 돌며 멀어짐
      const f = m.flung;
      f.t += dt; m.x += f.vx * dt; m.y += f.vy * dt; f.vx *= Math.pow(0.25, dt); f.vy *= Math.pow(0.25, dt);
    }
    if (r.t >= R.BEAM && !r.beamOn) { r.beamOn = true; sfx('rune'); FX.ring(p.x, p.y, 10, 120, 0.6, '#7dffb0', 5); }
    r.lift = clamp((r.t - R.LIFT) / R.LIFT_DUR, 0, 1);
    if (r.lift >= 1 && !r.gone) { r.gone = true; FX.burst(p.x, p.y - 70, '#7dffb0', 40, 360, 0.6, 2.6); FX.ring(p.x, p.y - 70, 10, 160, 0.5, '#eaffff', 4); sfx('pickup'); }
    FX.update(dt); this.updatePopups(dt);
    if (r.t >= R.END) this.endGame();
  }

  // ---- 스폰 ----
  pickSpawnPoint() {
    const p = this.player;
    for (let i = 0; i < 50; i++) {
      const x = rand(Arena.x0 + 80, Arena.x1 - 80), y = rand(Arena.y0 + 80, Arena.y1 - 80);
      if (dist(x, y, p.x, p.y) >= Game.MIN_DIST) return [x, y];
    }
    return null;
  }
  /** 기준점 주변에 서로 겹치지 않게 흩어진 좌표들 */
  spread(bx, by, count, gap) {
    const out = [];
    for (let n = 0; n < count; n++) {
      let placed = false;
      for (let at = 0; at < 12 && !placed; at++) {
        const a = rand(0, TAU), r = rand(0, 20 + at * 18), x = bx + Math.cos(a) * r, y = by + Math.sin(a) * r;
        if (out.every(o => dist(x, y, o[0], o[1]) >= gap)) { out.push([x, y]); placed = true; }
      }
      if (!placed) { const a = rand(0, TAU), r = rand(0, 20 + 12 * 18); out.push([bx + Math.cos(a) * r, by + Math.sin(a) * r]); }
    }
    return out;
  }
  /** 웨이브 중에는 세 군데에서 동시에 스폰 */
  spawnGroups(kind) {
    const p = this.player, groups = this.inWave ? 3 : 1;
    for (let k = 0; k < groups; k++) {
      if (this.mons.length >= Game.MAX_MONS) return;
      const pt = this.pickSpawnPoint();
      if (!pt) continue;
      const n = randi(2, 3);   // 몬스터 종류가 늘어난 만큼 한 무리는 2~3마리
      for (const [sx, sy] of this.spread(pt[0], pt[1], n, 26)) {
        const x = Arena.cx(sx, 1), y = Arena.cy(sy, 1);
        this.mons.push(kind === 'straight' ? mkStraight(x, y, p.x, p.y, this.monsterSpeed()) : mkTracker(x, y, this.trackerSpeed(), this.elapsed));
      }
    }
  }
  spawnBoss(x, y) {
    const m = mkBoss(x, y, this.trackerSpeed(), this.bossHp);
    this.mons.push(m);
    this.bossHp = nextBossHp(this.bossHp);
    this.markHunt(m, this.bossCount++);
    sfx('boss'); FX.shake(0.5);
  }

  // ---- 현상수배 표적 (중간보스 / 보스) ----
  /** 등장: 이름·위험도를 붙이고, 조준 고리가 좁혀진 뒤 내려꽂히며, 화면 아래에 수배 전단을 띄운다 */
  markHunt(m, no) {
    const info = m.kind === 'warden' ? { name: m.name, title: WARDEN_TITLES[m.variant] } : HUNT_INFO[m.kind];
    const stars = m.tier === 2 ? Math.min(5, 3 + Math.floor(no / 2)) : Math.min(4, 2 + Math.floor(no / 3));
    m.hunt = { name: info.name, title: info.title, stars, no: no + 1 };
    m.intro = Game.HUNT_INTRO;
    this.pushHuntCard(m, false);
  }
  huntLand(m) {   // 착지: 충격파 + 화면 흔들림
    const col = m.col || MON[m.kind].col, big = m.tier === 2;
    FX.ring(m.x, m.y, m.r * 0.6, m.r * (big ? 5.5 : 4.5), 0.55, HUNT_RED, 6);
    FX.ring(m.x, m.y, 10, m.r * 2.6, 0.4, '#ffffff', 3);
    FX.burst(m.x, m.y, col, big ? 60 : 36, 460, 0.6, 3);
    FX.shake(big ? 0.75 : 0.5); FX.stop(big ? 0.12 : 0.07); sfx('thud');
  }
  huntDone(m) {
    if (!m.hunt) return;
    this.huntCards = this.huntCards.filter((c, i) => i === 0 || c.m !== m);   // 아직 안 뜬 등장 전단은 생략
    const cur = this.huntCards[0];
    if (cur && cur.m === m && !cur.done) cur.age = Math.max(cur.age, Game.HUNT_CARD_DUR - 0.32);   // 떠 있는 등장 전단은 바로 내려감
    this.pushHuntCard(m, true);
  }
  pushHuntCard(m, done) {
    this.huntCards.push({ m, key: monKey(m), col: m.col || MON[m.kind].col, ...m.hunt, hp: m.maxHp, boss: m.tier === 2, done, age: 0 });
    if (this.huntCards.length > 3) this.huntCards.splice(1, 1);
  }

  // ---- 무기별 누적 데미지 ----
  addDmg(id, v) {
    if (!(v > 0)) return;
    this.dmg[id] = (this.dmg[id] || 0) + v;
    if (this.dmgFirst[id] === undefined) this.dmgFirst[id] = this.elapsed;
  }
  /** fn 동안 몬스터 체력이 줄어든 만큼을 id의 피해로 기록 (넘친 피해는 빼고, 광폭화 배율은 여기서 적용) */
  trackDmg(id, fn, mult = 1) {
    const mons = this.mons;
    for (const m of mons) m._t0 = m.hp;
    fn();
    let sum = 0;
    for (const m of mons) {
      const raw = m._t0 - m.hp;
      if (!(raw > 0)) continue;
      if (mult > 1) m.hp -= raw * (mult - 1);
      if (m.kind !== 'crate') sum += Math.min(Math.max(0, m._t0), raw * mult);
    }
    this.addDmg(id, sum);
  }
  /** 표에 쓸 정렬된 목록: [id, 피해, 초당 피해] */
  dmgRows() {
    return Object.entries(this.dmg).map(([id, v]) => [id, v, v / Math.max(1, this.elapsed - this.dmgFirst[id])]).sort((a, b) => b[1] - a[1]);
  }
  banner(text, col) { this.banners.push({ text, col, age: 0 }); if (this.banners.length > 4) this.banners.shift(); }

  // ---- 처치 보상 ----
  addOrb(x, y, v = Game.XP_VALUE) {
    if (this.orbs.length >= Game.MAX_ORBS) { this.orbs[randi(0, this.orbs.length - 1)].v += v; return; }
    this.orbs.push({ x, y, v, magnet: false, ph: rand(0, TAU) });
  }
  /** 확률에 따라 자석/붕대를 떨어뜨린다. 흡혈 룬석이 있으면 확률적으로 회복 */
  onMonsterKilled(x, y, bandageOnly = false) {
    this.player.runes.onKill(this, x, y);
    const roll = Math.random();
    if (bandageOnly) { if (roll < Game.BANDAGE_CHANCE) this.drops.push({ kind: 'bandage', x, y, age: 0 }); return; }
    if (roll < Game.MAGNET_CHANCE) this.drops.push({ kind: 'magnet', x, y, age: 0 });
    else if (roll < Game.MAGNET_CHANCE + Game.BANDAGE_CHANCE) this.drops.push({ kind: 'bandage', x, y, age: 0 });
    else if (roll < Game.MAGNET_CHANCE + Game.BANDAGE_CHANCE + Game.EMP_CHANCE) this.drops.push({ kind: 'emp', x, y, age: 0 });
  }
  onDeath(m) {
    const p = this.player, col = m.col || MON[m.kind].col, vis = this.inView(m.x, m.y, 60);
    if (m.kind === 'crate') {   // 보급 상자: 자석 35% / 붕대 37% / EMP 28%
      if (Math.random() < Game.CRATE_XP_CHANCE) this.addOrb(m.x, m.y, Game.CRATE_XP);   // 꽝: 경험치만
      else {   // 나머지 20%: 자석 35% / 붕대 37% / EMP 28% (전체로는 7 / 7.4 / 5.6%)
        const r = Math.random();
        this.drops.push({ kind: r < 0.35 ? 'magnet' : r < 0.72 ? 'bandage' : 'emp', x: m.x, y: m.y, age: 0 });
      }
      this.crateTimers.push(Game.CRATE_RESPAWN);
      FX.burst(m.x, m.y, C.gold, 14, 260, 0.4, 2.4); FX.burst(m.x, m.y, '#ffffff', 6, 180, 0.25, 2);
      sfx('kill');
      return;
    }
    this.kills++; this.combo++; this.comboT = Game.COMBO_TIME;
    switch (m.kind) {
      case 'drone': case 'walker': case 'hound': case 'tank': case 'artillery':   // 친구 적: 경험치는 친구 게임 값
        this.score += Math.round(100 * p.scoreMult); this.addOrb(m.x, m.y, m.xp); this.onMonsterKilled(m.x, m.y);
        break;
      case 'straight': case 'tracker':
        this.score += Math.round(100 * p.scoreMult); this.addOrb(m.x, m.y); this.onMonsterKilled(m.x, m.y);
        break;
      case 'brute':
        this.score += Math.round(BRUTE.SCORE * p.scoreMult); this.addOrb(m.x, m.y, BRUTE.XP); this.onMonsterKilled(m.x, m.y);
        if (vis) { FX.burst(m.x, m.y, '#ffe1a0', 16, 320, 0.45, 2.6); FX.shake(0.15); }
        break;
      case 'ranged':   // 경험치 없음, 붕대만
        this.score += Math.round(RANGED.SCORE * p.scoreMult); this.onMonsterKilled(m.x, m.y, true);
        break;
      case 'mini': case 'warden':   // 중간보스 두 종류 모두 같은 보상
        this.score += Math.round(300 * p.scoreMult);
        this.addOrb(m.x - 8, m.y); this.addOrb(m.x + 8, m.y);
        this.onMonsterKilled(m.x, m.y);
        this.spawnChestAt(m.x, m.y, 'miniboss');
        FX.burst(m.x, m.y, col, 45, 520, 0.7, 3); FX.ring(m.x, m.y, 20, 160, 0.5, col, 5);
        this.huntDone(m);
        FX.shake(0.5); FX.stop(0.1); sfx('boom');
        break;
      case 'boss':
        this.score += Math.round(BOSS.SCORE * p.scoreMult);
        for (let i = 0; i < 10; i++) this.addOrb(m.x + rand(-40, 40), m.y + rand(-40, 40));
        p.runes.onKill(this, m.x, m.y);
        this.spawnChestAt(m.x, m.y, 'boss');   // 확정 드롭: 보물상자 + 붕대 + 자석
        this.drops.push({ kind: 'bandage', x: m.x - 45, y: m.y + 30, age: 0 }, { kind: 'magnet', x: m.x + 45, y: m.y + 30, age: 0 });
        this.huntDone(m);
        FX.burst(m.x, m.y, col, 110, 760, 1.0, 3.6); FX.burst(m.x, m.y, '#ffffff', 40, 480, 0.7, 3);
        FX.ring(m.x, m.y, 30, 320, 0.7, col, 8); FX.ring(m.x, m.y, 20, 520, 1.0, '#ffffff', 3);
        FX.shake(1); FX.stop(0.22); sfx('nova');
        break;
    }
    if (vis && m.tier === 0) {
      FX.burst(m.x, m.y, col, 7, 240, 0.35, 2.2);
      FX.ring(m.x, m.y, m.r * 0.5, m.r * 1.9, 0.22, col, 2);
      sfx('kill');
    }
  }

  // ---- 보물상자 / 룬석 ----
  /** 줄 수 있는 것(룬석 / 보스류 상자라면 융합 무기)이 있을 때만 상자를 만든다 */
  canSpawnChest(source) {
    const p = this.player;
    if (source !== 'wave' && p.fusionOptions().length) return true;
    const rs = p.runes, hasFree = rs.count() + this.chests.length < rs.slots.length;
    return rs.offerPool(hasFree).length > 0;
  }
  spawnChestAt(x, y, source = 'wave') {
    if (!this.canSpawnChest(source)) return;
    this.chests.push({ x: Arena.cx(x, 40), y: Arena.cy(y, 40), age: 0, source });
  }
  /** 룬석 하나를 준다 (이미 가진 소모성이면 횟수 증가) */
  grantRune() {
    const rs = this.player.runes, id = rs.rollNew();
    if (!id) return false;
    const added = rs.stack(id);   // 룬석은 바로 적용되고, 화면에는 뒤집기 연출로 보여 준다
    if (added) { this.revealQueue.push({ id, stack: added, uses: rs.get(id).usesLeft, slot: rs.slots.indexOf(rs.get(id)) }); return true; }
    if (rs.add(id)) { this.revealQueue.push({ id, stack: 0, uses: 0, slot: rs.slots.indexOf(rs.get(id)) }); return true; }
    return false;
  }
  /**
   * 상자에 다가가면 열린다.
   *  - 중간보스 상자: 융합 조건을 채웠다면 룬석 대신 융합 무기
   *  - 보스 상자    : 융합 조건을 채웠다면 융합 무기 + 룬석
   *  - 그 외        : 룬석
   */
  updateChests(dt) {
    const p = this.player;
    this.chests = this.chests.filter(c => {
      c.age += dt;
      if (dist(c.x, c.y, p.x, p.y) >= Game.CHEST_PICKUP) return true;
      let opened = false;
      if (c.source !== 'wave' && p.fusionOptions().length) {
        this.fusionQueue.push(c.source);
        this.banner('융합 무기 획득!', C.fusion);
        if (c.source === 'boss') this.grantRune();
        opened = true;
      } else opened = this.grantRune();
      if (opened) { FX.burst(c.x, c.y, C.gold, 40, 420, 0.7, 3); FX.ring(c.x, c.y, 10, 140, 0.5, C.gold, 5); sfx('chest'); }
      return !opened;
    });
  }

  // ---- 몬스터끼리 겹치지 않게 밀어내기 (격자로 이웃만 검사) ----
  separate() {
    const mons = this.mons;
    if (mons.length < 2) return;
    const cell = Game.SEP_CELL, grid = new Map();
    for (const m of mons) {
      const k = (Math.floor(m.x / cell) + 4) * 512 + Math.floor(m.y / cell) + 4;
      let a = grid.get(k); if (!a) grid.set(k, a = []);
      a.push(m);
    }
    const NB = [1, 512 - 1, 512, 512 + 1];   // 아래(1), 오른쪽 위/옆/아래 → 모든 쌍을 한 번씩
    for (const [k, bucket] of grid) {
      for (let i = 0; i < bucket.length; i++) {
        const a = bucket[i], wa = MON[a.kind].weight;
        for (let j = i + 1; j < bucket.length; j++) this._sep(a, bucket[j], wa);
        for (const o of NB) { const nb = grid.get(k + o); if (nb) for (const b of nb) this._sep(a, b, wa); }
      }
    }
  }
  _sep(a, b, wa) {
    const wb = MON[b.kind].weight, need = a.r + b.r;
    if (wa + wb === 0) return;   // 둘 다 고정 (상자끼리)
    let dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) >= need || Math.abs(dy) >= need) return;
    const d2 = dx * dx + dy * dy;
    if (d2 >= need * need) return;
    let d = Math.sqrt(d2);
    if (d < 0.001) { const an = rand(0, TAU); dx = Math.cos(an); dy = Math.sin(an); d = 1; }
    const push = (need - d) * Game.SEP_STRENGTH, nx = dx / d, ny = dy / d, tot = wa + wb;
    a.x -= nx * push * wa / tot; a.y -= ny * push * wa / tot;
    b.x += nx * push * wb / tot; b.y += ny * push * wb / tot;
  }

  // ---- 데미지 숫자 ----
  // 이번 프레임에 체력이 줄어든 만큼 숫자를 띄운다 (어떤 무기로 맞았는지와 무관하게 동작)
  // 작은 데미지일수록 작고 짧게: tier 0 (1~3) / 1 (4~5) / 2 (6~12) / 3 (13+)
  collectDamage() {
    const TIER = [{ dur: 0.45, pop: 4, fade: 0.15 }, { dur: 0.6, pop: 6, fade: 0.2 }, { dur: 0.8, pop: 10, fade: 0.3 }, { dur: 0.9, pop: 12, fade: 0.35 }];
    for (const m of this.mons) {
      const lost = m.lastHp - m.hp;
      m.lastHp = m.hp;
      if (lost < 0.5 || !this.inView(m.x, m.y, 20)) continue;
      const amt = Math.max(1, Math.round(lost)), tier = amt <= 3 ? 0 : amt <= 5 ? 1 : amt <= 12 ? 2 : 3;
      m.flash = 0.1;
      if (tier >= 2 || Math.random() < 0.4) FX.burst(m.x, m.y, '#ffffff', tier >= 2 ? 3 : 1, 170, 0.18, 1.6);
      sfx('hit');
      if (this.popups.length > 140 && tier < 2) continue;
      this.popups.push(Object.assign({ x: m.x + rand(-6, 6), y: m.y - m.r - (m.kind === 'boss' ? 40 : 10), amt, col: '#fff08a', tier, age: 0 }, TIER[tier]));
    }
    const p = this.player, lost = this.prevHp - p.hp;
    if (lost > 0) this.popups.push(Object.assign({ x: p.x + rand(-6, 6), y: p.y - p.r - 38, amt: lost, col: '#ff5a5a', tier: 3, age: 0 }, TIER[2]));
    this.prevHp = p.hp;
  }
  updatePopups(dt) {
    let j = 0;
    for (const d of this.popups) { d.age += dt; if (d.age < d.dur) this.popups[j++] = d; }
    this.popups.length = j;
  }

  // ---- 레벨업 ----
  static REROLLS = 1;   // 레벨업 화면 한 번에 쓸 수 있는 리롤 횟수
  /** 증강을 3번 고를 때마다 회복하는 양 (흡혈귀의 손톱 15, 나머지 10) */
  pickHeal() { return this.player.ci === 2 ? 15 : 10; }
  /** '체력 회복' 증강 카드의 회복량 (흡혈귀의 손톱 20, 나머지 15) */
  healCardAmount() { return this.player.ci === 2 ? 20 : 15; }
  /** 무기 4칸 + 버프 4칸이 모두 찼는지 */
  slotsFull() { const p = this.player; return p.skills.size >= MAX_WEAPONS && p.buffs.size >= MAX_BUFFS; }
  heal(n, col) {
    const p = this.player, before = p.hp;
    p.hp = Math.min(p.maxHp, p.hp + n);
    this.prevHp = p.hp;
    const got = p.hp - before;
    if (got > 0) this.popups.push({ x: p.x, y: p.y - p.r - 38, amt: got, col, tier: 3, age: 0, dur: 0.9, pop: 12, fade: 0.4, heal: true });
    FX.burst(p.x, p.y, col, 14, 220, 0.5, 2.2); FX.ring(p.x, p.y, 10, 60, 0.35, col, 3);
  }
  /**
   * 스킬+버프를 하나의 풀에서 섞어 최대 3개.
   * 슬롯이 모두 찬 뒤에는 10레벨마다 '체력 회복' 카드가 한 장 끼어든다.
   * avoid: 리롤할 때 방금 나온 아이템은 가능하면 피한다
   */
  buildOffers(lv, avoid = []) {
    const p = this.player, pool = [];
    for (const id of ITEM_ORDER) {
      if (this.offerExclude.has(id) || !p.canTake(id)) continue;
      pool.push([id, ITEMS[id].type === 'skill' ? (p.skills.has(id) ? p.skills.get(id).level : 0) : p.buffLv(id)]);
    }
    shuffle(pool);
    const fresh = pool.filter(o => !avoid.includes(o[0])), used = pool.filter(o => avoid.includes(o[0]));
    const healCard = this.slotsFull() && lv % Game.HEAL_CARD_LV === 0;
    return fresh.concat(used).slice(0, healCard ? 2 : 3).concat(healCard ? [['heal', 0]] : []);
  }
  /** 리롤: 남은 횟수가 있고 다른 아이템이 나올 수 있을 때만 */
  canReroll() {
    const lu = this.levelup;
    if (!lu || lu.kind !== 'levelup' || lu.rerolls <= 0) return false;
    let n = 0; for (const id of ITEM_ORDER) if (!this.offerExclude.has(id) && this.player.canTake(id)) n++;
    return n > lu.offers.filter(o => o[0] !== 'heal').length;
  }
  reroll() {
    const lu = this.levelup;
    if (!this.canReroll() || lu.t < 0.25) return;
    lu.rerolls--;
    lu.offers = this.buildOffers(lu.lv, lu.offers.map(o => o[0]));
    lu.t = 0.2;   // 카드가 다시 떠오르는 연출 (0.25초 전에는 선택 불가)
    sfx('click');
  }
  choose(i) {
    const lu = this.levelup;
    if (!lu || lu.t < 0.25 || !lu.offers[i]) return;   // 열리자마자 잘못 누르는 것 방지
    const id = lu.offers[i][0], p = this.player;
    if (lu.kind === 'fusion') { p.applyFusion(id); this.banner(`융합: ${itemName(id)}`, C.fusion); }
    else if (id === 'heal') this.heal(this.healCardAmount(), C.bandage);   // 체력 회복 카드 (고를 때 회복은 따로 없음)
    else p.apply(id);
    if (lu.kind === 'levelup' && id !== 'heal' && ++this.augPicks % Game.HEAL_EVERY === 0) this.heal(this.pickHeal(), C.bandage);   // 증강 3번째마다 회복
    this.levelup = null;
    FX.ring(p.x, p.y, 10, 120, 0.4, ITEM_COLORS[id], 4); FX.burst(p.x, p.y, ITEM_COLORS[id], 20, 300, 0.45, 2.4);
    sfx('pickup');
  }

  // ---- 룬석 뒤집기 ----
  //  back(뒷면) → 클릭하거나 옆으로 드래그 → flip(돌아가며 뒤집힘) → shown(설명) → 클릭/Space로 닫기
  //  Space를 누르면 어느 단계든 바로 설명창으로 건너뛴다
  static FLIP = 0.55;
  revealFlip() { const r = this.runeReveal; if (r && r.phase === 'back') { r.phase = 'flip'; r.ft = 0; sfx('rune'); } }
  revealSkipOrClose() {
    const r = this.runeReveal;
    if (!r) return;
    if (r.phase !== 'shown') { r.phase = 'shown'; r.ft = Game.FLIP; r.st = 0; return; }
    if (r.st > 0.25) { this.runeReveal = null; sfx('click'); }
  }
  revealDown() { const r = this.runeReveal; if (r && r.phase === 'back') { r.drag = true; r.dx0 = MOUSE.x; r.dragX = 0; } else this.revealSkipOrClose(); }
  revealMove() {
    const r = this.runeReveal;
    if (!r || !r.drag) return;
    r.dragX = MOUSE.x - r.dx0;
    if (Math.abs(r.dragX) > 70) { r.drag = false; this.revealFlip(); }
  }
  revealUp() {
    const r = this.runeReveal;
    if (!r || !r.drag) return;
    r.drag = false;
    if (Math.abs(r.dragX) < 12) this.revealFlip();   // 그냥 클릭
  }

  // ---- 입력 ----
  onKey(code) {
    // ESC: 기본 무기 선택 / 증강 선택 / 룬석 뒤집기 중에도 일시정지 (그 화면은 계속하기를 누르면 그대로 돌아옴)
    if (!this.over && isKey(code, 'pause')) { this.paused = !this.paused; sfx('click'); return; }
    if (this.paused) { if (code === 'Tab') { this.pauseTab ^= 1; sfx('click'); } return; }
    const card = RUNE_KEYS.slice(0, 3).findIndex(a => isKey(code, a));   // 카드 고르기: 룬석 1~3 키
    if (this.runeReveal) { if (isKey(code, 'use') || code === 'Enter') this.revealSkipOrClose(); return; }
    if (this.weaponSel) { if (card >= 0) this.pickBasic(card); return; }
    if (this.levelup) { if (card >= 0) this.choose(card); else if (isKey(code, 'reroll')) this.reroll(); return; }
    if (this.over || this.rescue) return;
    if (isKey(code, 'aim')) this.autoAim = !this.autoAim;
    const d = RUNE_KEYS.findIndex(a => isKey(code, a));
    if (d >= 0) this.player.runes.select(d);
    if (isKey(code, 'use')) this.player.runes.useSelected(this);
  }
  onRightClick() {
    if (this.runeReveal || this.weaponSel || this.levelup || this.over || this.paused || this.rescue) return;
    this.player.runes.useSelected(this);
  }
  /** 모바일: 룬석 슬롯을 누르면 고르면서 바로 사용 */
  tapRune(i) {
    const rs = this.player.runes;
    rs.select(i);
    if (rs.slots[i]) this.onRightClick();
  }

  // ===========================================================================
  // 매 프레임 갱신
  // ===========================================================================
  update(dt) {
    if (this.flashT > 0) this.flashT = Math.max(0, this.flashT - dt);
    if (this.hurtFlash > 0) this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.5);
    if (this.over) { this.over.t += dt; FX.update(dt); this.updatePopups(dt); return; }
    if (this.paused || this.weaponSel) return;
    if (this.rescue) { this.updateRescue(dt); return; }   // 에덴 구출 연출 중: 게임 시간은 멈춤
    if (this.runeReveal) {   // 룬석 뒤집기 중에는 게임이 멈춘다
      const r = this.runeReveal;
      r.t += dt;
      if (r.phase === 'flip') { r.ft += dt; if (r.ft >= Game.FLIP) { r.phase = 'shown'; r.st = 0; } }
      else if (r.phase === 'shown') r.st += dt;
      if (!r.drag) r.dragX = (r.dragX || 0) * Math.pow(0.001, dt);   // 드래그하다 놓으면 제자리로
      return;
    }
    if (this.levelup) { this.levelup.t += dt; return; }
    if (FX.hitstop > 0) { FX.hitstop -= dt; return; }   // 히트스톱: 강한 타격 순간 잠깐 멈춤

    // 섬광 룬석: 잠시 시간이 느리게 흐르다가 부드럽게 돌아온다
    if (this.slowT > 0) {
      this.slowT = Math.max(0, this.slowT - dt);
      dt *= this.slowT > 0.5 ? 0.25 : 0.25 + 0.75 * (1 - this.slowT / 0.5);
    }
    this.elapsed += dt;
    ENEMY_CLOCK = this.elapsed;
    const p = this.player, runes = p.runes;
    if (p.invulnT > 0) p.invulnT = Math.max(0, p.invulnT - dt);
    if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 6);

    runes.preUpdate(dt, this);        // 룬석 타이머 / 이동속도 배율 / 둔화 오라
    p.move(dt);
    if (p.kb) this._stepKb(p, dt, p.r);
    for (const r of this.rocks) {     // 바위 벽 통과 불가
      if (!r.landed || r.broken) continue;
      let d = dist(p.x, p.y, r.tx, r.ty); const need = r.radius + p.r;
      if (d < need) { if (d < 0.001) { d = 0.001; p.x += 0.001; } p.x = r.tx + (p.x - r.tx) / d * need; p.y = r.ty + (p.y - r.ty) / d * need; }
    }
    // 카메라: 플레이어를 부드럽게 따라가고 맵 경계에서 멈춘다
    const k = 1 - Math.exp(-14 * dt), c = this.cam;
    c.x = clamp(c.x + (p.x - VW / 2 - c.x) * k, 0, MAP_W - VW);
    c.y = clamp(c.y + (p.y - VH / 2 - c.y) * k, 0, MAP_H - VH);
    this.trail.push([p.x, p.y]); if (this.trail.length > 9) this.trail.shift();

    runes.update(dt, this);           // 불길 / 충격파 / 보호막 파괴
    for (const m of this.mons) if (m.kb) this._stepKb(m, dt, 0);
    this.updateArena();

    // ── 웨이브 (1분마다 30초) ──
    if (this.inWave) {
      this.waveRemain -= dt;
      if (this.waveRemain <= 0) {     // 웨이브 종료 보상: 화면 안 랜덤 위치에 보물상자
        this.inWave = false; this.waveT = 0;
        this.spawnChestAt(rand(c.x + 120, c.x + VW - 120), rand(c.y + 150, c.y + VH - 100), 'wave');
        this.banner('웨이브 종료', C.bandage);
      }
    } else {
      this.waveT += dt;
      if (this.waveT >= Game.WAVE_CYCLE) {
        this.inWave = true; this.waveRemain = Game.WAVE_DURATION; this.warnT = Game.WARN_DURATION;
        this.bossSpawned = false; this.waveCount++;
        sfx('warn'); FX.shake(0.3);
      }
    }
    // 보스: 웨이브마다 1마리 (이미 보스가 있으면 생략)
    const bossAlive = this.countKind('boss') > 0;
    if (this.inWave && !this.bossSpawned) {
      this.bossSpawned = true;
      const pt = this.pickSpawnPoint();
      if (pt && !bossAlive) this.spawnBoss(pt[0], pt[1]);
    }
    // 중간보스: 30초마다 (보스가 있는 동안에는 나오지 않음)
    if (!bossAlive) {
      this.minibossT += dt;
      if (this.minibossT >= Game.MINIBOSS_INTERVAL) {
        this.minibossT = 0;
        const pt = this.pickSpawnPoint();
        if (pt) this.spawnMiniboss(pt[0], pt[1]);
      }
    }
    if (this.warnT > 0) this.warnT -= dt;

    // ── 일반 몬스터 스폰 ──
    this.spawnT += dt;
    const sm = this.spawnMult;   // 시간이 지날수록 더 자주
    if (this.spawnT >= Game.SPAWN_INTERVAL / sm) { this.spawnT = 0; this.spawnGroups('straight'); }
    this.trackerT += dt;
    if (this.trackerT >= Game.TRACKER_INTERVAL / sm) { this.trackerT = 0; this.spawnGroups('tracker'); }
    if (this.elapsed >= BRUTE.START) {   // 탱커 '철갑 추적체': 2분부터 (웨이브 중에는 2마리)
      this.bruteT += dt;
      if (this.bruteT >= BRUTE.INTERVAL / sm && this.mons.length < Game.MAX_MONS) {
        this.bruteT = 0;
        for (let k = 0; k < (this.inWave ? 2 : 1); k++) {
          const pt = this.pickSpawnPoint();
          if (pt) this.mons.push(mkBrute(Arena.cx(pt[0], 20), Arena.cy(pt[1], 20), this.trackerSpeed(), this.elapsed));
        }
      }
    }
    // 친구 게임 적: 친구 게임 규칙 그대로 (최대 수와 간격이 시간에 따라 늘어남, 친구 적만 따로 셈)
    const mins = this.elapsed / 60, fCap = Math.round(Math.min(130, 26 + Math.floor(mins * 28)) * sm);
    this.fSpawnT -= dt;
    if (this.fSpawnT <= 0) {
      let fCount = 0; for (const m of this.mons) if (m.xp) fCount++;
      if (fCount < fCap && this.mons.length < Game.MAX_MONS) {
        this.fSpawnT = Math.max(0.16, 0.72 - mins * 0.14) / sm;
        const pack = mins > 1.5 ? 3 : mins > 0.6 ? 2 : 1;
        for (let k = 0; k < pack; k++) this.spawnFriend();
      } else this.fSpawnT = 0.1;
    }
    // 부서진 보급 상자는 게임 시간 8초 뒤에 다시 생긴다
    for (let k = this.crateTimers.length - 1; k >= 0; k--) {
      this.crateTimers[k] -= dt;
      if (this.crateTimers[k] <= 0) { this.crateTimers.splice(k, 1); this.spawnCrate(); }
    }
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }

    // ── 몬스터 이동 / 접촉 피해 ──
    const mons = this.mons; let j = 0;
    for (let i = 0; i < mons.length; i++) {
      const m = mons[i];
      if (m.flash > 0) m.flash -= dt;
      if (m.intro > 0) {   // 현상수배 표적: 조준 고리가 좁혀지는 동안은 아직 내려오지 않음
        m.intro -= dt;
        if (m.intro <= 0) this.huntLand(m);
        mons[j++] = m; continue;
      }
      updMon(m, dt, this);
      if (m.kind === 'straight' && Arena.outside(m.x, m.y)) continue;   // 전투 구역(맵) 밖으로 나가면 사라짐
      if (m.atk > 0 && m.kind !== 'ranged' && dist(m.x, m.y, p.x, p.y) < m.r + p.r) this.hurtPlayer(m.atk);
      mons[j++] = m;
    }
    mons.length = j;

    this.updateBossStuff(dt);
    this.separate();
    // 보스 바위는 일반 몬스터도 막는다 (보스·중간보스는 통과)
    for (const r of this.rocks) {
      if (!r.landed || r.broken) continue;
      for (const m of mons) {
        if (m.tier > 0 || m.kind === 'crate') continue;
        const need = r.radius + m.r;
        let dx = m.x - r.tx, dy = m.y - r.ty;
        if (Math.abs(dx) >= need || Math.abs(dy) >= need) continue;
        let d = Math.hypot(dx, dy);
        if (d >= need) continue;
        if (d < 0.001) { dx = 1; dy = 0; d = 1; }
        m.x = r.tx + dx / d * need; m.y = r.ty + dy / d * need;
      }
    }
    runes.enforcePulseWalls(this);    // 충격파 고리 안쪽 진입 차단

    // ── 조준 / 무기 ──
    if (this.autoAim) {
      const t = this.nearest(p.x, p.y);
      p.hasTarget = !!t;
      if (t) p.face = deg(Math.atan2(t.y - p.y, t.x - p.x));
    } else {
      p.hasTarget = true;
      if (SET.mobile) { if (p.moveAng !== undefined) p.face = deg(p.moveAng); }   // 모바일: 이동 방향으로 조준, 멈추면 마지막 방향 유지
      else p.face = deg(Math.atan2(MOUSE.y + c.y - p.y, MOUSE.x + c.x - p.x));
    }
    // 광폭화 룬석: 이번 프레임에 무기가 준 피해를 배율만큼 증폭
    const mult = runes.damageMult();
    for (const m of mons) {
      if (m.wslow > 0) m.wslow -= dt;
      if (m.gslow > 0) m.gslow -= dt;
      if (m.zslow > 0) m.zslow -= dt;
    }
    for (const [id, sk] of [...p.skills]) this.trackDmg(id, () => sk.update(dt, this), mult);   // 무기마다 준 피해를 따로 기록

    // ── 데미지 숫자 → 처치 처리 ──
    this.collectDamage();
    j = 0;
    for (let i = 0; i < mons.length; i++) { const m = mons[i]; if (m.hp <= 0) this.onDeath(m); else mons[j++] = m; }
    mons.length = j;

    // ── 붕대 / 자석 ──
    this.drops = this.drops.filter(it => {
      it.age += dt;
      if (dist(it.x, it.y, p.x, p.y) >= Game.DROP_PICKUP) return true;
      if (it.kind === 'magnet') { for (const o of this.orbs) o.magnet = true; this.banner('자석!', '#78d2ff'); FX.ring(p.x, p.y, 20, 500, 0.6, '#78d2ff', 3); }
      else if (it.kind === 'emp') this.emp();
      else { p.hp = Math.min(p.maxHp, p.hp + Game.BANDAGE_HEAL); this.prevHp = p.hp; this.banner(`붕대! HP +${Game.BANDAGE_HEAL}`, C.bandage); FX.burst(p.x, p.y, C.bandage, 24, 260, 0.6, 2.6); }
      sfx('pickup');
      return false;
    });
    this.updateChests(dt);

    // ── 경험치 오브 ──
    let gained = 0; j = 0;
    const orbs = this.orbs, pr = p.pickupR, pr2 = pr * pr, eat2 = (p.r + 10) ** 2;
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      let dx = o.x - p.x, dy = o.y - p.y;
      if (!o.pull && dx * dx + dy * dy < pr2) o.pull = true;   // 자석 범위 안에 들어오면 끌려온다
      if (o.magnet || o.pull) {   // 자석 아이템: 매우 빠르게 / 범위 안: 점점 빨라지며
        o.pv = Math.min(o.magnet ? Game.XP_MAGNET_SPEED : 14, (o.pv || 3) + dt * 60);
        const l = Math.hypot(dx, dy) || 1, st = o.pv * dt * 60;
        if (st >= l) { o.x = p.x; o.y = p.y; } else { o.x -= dx / l * st; o.y -= dy / l * st; }
        dx = o.x - p.x; dy = o.y - p.y;
      }
      if (dx * dx + dy * dy < eat2) { gained += o.v; continue; }
      orbs[j++] = o;
    }
    orbs.length = j;
    if (gained > 0) {
      sfx('xp');
      const n = p.gainXp(gained);
      if (n > 0) { for (let k = n - 1; k >= 0; k--) this.pickQueue.push(p.level - k); FX.ring(p.x, p.y, 20, 200, 0.5, C.gold, 5); FX.burst(p.x, p.y, C.gold, 30, 380, 0.6, 2.6); sfx('levelup'); }
    }

    // 룬석 뒤집기 → 융합 무기 선택창 (보스류 보물상자) → 밀린 레벨업 선택창 순서로 하나씩
    if (this.revealQueue.length && !this.runeReveal && !this.levelup && !this.over) {
      this.runeReveal = Object.assign(this.revealQueue.shift(), { phase: 'back', t: 0, ft: 0, st: 0, dragX: 0, drag: false });
      sfx('chest');
    }
    if (this.fusionQueue.length && !this.levelup && !this.runeReveal && !this.over) {
      this.fusionQueue.shift();
      const opts = p.fusionOptions();
      if (opts.length) this.levelup = { kind: 'fusion', offers: opts.slice(0, 3).map(f => [f, 0]), t: 0 };
    }
    if (this.pickQueue.length && !this.levelup && !this.runeReveal && !this.over) {
      const lv = this.pickQueue.shift(), offers = this.buildOffers(lv);
      if (offers.length) this.levelup = { kind: 'levelup', lv, offers, t: 0, rerolls: Game.REROLLS };
      else { this.heal(this.pickHeal(), C.bandage); this.banner(`레벨 업!  HP +${this.pickHeal()}`, C.bandage); }   // 더 받을 아이템이 없으면 회복만
    }

    for (const b of this.banners) b.age += dt;
    if (this.huntCards.length) {   // 수배 전단: 한 번에 하나씩 (뒤에 밀려 있으면 조금 빨리 넘김)
      const hc = this.huntCards[0];
      hc.age += dt * (this.huntCards.length > 1 ? 1.5 : 1);
      if (hc.done && !hc.stamped && hc.age >= 0.46) { hc.stamped = true; sfx('thud'); }   // 도장 찍히는 소리
      if (hc.age >= (hc.done ? Game.HUNT_DONE_DUR : Game.HUNT_CARD_DUR)) this.huntCards.shift();
    }
    this.banners = this.banners.filter(b => b.age < 1.6);
    this.updatePopups(dt);
    FX.update(dt);
  }

  /** 바위 / 참격 / 푸른 불길 / 적 탄 */
  updateBossStuff(dt) {
    const p = this.player;
    if (this.countKind('boss') === 0 && (this.rocks.length || this.slashes.length)) {
      // 보스가 모두 쓰러지면 바위 벽과 참격도 사라진다
      for (const r of this.rocks) if (r.landed) { FX.burst(r.tx, r.ty, '#b7a4e8', 16, 300, 0.5, 2.6); FX.ring(r.tx, r.ty, 10, r.radius, 0.4, '#b7a4e8', 3); }
      this.rocks.length = 0; this.slashes.length = 0;
    }
    for (const r of this.rocks) r.update(dt, this);
    this.rocks = this.rocks.filter(r => !r.broken);
    for (const s of this.slashes) s.update(dt, this);
    this.slashes = this.slashes.filter(s => !s.done);

    for (const f of this.bossFire) f[2] += dt;
    this.bossFire = this.bossFire.filter(f => f[2] < BOSS.FIRE_LIFE);
    if (this.bossFire.some(f => dist(f[0], f[1], p.x, p.y) < 9 + p.r)) {
      this.bossFireT += dt;
      if (this.bossFireT >= 0.5) { this.bossFireT = 0; this.hurtPlayer(4); }
    } else this.bossFireT = 0.5;   // 다시 밟는 순간 바로 1회 피해

    let j = 0;
    for (const b of this.ebullets) {
      const slowed = this.slowAura && dist(b.x, b.y, p.x, p.y) < this.slowAura;   // 둔화 오라 안: 탄환도 느려짐
      const step = Math.min(b.spd * dt * 60 * (slowed ? SLOW_AURA_BULLET : 1), b.max - b.trav);
      const ox = b.x, oy = b.y;
      b.x += b.dx * step; b.y += b.dy * step; b.trav += step;
      if (segDist(ox, oy, b.x, b.y, p.x, p.y) < p.r + b.r) { this.hurtPlayer(b.dmg); FX.burst(b.x, b.y, b.col, 5, 160, 0.25, 2); continue; }
      if (this.rocks.some(r => r.landed && dist(b.x, b.y, r.tx, r.ty) < r.radius)) { FX.burst(b.x, b.y, b.col, 4, 140, 0.2, 1.8); continue; }
      if (b.trav < b.max - 1e-6) this.ebullets[j++] = b;
    }
    this.ebullets.length = j;
  }
}

}
